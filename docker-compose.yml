version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    container_name: database
    hostname: database

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: redis
    hostname: redis

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    container_name: rabbitmq
    hostname: rabbitmq

  server:
    build: ./server
    ports:
      - "8002:80"
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/jobdb
      - SCRAPER_SERVICE_URL=http://127.0.0.1:80/scraper
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
      - rabbitmq
      - redis
    container_name: server
    hostname: server
    volumes:
      - ./server:/app
      - /app/__pycache__
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - APP_PREFIX=APP_
  #     - ASSET_DIR=./.next/static
  #     - APP_API_URL=http://localhost:8002
