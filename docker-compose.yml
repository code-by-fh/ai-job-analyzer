version: '3.8'

services:
  ai-job-agent-database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-jobdb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    container_name: ai-job-agent-database
    hostname: ai-job-agent-database

  ai-job-agent-redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: ai-job-agent-redis
    hostname: ai-job-agent-redis

  ai-job-agent-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    container_name: ai-job-agent-rabbitmq
    hostname: ai-job-agent-rabbitmq

  ai-job-agent-botosaurus:
    image: doublelayer/botosaurus-api-service:latest
    ports:
      - "8000:8000"
    environment:
      - MAX_WORKERS=${BOTOSAURUS_MAX_WORKERS:-3}
      - HEADLESS=true
    container_name: ai-job-agent-botosaurus
    hostname: ai-job-agent-botosaurus

  ai-job-agent-server:
    build: ./server
    ports:
      - "8002:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@ai-job-agent-database:5432/${POSTGRES_DB:-jobdb}
      - SCRAPER_SERVICE_URL=http://127.0.0.1:8081
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@ai-job-agent-rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://ai-job-agent-redis:6379/0
      - PYTHONUNBUFFERED=1
      - RENDER_API_URL=${RENDER_API_URL:-http://ai-job-agent-botosaurus:8000/render}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - ai-job-agent-database
      - ai-job-agent-rabbitmq
      - ai-job-agent-redis
      - ai-job-agent-botosaurus
    container_name: ai-job-agent-server
    hostname: ai-job-agent-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - /app/__pycache__
  ai-job-agent-frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - APP_PREFIX=APP_
      - ASSET_DIR=./.next/static
      - APP_API_URL=${APP_API_URL:-http://localhost:8002}
    container_name: ai-job-agent-frontend
    hostname: ai-job-agent-frontend
    depends_on:
      - ai-job-agent-server

volumes:
  db_data:
