version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    container_name: database
    hostname: database

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: redis
    hostname: redis

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    container_name: rabbitmq
    hostname: rabbitmq

  scraper-service:
    build: ./scraper-service
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
      - redis
    container_name: scraper-service
    hostname: scraper-service

  scraper-worker:
    build: ./scraper-service
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2 -Q scraper_queue
    environment:
      - SERVICE_MODE=worker
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
      - redis
    container_name: scraper-worker
    hostname: scraper-worker

  ai-api:
    build: ./ai-service
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/jobdb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SCRAPER_SERVICE_URL=http://scraper-service:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
      - scraper-service
    container_name: ai-api
    hostname: ai-api
    volumes:
      - ./ai-service:/app
      - /app/__pycache__

  ai-worker:
    build: ./ai-service
    command: celery -A celery_app worker --loglevel=info --concurrency=4 -Q ai_queue
    environment:
      - SERVICE_MODE=worker
      - DATABASE_URL=postgresql://user:password@database:5432/jobdb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SCRAPER_SERVICE_URL=http://scraper-service:8000
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
      - rabbitmq
      - redis
      - scraper-service
    container_name: ai-worker
    hostname: ai-worker
    volumes:
      - ./ai-service:/app
      - /app/__pycache__

  ai-beat:
    build: ./ai-service
    command: celery -A celery_config beat --loglevel=info
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://user:password@database:5432/jobdb
      - SCRAPER_SERVICE_URL=http://scraper-service:8000
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
      - rabbitmq
      - redis
      - ai-worker
      - scraper-service
    container_name: ai-beat
    hostname: ai-beat
    volumes:
      - ./ai-service:/app
      - /app/__pycache__

  # frontend:
