version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-jobdb}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    container_name: database
    hostname: database

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: redis
    hostname: redis

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    container_name: rabbitmq
    hostname: rabbitmq

  server:
    build: ./server
    ports:
      - "8002:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-jobdb}
      - SCRAPER_SERVICE_URL=http://127.0.0.1:8081
      - CELERY_BROKER_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      - RENDER_API_URL=${RENDER_API_URL:-http://host.docker.internal:8000/render}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - database
      - rabbitmq
      - redis
    container_name: server
    hostname: server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app
      - /app/__pycache__
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - APP_PREFIX=APP_
      - ASSET_DIR=./.next/static
      - APP_API_URL=${APP_API_URL:-http://localhost:8002}
    container_name: frontend
    hostname: frontend
    depends_on:
      - server

volumes:
  db_data:
