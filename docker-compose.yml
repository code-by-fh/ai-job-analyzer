version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jobdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    container_name: database
    hostname: database

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: redis
    hostname: redis

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    container_name: rabbitmq
    hostname: rabbitmq

  scraper-service:
    build: ./scraper-service
    ports:
      - "8001:80"
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
      - redis
    container_name: scraper-service
    hostname: scraper-service

  ai-service:
    build: ./ai-service
    ports:
      - "8002:80"
    environment:
      - DATABASE_URL=postgresql://user:password@database:5432/jobdb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SCRAPER_SERVICE_URL=http://scraper-service:80
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      - database
      - rabbitmq
      - redis
      - scraper-service
    container_name: ai-service
    hostname: ai-service
    volumes:
      - ./ai-service:/app
      - /app/__pycache__

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - APP_PREFIX=APP_
      - ASSET_DIR=./.next/static
      - APP_API_URL=http://localhost:8002
      - APP_API_WS_URL=http://localhost:8002
      - APP_API_SCRAPER_URL=http://localhost:8001
    container_name: frontend
    hostname: frontend
    depends_on:
      - ai-service

volumes:
  db_data:
