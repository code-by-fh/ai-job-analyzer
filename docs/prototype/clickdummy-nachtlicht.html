/* ===================== Bewerbungen ===================== */
const PIPE_GROUPS = ['DRAFTED', 'APPLIED', 'INTERVIEW', 'OFFER'];
const GROUP_LABEL = { DRAFTED: 'Vorgemerkt', APPLIED: 'Beworben', INTERVIEW: 'Interview', OFFER: 'Angebot' };
/* One line per phase: what it means and what usually comes next. Shown in the group header. */
const GROUP_HINT = {
  DRAFTED: 'Noch nicht beworben. Firma recherchieren, Unterlagen erstellen, dann bewerben.',
  APPLIED: 'Die Bewerbung ist raus. Ohne Antwort nach zwei Wochen kurz nachfassen.',
  INTERVIEW: 'Gespräche stehen an. Vorbereitung durchgehen und Termine im Blick behalten.',
  OFFER: 'Ein Angebot liegt vor. Konditionen prüfen und vor der Frist entscheiden.',
  CLOSED: 'Zusagen, Absagen und Rückzüge. Notizen und Unterlagen bleiben zum Nachschlagen.',
};
const stageColor = (st) => STAGES[stageIndex(st)].color;
const groupHead = (st, n, cols) => `<tr class="group-row"><td colspan="${cols}"><div class="group-head"><span class="group-label">${stageTag(st)}<span class="count-plain">${n}</span></span><span class="group-hint">${GROUP_HINT[st]}</span></div></td></tr>`;
function pipelineJobs(status) { return S.jobs.filter((j) => j.status === status).sort((a, b) => currentSince(a) - currentSince(b)); }
function renderPipeline(r) {
  const view = r.q.ansicht === 'board' ? 'board' : 'list';
  const closed = S.jobs.filter((j) => CLOSED_STATUSES.includes(j.status));
  const active = PIPE_GROUPS.reduce((n, s) => n + pipelineJobs(s).length, 0);
  const showClosed = r.q.abgeschlossen === '1';
  return `<div class="page"><div class="page-head"><div><h1 class="page-title">Bewerbungen</h1><p class="page-lede">${active} aktiv. Sortiert nach Phase, darin nach Wartezeit.</p></div>
    <div class="row"><div class="seg" role="group" aria-label="Ansicht"><button type="button" aria-pressed="${view === 'list'}" data-act="pipeView" data-v="list">${icon('list')}Liste</button><button type="button" aria-pressed="${view === 'board'}" data-act="pipeView" data-v="board">${icon('columns')}Board</button></div></div></div>
    ${renderFlow(closed)}
    ${view === 'list' ? renderPipeTable() : renderBoard()}
    <div class="closed-toggle">${btn(`${showClosed ? 'Abgeschlossene ausblenden' : 'Abgeschlossen'} (${closed.length})`, 'toggleClosed', { cls: 'btn-ghost btn-sm', ico: showClosed ? 'chevD' : 'chevR' })}</div>
    ${showClosed ? renderClosedTable(closed) : ''}</div>`;
}
/* Pipeline overview: one segment per phase, width proportional to the number of applications in it.
   The note under each bar is the one fact that phase needs attention for. */
function flowNote(st, jobs) {
  if (st === 'DRAFTED') { const n = jobs.filter((j) => docsState(j) !== 'ready').length; return n ? { text: `${n} ohne fertige Unterlagen` } : { text: jobs.length ? 'alle bereit' : '' }; }
  if (st === 'APPLIED') { const n = jobs.filter(followUpDue).length; return n ? { text: `${n} nachfassen`, warn: true } : { text: jobs.length ? 'warten auf Antwort' : '' }; }
  if (st === 'INTERVIEW') { const d = jobs.map((j) => j.interviewDate).filter((x) => x && x >= startOfDay(now())).sort((a, b) => a - b)[0]; return d ? { text: `Termin ${fmtD(d)}`, warn: daysBetween(now(), d) <= 2 } : { text: '' }; }
  if (st === 'OFFER') { const d = jobs.map((j) => j.offerDeadline).filter(Boolean).sort((a, b) => a - b)[0]; return d ? { text: `Frist ${fmtD(d)}` } : { text: '' }; }
  const rej = jobs.filter((j) => j.status === 'REJECTED').length;
  return { text: jobs.length ? `${rej} Absage${rej === 1 ? '' : 'n'}, ${jobs.length - rej} andere` : '' };
}
function renderFlow(closed) {
  const rows = [...PIPE_GROUPS.map((st) => ({ st, jobs: pipelineJobs(st), label: GROUP_LABEL[st] })), { st: 'CLOSED', jobs: closed, label: 'Abgeschlossen' }];
  const max = Math.max(1, ...rows.map((r) => r.jobs.length));
  const active = rows.slice(0, 4).reduce((n, r) => n + r.jobs.length, 0);
  const seg = (r) => {
    const n = r.jobs.length; const note = flowNote(r.st, r.jobs);
    const style = `--n:${Math.max(n, 0.35)};--c:${n ? stageColor(r.st) : 'var(--line-strong)'};--wm:${n ? Math.max(6, (n / max) * 100) : 3}%`;
    return `<button type="button" class="flow-seg ${r.st === 'CLOSED' ? 'closed' : ''}" style="${style}" data-act="flowJump" data-st="${r.st}" aria-label="${r.label}: ${n}${note.text ? ', ' + note.text : ''}. Zur Gruppe springen">
      <span class="flow-head"><span class="flow-n">${n}</span><span class="flow-label">${r.label}</span></span>
      <span class="flow-track" aria-hidden="true"><i></i></span>
      <span class="flow-note ${note.warn ? 'warn' : ''}">${note.text}</span></button>`;
  };
  return `<section class="flow anim-flow" aria-label="Übersicht der Phasen"><div class="flow-bar">${rows.map(seg).join('')}</div>
    <p class="flow-sum">${active} aktiv, ${closed.length} abgeschlossen. Ein Klick auf eine Phase springt zur Gruppe.</p></section>`;
}
function renderPipeTable() {
  // One <tbody> per phase: each reads as its own framed section, while all rows share the table's column grid.
  const groups = PIPE_GROUPS.filter((st) => pipelineJobs(st).length).map((st, i) => {
    const jobs = pipelineJobs(st);
    const gap = i ? '<tr class="group-gap" aria-hidden="true"><td colspan="6"></td></tr>' : '';
    return `<tbody class="pipe-group" id="grp-${st}" tabindex="-1" style="--c:${stageColor(st)}">${gap}${groupHead(st, jobs.length, 6)}${jobs.map(pipeRow).join('')}</tbody>`;
  }).join('');
  return `<table class="table stack-sm pipe-table"><thead><tr><th>Stelle / Firma</th><th>Phase</th><th>Nächster Schritt</th><th>Seit / Fällig</th><th>Unterlagen</th><th class="r">Score</th></tr></thead>${groups}</table>`;
}
function pipeRow(j) {
  const ns = nextStep(j);
  const due = dueCell(j);
  const sel = route().q.job === String(j.id);
  return `<tr class="click" tabindex="0" data-act="openDrawer" data-id="${j.id}" ${sel ? 'aria-current="true"' : ''}>
    <td class="first-sm"><div><div class="t-title">${esc(j.title)}</div><div class="t-sub">${esc(j.company)} · ${esc(j.city)}</div></div></td>
    <td class="hide-sm">${stageTag(j.status)}</td>
    <td data-label="Nächster Schritt"><span class="next-cell ${ns.tone === 'warn' ? 'warn' : ''}">${ns.tone === 'warn' ? icon('clock') : ''}${esc(ns.short)}</span></td>
    <td data-label="Seit / Fällig" class="num ${due.tone === 'warn' ? 't-warn' : 'muted'}">${due.text}</td>
    <td data-label="Unterlagen" class="docs-cell">${docsCell(j)}</td>
    <td data-label="Score" class="r num">${j.score}</td></tr>`;
}
function renderClosedTable(closed) {
  return `<table class="table stack-sm pipe-table" style="margin-top:10px"><tbody class="pipe-group" id="grp-CLOSED" tabindex="-1" style="--c:${stageColor('CLOSED')}">${groupHead('CLOSED', closed.length, 4)}${closed.map((j) => `<tr class="click" tabindex="0" data-act="openDrawer" data-id="${j.id}"><td><div class="t-title">${esc(j.title)}</div><div class="t-sub">${esc(j.company)} · ${esc(j.city)}</div></td><td>${stageTag(j.status)}</td><td class="num muted" data-label="Abgeschlossen">${fmtDY(currentSince(j))}</td><td class="r num" data-label="Score">${j.score}</td></tr>`).join('')}</tbody></table>`;

function renderBoard() {
  const cols = PIPE_GROUPS.filter((st) => pipelineJobs(st).length);
  return `<div class="board">${cols.map((st) => `<section class="bcol" id="grp-${st}" tabindex="-1" aria-label="${GROUP_LABEL[st]}" style="--c:${stageColor(st)}"><div class="bcol-head">${stageTag(st)}<span class="count-plain">${pipelineJobs(st).length}</span><span class="group-hint">${GROUP_HINT[st]}</span></div>
    ${pipelineJobs(st).map((j) => {
      const ns = nextStep(j);
      const menu = ui.popover === `card-${j.id}` ? `<div class="popover down-right anim-pop" role="menu" aria-label="Phase ändern"><div class="pop-head">Phase ändern</div>${[...STAGES.slice(0, 5).map((s) => s.key), 'CLOSED'].map((k, i) => `<button type="button" role="menuitem" class="pop-item" data-act="boardMove" data-id="${j.id}" data-idx="${i}" ${stageIndex(j.status) === i ? 'aria-current="true"' : ''}><span class="stage" style="--c:${STAGES[i].color}">${STAGES[i].label}</span>${stageIndex(j.status) === i ? `<span style="margin-left:auto">${icon('check')}</span>` : ''}</button>`).join('')}</div>` : '';
      return `<article class="bcard" data-act="openDrawer" data-id="${j.id}" tabindex="0"><div class="bcard-title">${esc(j.title)}</div><div class="bcard-sub">${esc(j.company)} · ${esc(j.city)}</div>
        <div class="bcard-foot"><span class="next-cell ${ns.tone === 'warn' ? 'warn' : ''}">${ns.tone === 'warn' ? icon('clock') : ''}${esc(ns.short)}</span><span class="num muted">${j.score}</span></div>
        <div class="bcard-menu pop-anchor"><button type="button" class="btn btn-ghost btn-sm btn-icon" data-act="togglePop" data-pop="card-${j.id}" data-popover-trigger aria-haspopup="menu" aria-expanded="${ui.popover === `card-${j.id}`}" aria-label="Phase ändern">${icon('more')}</button>${menu}</div></article>`;
    }).join('')}</section>`).join('')}</div>`;
}

/* Live crawl console: one cell per result page, the last log lines streaming in below. */
function crawlSegs(t) {

}
function renderCrawlLive(t) {

    <div class="segbar" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="${t.pages}" aria-valuenow="${t.page}">${crawlSegs(t)}</div>

}

/* ===================== command palette (Strg/Cmd+K) ===================== */
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function paletteItems(q) {
  const n = norm(q.trim());
  const hit = (...xs) => !n || xs.some((x) => norm(x).includes(n));
  const jobs = S.jobs.filter((j) => (j.status !== 'OPEN' || j.inbox === 'new') && hit(j.title, j.company, j.city))
    .sort((a, b) => Number(stageIndex(a.status) === 5) - Number(stageIndex(b.status) === 5) || b.score - a.score)
    .slice(0, n ? 8 : 5)
    .map((j) => ({ group: 'Stellen', ico: j.status === 'OPEN' ? 'inbox' : 'briefcase', label: j.title, sub: `${j.company}, ${j.city}`, end: `${statusLabel(j.status)}  ${j.score}`,
      run: () => go(j.status === 'OPEN' ? hashFor(['eingang'], { job: j.id }) : hashFor(['bewerbungen'], { job: j.id })) }));
  const actions = [
    { label: 'Quelle hinzufügen', ico: 'plus', run: () => { go('#/quellen'); ACT.openAddSource(); } },
    { label: 'Stelle per URL importieren', ico: 'link', run: () => ACT.openImport() },
    ...S.sources.filter((s) => s.status !== 'error').map((s) => ({ label: `${s.name} jetzt durchsuchen`, ico: 'play', keys: 'crawl lauf', run: () => { go('#/quellen'); startCrawl(s); } })),
    { label: 'Darstellung wechseln', ico: getTheme() === 'dark' ? 'sun' : 'moon', keys: 'theme hell dunkel', run: () => ACT.cycleTheme() },

  if (r.q.job && r.page === 'bewerbungen') { setQuery({ job: null }); restoreReturnFocus(); return true; }
  if (r.q.quelle) { ui.srcDelete = null; setQuery({ quelle: null }); restoreReturnFocus(); return true; }
  if (r.q.job && r.page === 'eingang' && isMobile()) { ACT.clearInboxSel(); return true; }
  return false;
}
function restoreReturnFocus() {
  const sel = ui.returnFocus; ui.returnFocus = null;
  if (sel) setTimeout(() => document.querySelector(sel)?.focus({ preventScroll: true }), 0);
}

/* ===================== theme & direction ===================== */
function getPref(k, def) { try { return localStorage.getItem('ajp-' + k) || def; } catch (e) { return def; } }
function setPref(k, v) { try { localStorage.setItem('ajp-' + k, v); } catch (e) { /* storage unavailable: preference lasts for this session only */ } prefs[k === 'nl-theme' ? 'theme' : k] = v; }
/* Own storage key: "Nachtlicht" opens dark by default, independent of the theme chosen in the other prototype. */
const prefs = { theme: getPref('nl-theme', 'dark') };
const getTheme = () => prefs.theme;
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const mode = prefs.theme === 'system' ? (darkQuery.matches ? 'dark' : 'light') : prefs.theme;
  document.documentElement.dataset.mode = mode;
}

/* ===================== prototype control ===================== */
const PROTO_LINKS = [
  ['Bildschirme', [['#/eingang', 'Eingang'], ['#/bewerbungen', 'Bewerbungen (Liste)'], ['#/bewerbungen?ansicht=board', 'Bewerbungen (Board)'], ['#/quellen', 'Quellen'], ['#/profil/ziel', 'Profil'], ['#/einstellungen/allgemein', 'Einstellungen']]],
  ['Eingang', [['#/eingang/start', 'Ersteinrichtung'], ['#/eingang/leer', 'Leerer Eingang'], ['#/eingang?tab=unter', 'Unter Schwellwert'], ['#/eingang?tab=aus', 'Aussortiert'], ['#/job/1', 'Neue Stelle als Seite']]],
  ['Stelle in Phase …', [['#/job/8', 'Vorgemerkt, ohne Recherche'], ['#/job/3?reiter=unterlagen', 'Vorgemerkt, Unterlagen halb fertig'], ['#/job/9', 'Vorgemerkt, bereit zum Bewerben'], ['#/bewerbungen?job=10', 'Beworben, Nachfassen fällig (Drawer)'], ['#/job/11', 'Beworben, warten'], ['#/job/12', 'Interview, ohne Vorbereitung'], ['#/job/13?reiter=interview', 'Interview mit Vorbereitung'], ['#/job/14', 'Angebot'], ['#/job/15?reiter=verlauf', 'Abgeschlossen (Absage)']]],
  ['Weitere Zustände', [['#/quellen?quelle=indeed', 'Quelle mit Fehler'], ['act:openAddSource', 'Quelle hinzufügen'], ['act:openImport', 'Stelle per URL importieren'], ['act:openPalette', 'Suche (Strg/Cmd+K)'], ['#/profil/vorlagen', 'Vorlagen'], ['#/profil/nachweise', 'Nachweise'], ['#/einstellungen/benachrichtigungen', 'Benachrichtigungen'], ['#/einstellungen/ki-aufgaben', 'KI-Aufgaben'], ['#/anmelden', 'Anmeldung']]],
];
function renderProto() {
  const p = $('proto');
  const panel = ui.protoOpen ? `<div class="proto-panel" role="dialog" aria-label="Prototyp-Steuerung">
    <h2>Darstellung</h2><div class="seg">${[['dark', 'Dunkel'], ['light', 'Hell'], ['system', 'System']].map(([v, l]) => `<button type="button" aria-pressed="${prefs.theme === v}" data-act="setTheme" data-v="${v}">${l}</button>`).join('')}</div>
    <h2>Springen zu</h2><ul class="proto-links">${PROTO_LINKS.map(([g, links]) => `<li class="grp">${g}</li>${links.map(([h, l]) => `<li>${h.startsWith('act:') ? `<a href="#" data-act="protoJump" data-target="${h.slice(4)}">${l}</a>` : `<a href="${h}">${l}</a>`}</li>`).join('')}`).join('')}</ul>
    <div class="row" style="margin-top:12px">${btn('Daten zurücksetzen', 'resetData', { cls: 'btn-sm btn-ghost', ico: 'refresh' })}</div></div>` : '';
  p.innerHTML = `${panel}<div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-sm proto-toggle" data-act="protoToggle" aria-expanded="${ui.protoOpen}">${icon(ui.protoOpen ? 'chevD' : 'sliders')}<span>Prototyp</span></button></div>`;
}
ACT.protoJump = (d, el, e) => { e.preventDefault(); if (d.target === 'openAddSource') { go('#/quellen'); ACT.openAddSource(); } else ACT[d.target](); };

/* ===================== event wiring ===================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (ui.popover && !e.target.closest('.popover, [data-popover-trigger]')) { ui.popover = null; if (!el) { render(); return; } }
  if (!el || el.disabled || el.closest('[contenteditable="true"]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')?.startsWith('#/')) e.preventDefault();
  if (el.tagName === 'A' && el.dataset.act === 'toastClose') { fn(el.dataset, el, e); return; }
  fn(el.dataset, el, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el.dataset, el, e); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el.dataset, el, e); });
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.dataset.submit === 'login') go('#/eingang'); });
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey) && route().page !== 'anmelden') { e.preventDefault(); if (ui.palette) { ui.palette = null; render(); } else openPalette(); return; }
  if (ui.palette && t.id === 'pal-input') {
    const n = ui.palette.items.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (n) { ui.palette.i = (ui.palette.i + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; refreshPalette(); } return; }
    if (e.key === 'Enter') { e.preventDefault(); runPalette(ui.palette.i); return; }
  }
  if (e.key === 'Escape') { if (closeTopLayer()) e.preventDefault(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter]({ ...t.dataset, src: t.id }, t, e); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-act]:not(button):not(a):not(input)')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Tab') trapFocus(e);
});
function trapFocus(e) {
  const dlg = [...document.querySelectorAll('#overlay [aria-modal="true"]')].pop();
  if (!dlg) return;
  const items = [...dlg.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not(.sr-only), select, textarea, [tabindex="0"]')].filter((x) => x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0]; const last = items[items.length - 1];
  if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
let lastOverlayKey = '';
window.addEventListener('hashchange', () => {
  const r = route();
  ui.popover = null; ui.moreOpen = false; ui.confirm = null; ui.palette = null;
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  if (r.page !== 'quellen' && r.page !== 'eingang') ui.addSource = null;
  render();
  const key = $('overlay').innerHTML ? ($('overlay').querySelector('[data-anim-key]')?.dataset.animKey || '') : '';
  if (key && key !== lastOverlayKey) $('overlay').querySelector('[aria-modal="true"]')?.focus();
  if (!key) window.scrollTo(0, r.page === 'job' ? 0 : window.scrollY);
  lastOverlayKey = key;
});
darkQuery.addEventListener('change', () => { applyTheme(); });
window.matchMedia('(max-width: 767px)').addEventListener('change', () => render());

/* ===================== boot ===================== */
applyTheme();
(function boot() {
  if (!location.hash) history.replaceState(null, '', '#/eingang');
  const r = route();
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  render();
})();
</script>
