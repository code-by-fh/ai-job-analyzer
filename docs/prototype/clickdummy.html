/*
  Token system. Directions and themes are pure custom-property overrides, so the same
  markup re-skins. JS resolves "System" into data-mode=light|dark on <html>.

  Accent choice ("Ruhiges Werkzeug"): deep petrol teal oklch(0.52 0.095 200).
  - It is clearly not the indigo/purple of the current UI, so the redesign reads as a new product.
  - It sits between the status hues (ochre for interview, green for offer, red for errors),
    so the accent is never mistaken for a status.
  - Low chroma keeps it calm for an app that is opened occasionally and read carefully.
*/
:root {
  --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-title: var(--font-ui);
  --font-serif: "Iowan Old Style", "Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-code: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-16: 16px; --fs-20: 20px;
  --fs-body: 14px; --fs-list: 13.5px;
  --title-weight: 600; --title-track: -0.012em;

  --r-ctl: 6px; --r-panel: 8px; --r-pill: 999px;
  --ctl-h: 32px; --ctl-h-sm: 26px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --page-pad: 32px; --sidebar-w: 232px; --list-w: 400px;

  --ease: cubic-bezier(.2,.7,.3,1); --t-fast: 120ms; --t-mid: 170ms;

  /* light, quiet */
  --bg: oklch(0.982 0.002 230);
  --surface: oklch(0.997 0.001 230);
  --sunken: oklch(0.962 0.003 230);
  --raised: oklch(0.975 0.003 230);
  --float: oklch(0.997 0.001 230);
  --hover: oklch(0.948 0.004 230);
  --selected: oklch(0.945 0.016 200);
  --field: oklch(0.997 0.001 230);
  --line: oklch(0.905 0.004 230);
  --line-strong: oklch(0.835 0.006 230);
  --text: oklch(0.255 0.012 240);
  --text-2: oklch(0.44 0.012 240);
  --text-3: oklch(0.57 0.01 240);
  --accent: oklch(0.52 0.095 200);
  --accent-hover: oklch(0.47 0.095 200);
  --accent-soft: oklch(0.955 0.022 200);
  --accent-text: oklch(0.45 0.09 200);
  --on-accent: oklch(0.99 0.005 200);
  --focus: oklch(0.58 0.11 200);
  --danger: oklch(0.53 0.17 27);
  --danger-soft: oklch(0.96 0.025 27);
  --warn: oklch(0.7 0.13 75);
  --warn-text: oklch(0.5 0.1 65);
  --warn-soft: oklch(0.965 0.035 85);
  --ok: oklch(0.56 0.09 155);
  --scrim: oklch(0.25 0.01 240 / 0.28);
  --shadow-float: 0 1px 2px oklch(0.2 0.01 240 / 0.06), 0 10px 28px oklch(0.2 0.01 240 / 0.12);
  --st-open: oklch(0.66 0.008 240);
  --st-drafted: oklch(0.6 0.06 250);
  --st-applied: oklch(0.6 0.06 195);
  --st-interview: oklch(0.66 0.09 75);
  --st-offer: oklch(0.6 0.08 150);
  --st-closed: oklch(0.72 0.005 240);
  --paper: oklch(0.995 0.002 90);
  --paper-ink: oklch(0.24 0.01 250);
  --paper-muted: oklch(0.5 0.01 250);
  --paper-rule: oklch(0.86 0.005 250);
  --desk: oklch(0.935 0.004 230);
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: oklch(0.19 0.006 240);

/* Direction "Papier": warm stock, ink text, upright serif page titles, deep green accent. */
:root[data-direction="paper"] {
  --font-title: var(--font-serif);
  --title-weight: 600; --title-track: 0;

/* Direction "Weich": larger radii, 15px body, more air. Colours stay quiet, accent a touch lighter. */
:root[data-direction="soft"] {

/*
  Direction "Tinte" (default): ink-blue on sand, like a letter written with a fountain pen.
  - Palette: the product's real output is letters and CVs, so the accent is writing ink
    oklch(0.42 0.1 252) ≈ #1d4f82, a true blue well away from indigo/purple (hue ~275+),
    and the neutrals are warm sand (hue 80) instead of cool grey. Blue on sand is calm and
    mature, and the two hues sit opposite each other, so surfaces never compete with the accent.
  - Stage dots are re-tuned so none of them is blue: sand grey (open), clay (vorgemerkt),
    sea teal (beworben), ochre (interview), olive (angebot). Red stays reserved for errors.
  - Contrast (computed, WCAG 2): light text 15.2:1, text-3 on bg 4.9:1, accent text on surface 8.2:1,
    white-sand on accent 8.1:1. Dark text 14.9:1, text-3 5.4:1, accent text 9.3:1, on-accent 8.5:1.
  Type: Hanken Grotesk for the whole UI. A warm, open grotesque with generous counters that stays
  crisp at 13-14px, has full German coverage and tabular figures by default (scores and dates line
  up without extra features), and does not read as the generic Inter/Roboto look.
  Source Serif 4 sets the A4 previews only: CVs and letters should look like documents, not like UI.
  Page titles stay in the sans, so this direction is clearly distinct from "Papier".
*/
:root[data-direction="ink"] {
  --font-ui: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif 4", "Iowan Old Style", "Charter", "Sitka Text", Cambria, Georgia, serif;
  --fs-body: 14.5px; --fs-list: 14px;
  --title-weight: 600; --title-track: -0.02em;
  --r-ctl: 6px; --r-panel: 10px;
  --bg: oklch(0.972 0.008 80);
  --surface: oklch(0.989 0.005 80);
  --sunken: oklch(0.952 0.011 80);
  --raised: oklch(0.965 0.009 80);
  --float: oklch(0.992 0.004 80);
  --hover: oklch(0.945 0.012 80);
  --selected: oklch(0.935 0.022 250);
  --field: oklch(0.993 0.004 80);
  --line: oklch(0.885 0.013 78);
  --line-strong: oklch(0.8 0.017 75);
  --text: oklch(0.24 0.03 255);
  --text-2: oklch(0.42 0.025 255);
  --text-3: oklch(0.53 0.02 255);
  --accent: oklch(0.42 0.1 252);
  --accent-hover: oklch(0.37 0.1 252);
  --accent-soft: oklch(0.94 0.024 250);
  --accent-text: oklch(0.42 0.1 252);
  --on-accent: oklch(0.985 0.006 80);
  --focus: oklch(0.52 0.12 250);
  --scrim: oklch(0.24 0.03 255 / 0.28);
  --shadow-float: 0 1px 2px oklch(0.3 0.03 70 / 0.07), 0 10px 28px oklch(0.3 0.03 70 / 0.13);
  --st-open: oklch(0.68 0.012 75);
  --st-drafted: oklch(0.6 0.055 45);
  --st-applied: oklch(0.6 0.065 195);
  --st-interview: oklch(0.68 0.11 78);
  --st-offer: oklch(0.58 0.08 140);
  --st-closed: oklch(0.76 0.01 75);
  --paper: oklch(0.995 0.003 85);
  --paper-ink: oklch(0.23 0.025 255);
  --paper-muted: oklch(0.48 0.02 255);
  --paper-rule: oklch(0.86 0.01 80);
  --desk: oklch(0.925 0.013 78);
}
:root[data-direction="ink"][data-mode="dark"] {
  --bg: oklch(0.195 0.014 255);
  --surface: oklch(0.222 0.015 255);
  --sunken: oklch(0.175 0.013 255);
  --raised: oklch(0.24 0.016 255);
  --float: oklch(0.26 0.017 255);
  --hover: oklch(0.262 0.017 255);
  --selected: oklch(0.29 0.035 250);
  --field: oklch(0.195 0.014 255);
  --line: oklch(0.31 0.016 255);
  --line-strong: oklch(0.39 0.018 255);
  --text: oklch(0.93 0.012 85);
  --text-2: oklch(0.78 0.014 85);
  --text-3: oklch(0.64 0.014 85);
  --accent: oklch(0.76 0.085 245);
  --accent-hover: oklch(0.82 0.075 245);
  --accent-soft: oklch(0.29 0.04 250);
  --accent-text: oklch(0.8 0.08 245);
  --on-accent: oklch(0.2 0.03 255);
  --focus: oklch(0.78 0.09 245);
  --scrim: oklch(0.05 0.01 255 / 0.55);
  --shadow-float: 0 1px 2px oklch(0 0 0 / 0.3), 0 12px 32px oklch(0 0 0 / 0.45);
  --st-open: oklch(0.6 0.012 80);
  --st-drafted: oklch(0.7 0.055 45);
  --st-applied: oklch(0.72 0.065 195);
  --st-interview: oklch(0.77 0.1 80);
  --st-offer: oklch(0.71 0.08 140);
  --st-closed: oklch(0.5 0.01 80);
  --desk: oklch(0.16 0.013 255);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 var(--fs-body)/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: var(--fs-12); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 20px; height: 20px; }
.code { font-family: var(--font-code); font-size: 12.5px; }
hr.div { border: 0; border-top: 1px solid var(--line); margin: var(--s5) 0; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--ctl-h); padding: 0 12px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-size: var(--fs-13); font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  text-decoration: none;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: white; }
.btn-sm { height: var(--ctl-h-sm); padding: 0 9px; font-size: var(--fs-12); }
.btn-icon { width: var(--ctl-h); padding: 0; }
.btn-sm.btn-icon { width: var(--ctl-h-sm); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn-warn { border-color: var(--warn); }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; font-weight: 500; text-align: left; }
.link:hover { text-decoration: underline; text-underline-offset: 2px; }
.link-quiet { color: var(--text); font-weight: 500; }
.row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.stack > * + * { margin-top: var(--s3); }

.input {
  width: 100%; height: var(--ctl-h); padding: 0 10px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-strong); background: var(--field); color: var(--text); font-size: var(--fs-13);
}
.input::placeholder { color: var(--text-3); }
.input:focus-visible { outline-offset: 0; border-color: var(--focus); }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 1.5; resize: vertical; }
.select { position: relative; display: inline-flex; align-items: center; min-width: 0; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer; }
.select .ico { position: absolute; right: 9px; pointer-events: none; color: var(--text-3); }
.field { display: block; }
.field + .field { margin-top: var(--s4); }
.label { display: block; font-size: var(--fs-13); font-weight: 500; margin-bottom: 6px; color: var(--text); }
.hint { font-size: var(--fs-12); color: var(--text-3); margin-top: 5px; line-height: 1.45; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s4); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 4px 0; }
.check input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.radio-row { display: flex; gap: 12px; align-items: flex-start; padding: var(--s3) 0; border-top: 1px solid var(--line); cursor: pointer; }
.radio-row:first-child { border-top: 0; }
.radio-row input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }

.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-ctl); background: var(--sunken); border: 1px solid var(--line); }
.seg button {
  height: calc(var(--ctl-h) - 6px); padding: 0 10px; border: 0; background: transparent; border-radius: calc(var(--r-ctl) - 2px);
  font-size: var(--fs-12); font-weight: 500; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill);
  border: 1px solid var(--line-strong); background: var(--surface); font-size: var(--fs-12); font-weight: 500; color: var(--text-2); cursor: pointer;
}
.chip:hover { color: var(--text); background: var(--hover); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--r-ctl); background: var(--sunken); border: 1px solid var(--line); font-size: var(--fs-12); color: var(--text-2); }
.tag button { border: 0; background: none; padding: 0; margin-right: -3px; color: var(--text-3); cursor: pointer; display: inline-flex; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent-text); font-variant-numeric: tabular-nums; }
.count-plain { font-size: var(--fs-12); color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 500; }

.stage { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-13); color: var(--text); white-space: nowrap; }
.stage::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--st-open)); flex: none; }

.score { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; min-width: 32px; }
.score-n { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.bars { display: inline-flex; gap: 2px; }
.bars i { width: 6px; height: 3px; border-radius: 1px; background: var(--line-strong); }
.bars i.on { background: var(--accent); }
.score.weak .score-n { color: var(--text-2); }

.progress { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 300ms var(--ease); }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--sunken); border: 1px solid var(--line); font-size: var(--fs-13); color: var(--text-2); }
.notice .ico { margin-top: 2px; }
.notice-warn { background: var(--warn-soft); border-color: color-mix(in oklch, var(--warn) 45%, transparent); color: var(--text); }
.notice-warn > .ico { color: var(--warn-text); }
.notice-error { background: var(--danger-soft); border-color: color-mix(in oklch, var(--danger) 40%, transparent); color: var(--text); }
.notice-error > .ico { color: var(--danger); }
.t-warn { color: var(--warn-text); }
.t-danger { color: var(--danger); }
.t-ok { color: var(--ok); }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: 100vh; min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: var(--s1);
  background: var(--sunken); border-right: 1px solid var(--line); padding: 14px 10px 12px;
}
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 10px 16px; font-weight: 600; font-size: var(--fs-14); letter-spacing: -0.01em; }
.brand-mark { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--text); display: grid; place-items: center; }
.brand-mark i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r-ctl);
  color: var(--text-2); font-weight: 500; font-size: var(--fs-13); text-decoration: none;
}
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.nav a .count-badge, .nav a .count-plain { margin-left: auto; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.side-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-ctl);
  border: 0; background: none; color: var(--text-2); font-size: var(--fs-13); font-weight: 500; cursor: pointer; text-align: left; text-decoration: none;
}
.side-btn:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.side-btn[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.side-btn .end { margin-left: auto; }
.activity-live { color: var(--text); }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--line); color: var(--text); display: grid; place-items: center; font-size: 10.5px; font-weight: 600; flex: none; }
.pop-anchor { position: relative; }

.popover {
  position: absolute; z-index: 60; min-width: 260px; background: var(--float); border: 1px solid var(--line);
  border-radius: var(--r-panel); box-shadow: var(--shadow-float); padding: 6px; font-size: var(--fs-13);
}
.popover.up { bottom: calc(100% + 6px); left: 0; }
.popover.down-right { top: calc(100% + 4px); right: 0; }
.pop-head { padding: 8px 10px 6px; font-weight: 600; font-size: var(--fs-13); }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 10px; border: 0; background: none; border-radius: var(--r-ctl); text-align: left; cursor: pointer; color: var(--text); font-size: var(--fs-13); text-decoration: none; }
.pop-item:hover { background: var(--hover); text-decoration: none; }
.pop-item[aria-current="true"] { color: var(--accent-text); font-weight: 600; }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.task { padding: 8px 10px; }
.task + .task { border-top: 1px solid var(--line); }
.task-title { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.task-sub { font-size: var(--fs-12); color: var(--text-3); margin: 3px 0 6px 24px; }
.task .progress { margin-left: 24px; }

.main { min-width: 0; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px var(--page-pad) 96px; }
.page-narrow { max-width: 860px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap; }
.page-title { font: var(--title-weight) var(--fs-20)/1.25 var(--font-title); letter-spacing: var(--title-track); }
.page-lede { margin-top: 4px; color: var(--text-2); font-size: var(--fs-13); max-width: 68ch; }
.sec-title { font-size: var(--fs-16); font-weight: 600; letter-spacing: -0.005em; }
.sec-title-sm { font-size: var(--fs-14); font-weight: 600; }
.section { padding: var(--s5) 0; border-top: 1px solid var(--line); }
.section:first-child { border-top: 0; padding-top: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.prose { max-width: 66ch; color: var(--text-2); }

/* ---------- inbox ---------- */
.inbox { display: grid; grid-template-columns: minmax(300px, var(--list-w)) minmax(0,1fr); height: 100vh; height: 100dvh; }
.inbox-list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.inbox-top { padding: 20px 20px 0; }
.runline { font-size: var(--fs-13); color: var(--text-2); margin-top: 6px; line-height: 1.5; }
.runline b { color: var(--text); font-weight: 500; }
.filter-tabs { display: flex; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.ftab { height: 36px; padding: 0 10px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); font-weight: 500; font-size: var(--fs-13); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.ftab:hover { color: var(--text); }
.ftab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.list-scroll { overflow-y: auto; flex: 1; min-height: 0; }
.jrow {
  display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: start; width: 100%;
  padding: 13px 20px 13px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--text); font-size: var(--fs-list);
  position: relative;
}
.jrow:hover { background: var(--hover); }
.jrow[aria-current="true"] { background: var(--selected); }
.jrow[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.jrow-title { font-weight: 500; line-height: 1.35; }
.jrow-sub { color: var(--text-2); font-size: var(--fs-12); margin-top: 3px; }
.jrow-meta { font-size: var(--fs-12); color: var(--text-3); text-align: right; white-space: nowrap; line-height: 1.5; }
.jrow-actions { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 6px; }
.inbox-detail { overflow-y: auto; min-height: 0; background: var(--bg); }
.list-foot { padding: 14px 20px; font-size: var(--fs-12); color: var(--text-3); }

.empty { padding: 48px 24px; text-align: left; max-width: 440px; margin: 0 auto; }
.empty-ico { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--text-2); margin-bottom: 14px; }
.empty h2 { font-size: var(--fs-16); font-weight: 600; margin-bottom: 6px; }
.empty p { color: var(--text-2); font-size: var(--fs-13); }
.empty .row { margin-top: 16px; }
.detail-empty { height: 100%; display: grid; place-items: center; color: var(--text-3); font-size: var(--fs-13); padding: 24px; }

.onboard { max-width: 640px; }
.ob-list { list-style: none; margin: var(--s5) 0 0; padding: 0; counter-reset: ob; }
.ob-item { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); align-items: start; }
.ob-item:last-child { border-bottom: 1px solid var(--line); }
.ob-num { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: var(--fs-12); font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ob-item.done .ob-num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ob-item.done .ob-title { color: var(--text-2); }
.ob-title { font-weight: 600; font-size: var(--fs-14); }
.ob-text { color: var(--text-2); font-size: var(--fs-13); margin-top: 3px; max-width: 54ch; }

/* ---------- job detail ---------- */
.jd { container-type: inline-size; padding: 22px 28px 64px; max-width: 1080px; margin: 0 auto; }
.jd-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px 0 14px; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--fs-13); color: var(--text-3); margin-bottom: 14px; }
.crumbs a { color: var(--text-2); }
.jd-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: start; }
.jd-title { font: var(--title-weight) var(--fs-20)/1.28 var(--font-title); letter-spacing: var(--title-track); max-width: 40ch; }
.jd-meta { margin-top: 6px; color: var(--text-2); font-size: var(--fs-13); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.jd-meta .sep { color: var(--text-3); }
.jd-scorebox { text-align: right; }
.jd-score { font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.jd-band { font-size: var(--fs-12); color: var(--text-2); margin-top: 6px; display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
.jd-actions { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

.stepper { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); }
.step-btn {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%;
  padding: 0 6px 4px 0; min-height: 52px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text-3); border-radius: 4px;
}
.step-btn .node { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); position: relative; z-index: 1; transition: transform var(--t-fast) var(--ease); }
.stepper li:not(:last-child) .step-btn::after { content: ""; position: absolute; top: 5.25px; left: 16px; right: 4px; height: 1.5px; background: var(--line); }
.step-label { font-size: var(--fs-13); font-weight: 500; line-height: 1.2; }
.step-date { font-size: var(--fs-12); font-variant-numeric: tabular-nums; color: var(--text-3); line-height: 1.2; min-height: 1.2em; }
.step-btn:hover .node { transform: scale(1.18); }
.step-btn:hover .step-label { color: var(--text); }
.step-btn.past { color: var(--text-2); }
.step-btn.past .node { background: var(--text-3); border-color: var(--text-3); }
.stepper li .step-btn.past::after { background: var(--text-3) !important; }
.step-btn.current { color: var(--accent-text); }
.step-btn.current .node { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.step-btn.current .step-label { font-weight: 600; }
.step-btn.current .step-date { color: var(--text-2); }

.confirm { margin-top: 12px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--raised); font-size: var(--fs-13); }
.confirm.warn { background: var(--warn-soft); border-color: color-mix(in oklch, var(--warn) 45%, transparent); }
.confirm p { flex: 1 1 260px; }

.next { margin-top: 20px; padding: 16px 18px; border-radius: var(--r-panel); background: var(--raised); border: 1px solid var(--line); }
.next.tone-warn { background: var(--warn-soft); border-color: color-mix(in oklch, var(--warn) 40%, transparent); }
.next-kicker { font-size: var(--fs-12); color: var(--text-3); font-weight: 500; }
.next-title { font-size: var(--fs-16); font-weight: 600; margin-top: 2px; letter-spacing: -0.005em; }
.next-text { color: var(--text-2); margin-top: 4px; max-width: 70ch; }
.next .row { margin-top: 12px; }
.inline-warn { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-13); color: var(--text); padding: 4px 10px 4px 8px; border-radius: var(--r-ctl); background: var(--warn-soft); border: 1px solid color-mix(in oklch, var(--warn) 45%, transparent); }
.inline-warn > .ico { color: var(--warn-text); }

.checklist { list-style: none; margin: 14px 0 0; padding: 0; }
.cl-item { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.cl-item:first-child { border-top: 0; }
.cl-num { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 11.5px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; background: var(--surface); }
.cl-item.done .cl-num { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cl-item.done .cl-title { color: var(--text-2); }
.cl-title { font-weight: 500; }
.cl-body .row { margin-top: 6px; }
.flash { animation: flash 900ms var(--ease); }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--accent-soft); } 30% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }

.tabs { display: flex; gap: 2px; margin-top: 26px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { height: 38px; padding: 0 12px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); font-weight: 500; font-size: var(--fs-13); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab.dim { color: var(--text-3); }
.tab.dim[aria-selected="true"] { border-bottom-color: var(--line-strong); }
.tab .tab-state { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.tab .tab-state.ok { background: var(--accent); }
.tabpanel { padding-top: 22px; }
.dim-panel { padding: 28px 0; max-width: 52ch; }
.dim-panel h3 { font-size: var(--fs-14); font-weight: 600; margin-bottom: 4px; }
.dim-panel p { color: var(--text-2); font-size: var(--fs-13); }
.dim-panel .row { margin-top: 14px; }

.fit-summary { font-size: var(--fs-16); line-height: 1.5; max-width: 62ch; }
.fit-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 28px; margin-top: 22px; }
.fit-list { list-style: none; margin: 10px 0 0; padding: 0; }
.fit-list li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); }
.fit-list li:first-child { border-top: 0; }
.fit-list .ico { margin-top: 2px; }
.fit-ok .ico { color: var(--accent-text); }
.fit-gap .ico { color: var(--text-3); }
.fit-req { font-weight: 500; color: var(--text); }
.fit-fact { color: var(--text-2); display: block; margin-top: 1px; }
.fit-fact::before { content: "\2190\00a0"; color: var(--text-3); }
.dealbreaker { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--warn-text); }
.provenance { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: var(--fs-12); color: var(--text-3); }
.rationale { margin-top: 18px; }
.rationale-body { margin-top: 10px; color: var(--text-2); max-width: 68ch; font-size: var(--fs-13); }
.rationale-body p + p { margin-top: 8px; }
.disclosure { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: var(--fs-13); }
.disclosure:hover { color: var(--text); }
.disclosure .ico { transition: transform var(--t-fast) var(--ease); }
.disclosure[aria-expanded="true"] .ico { transform: rotate(90deg); }
.feedback { margin-top: 14px; padding: 14px; border-radius: var(--r-ctl); background: var(--raised); border: 1px solid var(--line); }

.kv { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 0 20px; }
.kv dt, .kv dd { padding: 11px 0; border-top: 1px solid var(--line); margin: 0; font-size: var(--fs-13); }
.kv dt { color: var(--text-2); font-weight: 500; }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; }
.ai-stamp { font-size: var(--fs-12); color: var(--text-3); margin-top: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps-mini { list-style: none; padding: 0; margin: 14px 0 0; }
.steps-mini li { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: var(--fs-13); color: var(--text-3); }
.steps-mini li.done { color: var(--text-2); }
.steps-mini li.now { color: var(--text); font-weight: 500; }
.steps-mini .dot { width: 16px; height: 16px; display: grid; place-items: center; }
.steps-mini .dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }

/* Bewerbungsmappe */
.mappe { display: grid; grid-template-columns: minmax(0,1fr); gap: 24px; }
@container (min-width: 760px) { .mappe { grid-template-columns: minmax(0,1fr) minmax(300px, 400px); align-items: start; } }
.mappe-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.docrow { padding: 16px 0; border-top: 1px solid var(--line); }
.docrow:last-of-type { border-bottom: 1px solid var(--line); }
.docrow-top { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.docrow-name { font-weight: 600; font-size: var(--fs-14); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.docrow-name:hover { text-decoration: underline; text-underline-offset: 2px; }
.docrow-state { font-size: var(--fs-12); color: var(--text-2); margin-top: 1px; font-variant-numeric: tabular-nums; }
.docrow-state.ready { color: var(--text-2); }
.docrow-state .stdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--line-strong); }
.docrow-state.ready .stdot { background: var(--accent); }
.docrow-state.run .stdot { background: var(--st-interview); }
.docrow .progress { margin: 10px 0 0 32px; }
.docrow-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0 32px; }
.docrow-instr { margin: 10px 0 0 32px; display: grid; gap: 8px; }
.docrow .select select { height: var(--ctl-h-sm); font-size: var(--fs-12); }
.preview-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.desk { background: var(--desk); border-radius: var(--r-panel); padding: 20px; display: flex; justify-content: center; }

/* The one editorial surface: a printed A4 page. Stays light in dark mode, like paper on a desk. */
.paper {
  width: 100%; max-width: 420px; aspect-ratio: 210 / 297; background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 1px 1px oklch(0.2 0 0 / .06), 0 6px 20px oklch(0.2 0 0 / .1); container-type: inline-size; overflow: hidden;
  font-family: var(--font-serif); position: relative;
}
.paper-in { padding: 9cqw 9.5cqw; font-size: 2.3cqw; line-height: 1.42; height: 100%; }
.paper[contenteditable="true"], .paper .paper-in[contenteditable="true"] { outline: 2px dashed var(--accent); outline-offset: 4px; }
.pp-name { font-size: 5.6cqw; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.pp-role { font-size: 2.6cqw; color: var(--paper-muted); margin-top: 0.8cqw; font-style: italic; }
.pp-contact { font-size: 2cqw; color: var(--paper-muted); margin-top: 1.6cqw; font-family: var(--font-ui); }
.pp-h { font-size: 2.5cqw; font-weight: 600; margin: 4.2cqw 0 1.4cqw; padding-bottom: 0.8cqw; border-bottom: 0.25cqw solid var(--paper-rule); }
.pp-item { margin-bottom: 1.8cqw; }
.pp-item b { font-weight: 600; }
.pp-item .pp-when { float: right; color: var(--paper-muted); font-family: var(--font-ui); font-size: 1.9cqw; }
.pp-p { margin: 0 0 1.8cqw; }
.pp-small { font-size: 1.9cqw; color: var(--paper-muted); font-family: var(--font-ui); }
.pp-skills { font-size: 2.1cqw; }
.pp-two { display: grid; grid-template-columns: 30% 1fr; gap: 5cqw; }
.pp-side { border-right: 0.25cqw solid var(--paper-rule); padding-right: 4cqw; }
.pp-hl { color: var(--accent); }
.pp-letter-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7cqw; }
.pp-subject { font-weight: 600; margin: 6cqw 0 4cqw; }
.pp-blank { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12cqw; font-family: var(--font-ui); }
.pp-blank p { font-size: 3.4cqw; color: var(--paper-muted); }
.pp-lines { position: absolute; inset: 9cqw 9.5cqw; display: flex; flex-direction: column; gap: 2.4cqw; opacity: .55; }
.pp-lines i { display: block; height: 1.6cqw; background: var(--paper-rule); border-radius: 1px; }
.paper.generating .pp-lines i { animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .35; } }
.edit-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: var(--fs-12); color: var(--text-2); flex-wrap: wrap; }

.prep-sec + .prep-sec { margin-top: 26px; }
.prep-list { margin: 10px 0 0; padding: 0; list-style: none; }
.prep-list li { padding: 10px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); }
.prep-list li:first-child { border-top: 0; }
.prep-q { font-weight: 500; }
.prep-a { color: var(--text-2); margin-top: 3px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 96px 14px minmax(0,1fr); gap: 12px; position: relative; padding-bottom: 16px; font-size: var(--fs-13); }
.tl-date { color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-12); padding-top: 1px; }
.tl-dot { position: relative; display: flex; justify-content: center; }
.tl-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--line-strong)); margin-top: 5px; position: relative; z-index: 1; }
.timeline li:not(:last-child) .tl-dot::after { content: ""; position: absolute; top: 14px; bottom: -16px; width: 1px; background: var(--line); }
.tl-sub { color: var(--text-2); font-size: var(--fs-12); }

/* ---------- tables ---------- */
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-list); }
.table th { text-align: left; font-size: var(--fs-12); font-weight: 500; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover td { background: var(--hover); }
.table tbody tr[aria-current="true"] td { background: var(--selected); }
.table .r { text-align: right; }
.t-title { font-weight: 500; color: var(--text); }
.t-sub { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; }
/* Phase groups: each <tbody> is a framed section with a header band tinted by its stage colour (--c).
   Separate borders so the frame can have rounded corners; rows still share the table's column grid. */
.pipe-table { border-collapse: separate; border-spacing: 0; --group-tint: 9%; --group-edge: 28%; }
:root[data-mode="dark"] .pipe-table { --group-tint: 15%; --group-edge: 35%; }
.pipe-table thead th { border-bottom: 0; }
.pipe-table td { background: var(--surface); }
.pipe-group td:first-child { border-left: 1px solid var(--line-strong); }
.pipe-group td:last-child { border-right: 1px solid var(--line-strong); }
.pipe-group tr:last-child td { border-bottom-color: var(--line-strong); }
.pipe-group tr:last-child td:first-child { border-bottom-left-radius: var(--r-panel); }
.pipe-group tr:last-child td:last-child { border-bottom-right-radius: var(--r-panel); }
.table.pipe-table .pipe-group .group-row td {
  padding: 12px 14px; cursor: default; border: 1px solid var(--line-strong);
  border-bottom-color: color-mix(in oklch, var(--c) var(--group-edge), var(--line-strong));
  border-radius: var(--r-panel) var(--r-panel) 0 0;
  background: color-mix(in oklch, var(--c) var(--group-tint), var(--surface));
}
.table.pipe-table .pipe-group .group-gap td { height: 28px; padding: 0; border: 0; background: none; }

<script>
'use strict';
/* ===================== time & format helpers ===================== */
// The prototype runs on a fixed clock so dates in the mock data stay consistent for every viewer.
const TODAY = new Date(2026, 9, 7, 11, 40);
const BOOT = Date.now();
const HOUR = 3600000;
const DAY = 24 * HOUR;
const FOLLOW_UP_DAYS = 10;
const now = () => new Date(TODAY.getTime() + (Date.now() - BOOT));
const hoursAgo = (n) => new Date(TODAY.getTime() - n * HOUR);
const daysAgo = (n, h = 9, m = 0) => { const d = new Date(TODAY); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d; };
const inDays = (n, h = 10, m = 0) => daysAgo(-n, h, m);
const pad = (n) => String(n).padStart(2, '0');
const fmtD = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
const fmtDY = (d) => `${fmtD(d)}${d.getFullYear()}`;
const fmtT = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDT = (d) => `${fmtD(d)}, ${fmtT(d)}`;
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const daysBetween = (a, b) => Math.floor((startOfDay(b) - startOfDay(a)) / DAY);
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function ago(d) {
  const ms = now() - d;
  if (ms < HOUR) return `vor ${Math.max(1, Math.round(ms / 60000))} Min.`;
  if (ms < DAY) return `vor ${Math.round(ms / HOUR)} Std.`;
  const days = daysBetween(d, now());
  return days === 1 ? 'gestern' : `vor ${days} Tagen`;
}
function sinceDays(d) { const n = daysBetween(d, now()); return n === 0 ? 'seit heute' : n === 1 ? 'seit 1 Tag' : `seit ${n} Tagen`; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => n.toLocaleString('de-DE') + ' €';

/* ===================== icons (lucide-style, 24 viewBox) ===================== */
const ICON_PATHS = {
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',

function route() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, qs] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  return { parts, page: parts[0] || 'eingang', sub: parts[1], q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function hashFor(parts, q = {}) {
  const qs = new URLSearchParams(Object.entries(q).filter(([, v]) => v !== null && v !== undefined && v !== '')).toString();
  return '#/' + parts.join('/') + (qs ? '?' + qs : '');
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

  if (j.status === 'APPLIED') { const d = daysBetween(j.followedUp || j.appliedDate, now()); return { text: sinceDays(j.followedUp || j.appliedDate), tone: d > FOLLOW_UP_DAYS ? 'warn' : '' }; }
  return { text: sinceDays(currentSince(j)), tone: '' };
}
function docsCell(j) {
  const ds = docsState(j);
  if (ds === 'ready') return 'Beide fertig';
  if (ds === 'running') return 'Wird erstellt';
  if (ds === 'partial') return j.docs.cv.state === 'ready' ? 'Nur Lebenslauf' : 'Nur Anschreiben';
  return '–';
}
function defaultJobTab(j) {
  if (j.status === 'OPEN') return 'passung';
  if (j.status === 'DRAFTED') return j.research || researchRunning(j) ? 'unterlagen' : 'unternehmen';
  if (j.status === 'INTERVIEW') return 'interview';
  if (j.status === 'APPLIED' || CLOSED_STATUSES.includes(j.status)) return 'verlauf';
  return 'passung';
}
const currentJobTab = (j) => ui.jobTab[j.id] || defaultJobTab(j);
function tabDim(j, key) {
  const idx = stageIndex(j.status);
  if (key === 'unterlagen' && idx < 1) return 'Unterlagen werden ab Phase Vorgemerkt erstellt';
  if (key === 'interview' && (idx < 3 || (idx === 5 && !j.prep))) return 'Interview-Vorbereitung ab Phase Interview';
  return null;
}

/* ===================== small components ===================== */
function scoreMark(score) {

  return `<span class="score ${b.bars === 1 ? 'weak' : ''}" title="Passung ${score} von 100 · ${b.word}"><span class="score-n">${score}</span><span class="bars" aria-hidden="true">${[1, 2, 3].map((n) => `<i class="${n <= b.bars ? 'on' : ''}"></i>`).join('')}</span><span class="sr-only">${b.word}</span></span>`;
}
const stageTag = (status) => `<span class="stage" style="--c:${stageOf(status).color}">${esc(statusLabel(status))}</span>`;
function selectEl({ id, name, value, options, label, change, data = '' }) {
  return `<span class="select"><label class="sr-only" for="${id}">${esc(label)}</label><select class="input" id="${id}" ${name ? `name="${name}"` : ''} data-change="${change}" ${data}>${options.map((o) => `<option value="${esc(o.value)}" ${o.value === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>${icon('chevD')}</span>`;
}
function btn(label, act, { cls = '', ico = '', data = '', attrs = '' } = {}) {
  return `<button type="button" class="btn ${cls}" data-act="${act}" ${data} ${attrs}>${ico ? icon(ico) : ''}${label ? `<span>${label}</span>` : ''}</button>`;

/* ===================== job detail (one component, three hosts) ===================== */

function jdTopbar(j, mode) {

function renderStepper(j) {
  const cur = stageIndex(j.status);
  const items = STAGES.map((st, i) => {
    const cls = i < cur ? 'past' : i === cur ? 'current' : 'future';
    const date = i === 5 ? lastStatusDate(j, j.status) : lastStatusDate(j, st.key);
    const label = i === 5 && cur === 5 ? statusLabel(j.status) : st.label;
    const dateText = i < cur && date ? fmtD(date) : i === cur ? (date ? `seit ${fmtD(date)}` : '') : '';
    const aria = i === cur ? `aria-current="step"` : '';
    return `<li><button type="button" class="step-btn ${cls}" data-act="stepTo" data-id="${j.id}" data-idx="${i}" ${aria} title="${i === cur ? 'Aktuelle Phase' : `Phase auf „${st.label}“ setzen`}"><span class="node"></span><span class="step-label">${esc(label)}</span><span class="step-date">${dateText}</span></button></li>`;
  }).join('');
  return `<ol class="stepper" aria-label="Phase der Bewerbung">${items}</ol>`;
}
function renderConfirm(j) {
  const c = ui.confirm;
  if (!c || c.id !== j.id) return '';
  if (c.kind === 'back') {
    return `<div class="confirm anim-pop" role="alert"><p>Zurück auf <b>${STAGES[c.idx].label}</b> setzen? Spätere Einträge bleiben im Verlauf erhalten.</p>
      <div class="row">${btn('Zurücksetzen', 'confirmStage', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;
  }
  if (c.kind === 'close') {
    return `<div class="confirm anim-pop" role="alert"><p>Wie ist die Bewerbung ausgegangen?</p>
      <div class="row">${['ACCEPTED', 'REJECTED', 'WITHDRAWN'].map((s) => btn(OUTCOME_LABEL[s], 'closeAs', { cls: 'btn-sm', data: `data-id="${j.id}" data-status="${s}"` })).join('')}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;
  }
  if (c.kind === 'nodocs') {

      <div class="row">${btn('Trotzdem markieren', 'confirmStage', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Unterlagen erstellen', 'genMissing', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;

}
function renderNextPanel(j) {

}
function renderApplyWithout(j) {

function renderApplyChecklist(j) {

    <div class="field" style="margin-top:12px"><label class="label" for="fb-${j.id}">Kommentar (optional)</label><textarea class="input" id="fb-${j.id}" placeholder="z. B. Ich habe Erfahrung mit GCP aus einem Nebenprojekt"></textarea></div>

/* ===================== Unterlagen = Bewerbungsmappe ===================== */
function docStateText(d) {
  if (d.state === 'queued') return { cls: 'run', text: 'In Warteschlange' };
  if (d.state === 'running') return { cls: 'run', text: `Wird erstellt · Schritt ${d.step}/3: ${GEN_STEPS[d.step - 1]}` };
  if (d.state === 'ready') return { cls: 'ready', text: `Fertig · v${d.version}${d.edited ? ' · bearbeitet' : ''} · ${fmtDT(d.updated)}` };
  return { cls: '', text: 'Nicht erstellt' };
}
function tabDocs(j) {
  const anyRunning = docsState(j) === 'running';
  const allReady = docsState(j) === 'ready';
  return `<div class="mappe">
    <div>
      <div class="mappe-head"><h3 class="sec-title">Bewerbungsmappe</h3>
        ${btn(allReady ? 'Beide neu erstellen' : 'Beide erstellen', 'genBoth', { cls: 'btn-sm', ico: allReady ? 'refresh' : 'file', data: `data-id="${j.id}"`, attrs: anyRunning ? 'disabled' : '' })}</div>

      ${['cv', 'letter'].map((k) => renderDocRow(j, k)).join('')}
      <p class="small faint" style="margin-top:12px">Anhänge aus Profil › Nachweise: ${S.certs.filter((c) => c.attach).map((c) => esc(c.name)).join(', ') || 'keine'}.</p>
    </div>
    <div>${renderPreview(j)}</div>
  </div>`;
}
function renderDocRow(j, k) {
  const d = j.docs[k];
  const st = docStateText(d);
  const tpls = S.templates.filter((t) => t.type === k && t.state === 'ready');
  const busy = d.state === 'queued' || d.state === 'running';
  const tplSel = selectEl({ id: `tpl-${k}-${j.id}`, value: d.template, label: `Vorlage für ${DOC_LABEL[k]}`, change: 'setTemplate', data: `data-id="${j.id}" data-doc="${k}" ${busy ? 'disabled' : ''}`, options: tpls.map((t) => ({ value: t.id, label: `Vorlage: ${t.name}` })) });
  let actions = '';

/* ===================== Eingang ===================== */
const INBOX_TABS = [{ key: 'neu', label: 'Neu', filter: 'new' }, { key: 'unter', label: 'Unter Schwellwert', filter: 'below' }, { key: 'aus', label: 'Aussortiert', filter: 'dismissed' }];
function inboxList(tabKey) {
  const f = INBOX_TABS.find((t) => t.key === tabKey).filter;
  const list = S.jobs.filter((j) => j.status === 'OPEN' && j.inbox === f);
  return f === 'new' ? list.sort((a, b) => b.score - a.score) : list.sort((a, b) => b.posted - a.posted);
}
function renderInbox(r) {
  if (r.sub === 'start') return renderOnboarding();
  const tab = INBOX_TABS.some((t) => t.key === r.q.tab) ? r.q.tab : 'neu';
  const forceEmpty = r.sub === 'leer';
  const list = forceEmpty && tab === 'neu' ? [] : inboxList(tab);
  let selId = r.q.job ? Number(r.q.job) : null;
  if (!selId && !isMobile() && list.length) selId = list[0].id;
  const sel = selId ? jobById(selId) : null;
  const src = srcById(S.lastRunSource);
  const counts = { neu: forceEmpty ? 0 : inboxList('neu').length, unter: inboxList('unter').length, aus: inboxList('aus').length };
  return `<div class="inbox ${sel && r.q.job ? 'has-sel' : ''}">
    <section class="inbox-list" aria-labelledby="inbox-h">
      <div class="inbox-top">
        <div class="row-between"><h1 class="page-title" id="inbox-h">Eingang</h1>${btn('', 'openImport', { cls: 'btn-ghost btn-sm btn-icon', ico: 'link', attrs: 'title="Einzelne Stelle per URL importieren" aria-label="Einzelne Stelle per URL importieren"' })}</div>
        <p class="runline">Letzter Lauf: <b>${esc(src.name)}</b> · ${ago(src.lastRun)} · <span class="num">${src.found}</span> gefunden · <span class="num">${src.matched}</span> passend · <span class="num">${src.below}</span> unter Schwellwert ${S.threshold} · <button type="button" class="link" data-act="inboxTab" data-tab="unter">ansehen</button></p>
        <div class="filter-tabs" role="tablist" aria-label="Filter">${INBOX_TABS.map((t) => `<button type="button" role="tab" class="ftab" aria-selected="${t.key === tab}" data-act="inboxTab" data-tab="${t.key}">${t.label}<span class="${t.key === 'neu' && counts[t.key] ? 'count-badge' : 'count-plain'}">${counts[t.key]}</span></button>`).join('')}</div>
      </div>
      <div class="list-scroll" data-scroll="inbox-list">
        ${tab === 'unter' && list.length ? `<p class="list-foot" style="border-bottom:1px solid var(--line)">Diese Stellen liegen unter deinem Schwellwert von ${S.threshold} und wurden automatisch aussortiert. <a href="#/quellen">Schwellwert ändern</a></p>` : ''}
        ${list.length ? list.map((j) => renderInboxRow(j, j.id === (sel && sel.id), tab)).join('') : renderInboxEmpty(tab)}

      </div>
    </section>
    <section class="inbox-detail" aria-label="Stellendetails" data-scroll="inbox-detail">${sel ? renderJobDetail(sel, 'split') : `<div class="detail-empty">Wähle links eine Stelle aus.</div>`}</section>
  </div>`;
}
function renderInboxRow(j, selected, tab) {
  const meta = tab === 'aus' ? `${esc(j.dismissReason || 'ohne Grund')}` : ago(j.posted);
  return `<div class="jrow" role="button" tabindex="0" data-act="selectInbox" data-id="${j.id}" ${selected ? 'aria-current="true"' : ''}>

const PIPE_GROUPS = ['DRAFTED', 'APPLIED', 'INTERVIEW', 'OFFER'];
const GROUP_LABEL = { DRAFTED: 'Vorgemerkt', APPLIED: 'Beworben', INTERVIEW: 'Interview', OFFER: 'Angebot' };
/* One line per phase: what it means and what usually comes next. Shown in the group header. */
const GROUP_HINT = {
  DRAFTED: 'Noch nicht beworben. Firma recherchieren, Unterlagen erstellen, dann bewerben.',
  APPLIED: 'Die Bewerbung ist raus. Ohne Antwort nach zwei Wochen kurz nachfassen.',
  INTERVIEW: 'Gespräche stehen an. Vorbereitung durchgehen und Termine im Blick behalten.',
  OFFER: 'Ein Angebot liegt vor. Konditionen prüfen und vor der Frist entscheiden.',

const stageColor = (st) => STAGES[stageIndex(st)].color;

function pipelineJobs(status) { return S.jobs.filter((j) => j.status === status).sort((a, b) => currentSince(a) - currentSince(b)); }
function renderPipeline(r) {
  const view = r.q.ansicht === 'board' ? 'board' : 'list';
  const closed = S.jobs.filter((j) => CLOSED_STATUSES.includes(j.status));

  const showClosed = r.q.abgeschlossen === '1';
  return `<div class="page"><div class="page-head"><div><h1 class="page-title">Bewerbungen</h1><p class="page-lede">${active} aktiv. Sortiert nach Phase, darin nach Wartezeit.</p></div>

    ${view === 'list' ? renderPipeTable() : renderBoard()}

    ${showClosed ? renderClosedTable(closed) : ''}</div>`;
}
function renderPipeTable() {

  const groups = PIPE_GROUPS.filter((st) => pipelineJobs(st).length).map((st, i) => {

function pipeRow(j) {

function renderClosedTable(closed) {

function selectorFor(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const attrs = ['data-act', 'data-id', 'data-tab', 'data-doc', 'data-v', 'data-idx', 'data-pop', 'data-status', 'data-step'].filter((a) => el.hasAttribute(a));
  if (!attrs.length) return null;
  return attrs.map((a) => `[${a}="${CSS.escape(el.getAttribute(a))}"]`).join('');
}
function captureUi() {
  const a = document.activeElement;
  const focus = { sel: selectorFor(a), start: a && 'selectionStart' in a ? safe(() => a.selectionStart) : null, end: a && 'selectionEnd' in a ? safe(() => a.selectionEnd) : null };
  const scroll = {};
  document.querySelectorAll('[data-scroll]').forEach((el) => { scroll[el.dataset.scroll] = el.scrollTop; });
  const values = {};
  document.querySelectorAll('input[id]:not([data-input]):not([type=checkbox]):not([type=radio]):not([type=file]), textarea[id]:not([data-input])').forEach((el) => { values[el.id] = el.value; });
  const pe = document.querySelector('.paper-in[contenteditable="true"]');
  if (pe && ui.editing) ui.editing.draft = pe.innerHTML;
  return { focus, scroll, values, hash: location.hash };
}
function safe(fn) { try { return fn(); } catch (e) { return null; } }
function restoreUi(s) {
  if (s.hash === location.hash) Object.entries(s.values).forEach(([id, v]) => { const el = $(id); if (el && el.value !== v) el.value = v; });
  document.querySelectorAll('[data-scroll]').forEach((el) => { if (s.scroll[el.dataset.scroll] != null) el.scrollTop = s.scroll[el.dataset.scroll]; });
  if (s.focus.sel) {
    const el = document.querySelector(s.focus.sel);
    if (el) { el.focus({ preventScroll: true }); if (s.focus.start != null) safe(() => el.setSelectionRange(s.focus.start, s.focus.end)); }
  }
}
// Replayed entrance animations on every re-render would be noise; only elements that are new animate.
function settleAnimations() {
  const seen = new Set();
  document.querySelectorAll('.anim-pop, .anim-drawer, .anim-fade').forEach((el) => {
    const key = el.dataset.animKey || [...el.classList].join('.') + ':' + (el.getAttribute('aria-label') || el.textContent.trim().slice(0, 48));
    if (animSeen.has(key)) el.classList.remove('anim-pop', 'anim-drawer', 'anim-fade');
    seen.add(key);
  });
  animSeen = seen;
}

/* ===================== toasts ===================== */
function toast(msg, opts = {}) {
  const id = 't' + (++ui.toastSeq);
  const actions = (opts.actions || []).map((a) => a.href ? `<a class="btn btn-sm btn-ghost" href="${a.href}" data-act="toastClose" data-tid="${id}">${a.label}</a>` : `<button type="button" class="btn btn-sm btn-ghost" data-act="${a.act}" ${a.data || ''} data-tid="${id}">${a.label}</button>`).join('');
  const chips = opts.chips ? `<div class="toast-chips"><span class="small faint" style="align-self:center">Grund (optional):</span>${opts.chips}</div>` : '';
  const el = document.createElement('div');
  el.className = 'toast' + (opts.err ? ' err' : '');
  el.id = id;
  el.setAttribute('role', opts.err ? 'alert' : 'status');
  el.innerHTML = `${icon(opts.err ? 'alert' : opts.icon || 'check', 'lead')}<span class="msg">${msg}</span>${actions}<button type="button" class="btn btn-sm btn-ghost btn-icon" data-act="toastClose" data-tid="${id}" aria-label="Meldung schließen">${icon('x')}</button>${chips}`;
  $('toasts').appendChild(el);
  while ($('toasts').children.length > 3) $('toasts').firstElementChild.remove();
  setTimeout(() => el.remove(), opts.ms || (opts.chips ? 9000 : 6000));
}

/* ===================== background tasks ===================== */
function startTask(t) { t.id = ++S.nextId; S.tasks.push(t); return t; }
function endTask(t) { S.tasks = S.tasks.filter((x) => x !== t); }
function runSteps(t, steps, onDone) {
  let i = 0;
  const next = () => {
    if (i >= steps.length) { endTask(t); onDone(); render(); return; }
    const s = steps[i++];
    setTimeout(() => { s.fn(); render(); next(); }, s.ms);
  };
  render();
  next();
}
function jobLinkAction(j, tab) { return { label: 'Ansehen', act: 'gotoJob', data: `data-id="${j.id}" data-tab="${tab}"` }; }
function startResearch(j) {
  if (researchRunning(j)) return;
  const t = startTask({ kind: 'research', jobId: j.id, tab: 'unternehmen', label: `Firmenrecherche: ${j.company}`, sub: RESEARCH_STEPS[0], step: 0, pct: 0.1 });
  const steps = RESEARCH_STEPS.map((s, i) => ({ ms: 1300, fn: () => { t.step = i + 1; t.sub = RESEARCH_STEPS[i + 1] || 'Fertig'; t.pct = (i + 1) / 3; } }));
  runSteps(t, steps, () => {
    j.research = j.id === 3 ? 'n26' : 'generic';
    j.history.push({ kind: 'event', date: now(), text: 'Firmenrecherche erstellt' });
    toast(`Firmenrecherche zu ${esc(j.company)} ist fertig.`, { actions: [jobLinkAction(j, 'unternehmen')] });
  });
}
const genQueues = {};
function enqueueDoc(j, k) {
  const d = j.docs[k];
  if (d.state === 'queued' || d.state === 'running') return;
  d.state = 'queued'; d.step = 0;
  (genQueues[j.id] = genQueues[j.id] || []).push(k);
  if (!S.tasks.some((t) => t.kind === 'doc' && t.jobId === j.id)) processDocQueue(j);
}
function processDocQueue(j) {
  const k = (genQueues[j.id] || []).shift();
  if (!k) return;
  const d = j.docs[k];
  d.state = 'running'; d.step = 1;
  const t = startTask({ kind: 'doc', jobId: j.id, tab: 'unterlagen', label: `${DOC_LABEL[k]} für ${j.company}`, sub: `Schritt 1/3: ${GEN_STEPS[0]}`, pct: 0.15 });
  const steps = [2, 3].map((n) => ({ ms: 1500, fn: () => { d.step = n; t.sub = `Schritt ${n}/3: ${GEN_STEPS[n - 1]}`; t.pct = n / 3 - 0.1; } }));
  steps.push({ ms: 1300, fn: () => {} });
  runSteps(t, steps, () => {
    Object.assign(d, { state: 'ready', step: 0, version: d.version + 1, edited: false, html: null, updated: now() });
    j.history.push({ kind: 'event', date: now(), text: `${DOC_LABEL[k]} v${d.version} erstellt` });
    toast(`${DOC_LABEL[k]} für ${esc(j.company)} ist fertig (v${d.version}).`, { actions: [jobLinkAction(j, 'unterlagen')] });
    processDocQueue(j);
  });
}
function startPrep(j) {
  if (prepRunning(j)) return;
  const t = startTask({ kind: 'prep', jobId: j.id, tab: 'interview', label: `Interview-Vorbereitung: ${j.company}`, sub: 'Stellenanzeige und Recherche lesen', step: 0, pct: 0.1 });
  const subs = ['Fragen ableiten', 'Gesprächspunkte wählen', 'Fertig'];
  runSteps(t, subs.map((s, i) => ({ ms: 1300, fn: () => { t.step = i + 1; t.sub = s; t.pct = (i + 1) / 3; } })), () => {
    j.prep = 'generic';
    j.history = j.history.filter((h) => h.text !== 'Interview-Vorbereitung erstellt');
    j.history.push({ kind: 'event', date: now(), text: 'Interview-Vorbereitung erstellt' });
    toast(`Interview-Vorbereitung für ${esc(j.company)} ist fertig.`, { actions: [jobLinkAction(j, 'interview')] });
  });
}
const NEW_MATCHES = [
  { title: 'Backend Developer Kotlin (m/w/d)', company: 'Hamburger Hochbahn', city: 'Hamburg', mode: 'Hybrid', score: 83 },
  { title: 'Senior Software Engineer – Order Management', company: 'Tchibo', city: 'Hamburg', mode: 'Hybrid', score: 77 },
  { title: 'Staff Engineer Platform (Java)', company: 'Kühne + Nagel', city: 'Hamburg', mode: 'Remote (DE)', score: 74 },
];
const NEW_BELOW = [['Junior PHP Developer', 'Webagentur Nord', 41], ['IT-Support Specialist', 'Hamburg Wasser', 18], ['Scrum Master', 'Hanse Merkur', 35], ['Python Backend Developer', 'Moia', 62]];
function startCrawl(s) {
  if (S.tasks.some((t) => t.kind === 'crawl' && t.sourceId === s.id)) return;
  const t = startTask({ kind: 'crawl', sourceId: s.id, label: `${s.name} durchsuchen`, sub: 'Seite 1', page: 0, pages: s.status === 'error' ? 3 : 6, extracted: 0, pct: 0.05 });
  if (s.id === 'indeed') { runCrawlFail(s, t); return; }
  const steps = Array.from({ length: t.pages }, (_, i) => ({ ms: 650, fn: () => { t.page = i + 1; t.extracted += i % 2 ? 1 : 0; t.sub = `Seite ${t.page}/${t.pages} · ${t.extracted} Stellen extrahiert`; t.pct = t.page / t.pages; } }));
  runSteps(t, steps, () => finishCrawl(s, t));
}
function runCrawlFail(s, t) {
  runSteps(t, [{ ms: 900, fn: () => { t.page = 1; t.sub = 'Seite 1/3 · wird geladen'; t.pct = 0.3; } }, { ms: 900, fn: () => {} }], () => {
    s.lastRun = now(); s.runs.unshift({ date: now(), found: 0, matched: 0, error: true });
    toast(`${esc(s.name)}: Zugriff abgelehnt (HTTP 403).`, { err: true, actions: [{ label: 'Details', href: `#/quellen?quelle=${s.id}` }] });
  });
}
function finishCrawl(s, t) {
  const m = NEW_MATCHES[(S.nextId) % NEW_MATCHES.length];
  const id = ++S.nextId;
  S.jobs.push(mkJob({ id, ...m, source: s.name, sourceId: s.id, posted: now() }));
  const belowN = Math.max(1, t.extracted - 1);
  for (let i = 0; i < belowN; i++) {
    const b = NEW_BELOW[(id + i) % NEW_BELOW.length];
    S.jobs.push(mkJob({ id: ++S.nextId, title: b[0], company: b[1], score: b[2], city: 'Hamburg', mode: 'Hybrid', source: s.name, sourceId: s.id, posted: now(), inbox: 'below', quick: [b[0].split(' ').slice(0, 2).join(' ') + ' als Schwerpunkt', 'Passt nicht zu deiner Wunschrolle'] }));
  }
  Object.assign(s, { lastRun: now(), found: belowN + 1, matched: 1, below: belowN, status: 'ok' });
  s.runs.unshift({ date: now(), found: belowN + 1, matched: 1 });
  S.lastRunSource = s.id;
  ui.onboard.run = ui.onboard.run || ui.onboard.source;
  toast(`${esc(s.name)} durchsucht: ${belowN + 1} gefunden, 1 passend.`, { actions: [{ label: 'Im Eingang ansehen', href: `#/eingang?job=${id}` }] });
}

/* ===================== domain actions ===================== */
function applyStatus(j, status, text) {
  if (j.status === status) return;
  const prev = j.status;
  j.prevStatus = prev;
  j.status = status;
  j.history.push({ kind: 'status', status, date: now(), text });
  if (status === 'OPEN') j.inbox = 'new';
  else j.inbox = null;
  if (status === 'APPLIED' && stageIndex(prev) < 2) j.appliedDate = text === 'date' ? j.appliedDate : now();
  if (status === 'INTERVIEW' && !j.interviewDate) j.interviewDate = inDays(7, 10, 0);
  if (status === 'OFFER' && !j.offerDeadline) j.offerDeadline = inDays(9, 18, 0);
  delete ui.jobTab[j.id];
  ui.confirm = null;
  ui.applyWarn[j.id] = false;
}
function statusToast(j) {
  toast(`Phase von „${esc(j.company)}“: ${esc(statusLabel(j.status))}.`, { actions: [{ label: 'Rückgängig', act: 'undoStatus', data: `data-id="${j.id}"` }] });
}
function nextInInbox(j) {
  const r = route();
  if (r.page !== 'eingang') return;
  const tab = r.q.tab || 'neu';
  const list = INBOX_TABS.some((t) => t.key === tab) ? inboxList(tab) : [];
  const idx = list.findIndex((x) => x.id === j.id);
  return { list, idx, tab };
}
function selectAfter(info) {
  if (!info) { render(); return; }
  const remaining = info.list.filter((x, i) => i !== info.idx && x.status === 'OPEN');
  const next = remaining[info.idx] || remaining[info.idx - 1];
  go(hashFor(['eingang'], { tab: info.tab === 'neu' ? null : info.tab, job: next && !isMobile() ? next.id : null }));
}
function shortlist(j) {
  const info = nextInInbox(j);

  toast(`Vorgemerkt: ${esc(j.title)}. Firmenrecherche läuft.`, { actions: [{ label: 'Zu Bewerbungen', href: `#/bewerbungen?job=${j.id}` }, { label: 'Rückgängig', act: 'undoStatus', data: `data-id="${j.id}"` }] });
  selectAfter(info);
}
function dismiss(j) {

  certUpload: (d, el) => { const file = el.files && el.files[0]; if (!file) return; S.certs.unshift({ id: ++S.nextId, name: file.name.replace(/\.[^.]+$/, ''), kind: 'Zeugnis', date: `${pad(now().getMonth() + 1)}/${now().getFullYear()}`, size: `${Math.max(1, Math.round(file.size / 1024))} KB`, attach: false }); el.value = ''; toast(`${esc(file.name)} hochgeladen.`, { icon: 'upload' }); render(); },
  certAttach: (d, el) => { S.certs.find((x) => x.id === Number(d.id)).attach = el.checked; },
  setTz: (d, el) => { S.settings.tz = el.value; },
  toggleEvent: (d, el) => { S.settings.events[d.k] = el.checked; },
  setStorage: (d, el) => { S.settings.storage = el.value; render(); },
  aiProvider: (d, el) => { const t = S.aiTasks.find((x) => x.id === d.id); t.provider = el.value; t.model = MODELS[el.value][0]; render(); },
  aiModel: (d, el) => { S.aiTasks.find((x) => x.id === d.id).model = el.value; },
  userRole: (d, el) => { S.users[Number(d.i)].role = el.value; toast(`Rolle von ${esc(S.users[Number(d.i)].name)}: ${esc(el.value)}.`); },
  noop: () => {},
};
const INPUT = {
  applyDate: (d, el) => { ui.applyDate[d.id] = el.value; },
  instr: (d, el) => { ui.instrText[d.key] = el.value; },
  notes: (d, el) => { J(d).notes = el.value; const h = $(`notes-state-${d.id}`); if (h) h.textContent = 'Gespeichert'; },
  threshold: (d, el) => {
    const v = Math.max(0, Math.min(100, Number(el.value) || 0));
    S.threshold = v;
    S.jobs.forEach((j) => { if (j.status === 'OPEN' && j.inbox !== 'dismissed') j.inbox = j.score < v ? 'below' : 'new'; });
    const other = el.type === 'range' ? $('thr') : $('thr-range');
    if (other) other.value = v;
    const hint = $('thr-hint'); if (hint) hint.textContent = thresholdHint(v);
    $('sidebar').innerHTML = renderSidebar(route());
  },
  asUrl: (d, el) => { ui.addSource.url = el.value; },
  asPattern: (d, el) => { ui.addSource.pattern = el.value; },
  asName: (d, el) => { ui.addSource.name = el.value; },
  impUrl: (d, el) => { ui.importer.url = el.value; },
  deleteConfirm: (d, el) => { ui.deleteAccount = el.value; const b = document.querySelector('[data-act="deleteAccount"]'); if (b) b.disabled = el.value !== 'LÖSCHEN'; },
};
function readProfileForm() {
  const role = $('pf-role'); if (role) PROFILE.role = role.value;
  const sal = $('pf-sal'); if (sal) PROFILE.salaryMin = Number(sal.value) || PROFILE.salaryMin;
}
function closeToast(tid) { if (tid) $(tid)?.remove(); }
function closeTopLayer() {
  const r = route();
  if (ui.popover) { ui.popover = null; render(); return true; }
  if (ui.moreOpen) { ui.moreOpen = false; render(); return true; }
  if (ui.addSource) { ui.addSource = null; render(); return true; }
  if (ui.importer) { ui.importer = null; render(); return true; }
  if (ui.confirm) { ui.confirm = null; render(); return true; }
  if (ui.editing) { ui.editing = null; render(); return true; }
  if (r.q.job && r.page === 'bewerbungen') { setQuery({ job: null }); restoreReturnFocus(); return true; }
  if (r.q.quelle) { ui.srcDelete = null; setQuery({ quelle: null }); restoreReturnFocus(); return true; }
  if (r.q.job && r.page === 'eingang' && isMobile()) { ACT.clearInboxSel(); return true; }
  return false;
}
function restoreReturnFocus() {
  const sel = ui.returnFocus; ui.returnFocus = null;
  if (sel) setTimeout(() => document.querySelector(sel)?.focus({ preventScroll: true }), 0);
}

/* ===================== theme & direction ===================== */
function getPref(k, def) { try { return localStorage.getItem('ajp-' + k) || def; } catch (e) { return def; } }
function setPref(k, v) { try { localStorage.setItem('ajp-' + k, v); } catch (e) { /* storage unavailable: preference lasts for this session only */ } prefs[k] = v; }
/* New storage key: "Tinte" becomes the default even for viewers who picked a direction before it existed. */
const prefs = { theme: getPref('theme', 'system'), direction: getPref('direction-v2', 'ink') };
const getTheme = () => prefs.theme;
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const mode = prefs.theme === 'system' ? (darkQuery.matches ? 'dark' : 'light') : prefs.theme;
  document.documentElement.dataset.mode = mode;
  if (prefs.direction === 'quiet') delete document.documentElement.dataset.direction;
  else document.documentElement.dataset.direction = prefs.direction;
}

/* ===================== prototype control ===================== */
const PROTO_LINKS = [
  ['Bildschirme', [['#/eingang', 'Eingang'], ['#/bewerbungen', 'Bewerbungen (Liste)'], ['#/bewerbungen?ansicht=board', 'Bewerbungen (Board)'], ['#/quellen', 'Quellen'], ['#/profil/ziel', 'Profil'], ['#/einstellungen/allgemein', 'Einstellungen']]],
  ['Eingang', [['#/eingang/start', 'Ersteinrichtung'], ['#/eingang/leer', 'Leerer Eingang'], ['#/eingang?tab=unter', 'Unter Schwellwert'], ['#/eingang?tab=aus', 'Aussortiert'], ['#/job/1', 'Neue Stelle als Seite']]],
  ['Stelle in Phase …', [['#/job/8', 'Vorgemerkt, ohne Recherche'], ['#/job/3?reiter=unterlagen', 'Vorgemerkt, Unterlagen halb fertig'], ['#/job/9', 'Vorgemerkt, bereit zum Bewerben'], ['#/bewerbungen?job=10', 'Beworben, Nachfassen fällig (Drawer)'], ['#/job/11', 'Beworben, warten'], ['#/job/12', 'Interview, ohne Vorbereitung'], ['#/job/13?reiter=interview', 'Interview mit Vorbereitung'], ['#/job/14', 'Angebot'], ['#/job/15?reiter=verlauf', 'Abgeschlossen (Absage)']]],
  ['Weitere Zustände', [['#/quellen?quelle=indeed', 'Quelle mit Fehler'], ['act:openAddSource', 'Quelle hinzufügen'], ['act:openImport', 'Stelle per URL importieren'], ['#/profil/vorlagen', 'Vorlagen'], ['#/profil/nachweise', 'Nachweise'], ['#/einstellungen/benachrichtigungen', 'Benachrichtigungen'], ['#/einstellungen/ki-aufgaben', 'KI-Aufgaben'], ['#/anmelden', 'Anmeldung']]],
];
function renderProto() {
  const p = $('proto');
  const panel = ui.protoOpen ? `<div class="proto-panel" role="dialog" aria-label="Prototyp-Steuerung">
    <h2>Darstellung</h2><div class="seg">${[['light', 'Hell'], ['dark', 'Dunkel'], ['system', 'System']].map(([v, l]) => `<button type="button" aria-pressed="${prefs.theme === v}" data-act="setTheme" data-v="${v}">${l}</button>`).join('')}</div>
    <h2>Richtung</h2><div class="seg seg-grid">${[['ink', 'Tinte'], ['quiet', 'Ruhiges Werkzeug'], ['paper', 'Papier'], ['soft', 'Weich']].map(([v, l]) => `<button type="button" aria-pressed="${prefs.direction === v}" data-act="setDirection" data-v="${v}">${l}</button>`).join('')}</div>
    <h2>Springen zu</h2><ul class="proto-links">${PROTO_LINKS.map(([g, links]) => `<li class="grp">${g}</li>${links.map(([h, l]) => `<li>${h.startsWith('act:') ? `<a href="#" data-act="protoJump" data-target="${h.slice(4)}">${l}</a>` : `<a href="${h}">${l}</a>`}</li>`).join('')}`).join('')}</ul>
    <div class="row" style="margin-top:12px">${btn('Daten zurücksetzen', 'resetData', { cls: 'btn-sm btn-ghost', ico: 'refresh' })}</div></div>` : '';
  p.innerHTML = `${panel}<div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-sm proto-toggle" data-act="protoToggle" aria-expanded="${ui.protoOpen}">${icon(ui.protoOpen ? 'chevD' : 'sliders')}<span>Prototyp</span></button></div>`;
}
ACT.protoJump = (d, el, e) => { e.preventDefault(); if (d.target === 'openAddSource') { go('#/quellen'); ACT.openAddSource(); } else ACT[d.target](); };

/* ===================== event wiring ===================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (ui.popover && !e.target.closest('.popover, [data-popover-trigger]')) { ui.popover = null; if (!el) { render(); return; } }
  if (!el || el.disabled || el.closest('[contenteditable="true"]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')?.startsWith('#/')) e.preventDefault();
  if (el.tagName === 'A' && el.dataset.act === 'toastClose') { fn(el.dataset, el, e); return; }
  fn(el.dataset, el, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el.dataset, el, e); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el.dataset, el, e); });
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.dataset.submit === 'login') go('#/eingang'); });
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape') { if (closeTopLayer()) e.preventDefault(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter]({ ...t.dataset, src: t.id }, t, e); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-act]:not(button):not(a):not(input)')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Tab') trapFocus(e);
});
function trapFocus(e) {
  const dlg = document.querySelector('#overlay [aria-modal="true"]');
  if (!dlg) return;
  const items = [...dlg.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not(.sr-only), select, textarea, [tabindex="0"]')].filter((x) => x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0]; const last = items[items.length - 1];
  if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
let lastOverlayKey = '';
window.addEventListener('hashchange', () => {
  const r = route();
  ui.popover = null; ui.moreOpen = false; ui.confirm = null;
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  if (r.page !== 'quellen' && r.page !== 'eingang') ui.addSource = null;
  render();
  const key = $('overlay').innerHTML ? ($('overlay').querySelector('[data-anim-key]')?.dataset.animKey || '') : '';
  if (key && key !== lastOverlayKey) $('overlay').querySelector('[aria-modal="true"]')?.focus();
  if (!key) window.scrollTo(0, r.page === 'job' ? 0 : window.scrollY);
  lastOverlayKey = key;
});
darkQuery.addEventListener('change', () => { applyTheme(); });
window.matchMedia('(max-width: 767px)').addEventListener('change', () => render());

/* ===================== boot ===================== */
applyTheme();
(function boot() {
  if (!location.hash) history.replaceState(null, '', '#/eingang');
  const r = route();
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  render();
})();
</script>
