/*
  Direction "FH": the brand language of me.app-by-fh.dev, adapted for a working app.
  - Night first: slate/navy neutrals (#0F172A page, #0c1221 wells and sidebar), a light theme on slate-50.
  - One accent, coral #ff7d61. It marks the next move, the active nav item, primary buttons and key numerals.
    In light mode coral is deepened: fills and marks use #e8603f (3:1 on slate-50, 5.3:1 with navy text),
    small coral text uses #b93a1f (--accent-text, at least 5.1:1).
  - Type: Saira Stencil One for page titles and big numerals (uppercase, last word coral), Inter for reading,
    JetBrains Mono for eyebrows, labels, meta, tags, dates and buttons.
  - Hairlines instead of heavy rules; cards are 1px bordered, rounded-xl, and warm to coral on hover.
  - Contrast pairs are computed in the build notes (WCAG 2); every text pair is at least 4.5:1.
*/
:root {
  --font-ui: "Inter Variable", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Saira Stencil One", "Inter Variable", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "Source Serif 4", "Iowan Old Style", "Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-code: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --font-mono: var(--font-code);

  --fs-12: 13px; --fs-13: 13.5px; --fs-14: 14px; --fs-16: 16px; --fs-20: 20px;
  --fs-body: 14.5px; --fs-list: 14px; --fs-mono: 12.5px; --fs-tag: 12px;
  --track-mono: 0.06em;

  --r-ctl: 8px; --r-panel: 12px; --r-tag: 4px; --r-pill: 999px;
  --ctl-h: 36px; --ctl-h-sm: 30px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --page-pad: 48px; --sidebar-w: 248px; --list-w: 420px; --status-h: 34px;
  --rule-w: 1px;

  --ease: cubic-bezier(.2,.7,.3,1); --t-fast: 120ms; --t-mid: 200ms; --t-slow: 300ms;

  /* dark: the site's signature mode, default */
  --coral: #ff7d61;
  --bg: #0f172a;
  --surface: #1b2335;
  --sunken: #0c1221;
  --raised: #151e31;
  --float: #1e293b;
  --hover: #18213a;
  --selected: #1e293b;
  --field: #0c1221;
  --line: #273041;
  --line-strong: #3a4558;
  --rule: #3a4558;
  --text: #f1f5f9;
  --text-2: #cbd5e1;
  --text-3: #94a3b8;
  --accent: #ff7d61;
  --accent-hover: #ff9a84;
  --accent-soft: #27212f;
  --accent-line: rgba(255, 125, 97, 0.3);
  --accent-glow: 0 0 18px -4px rgba(255, 125, 97, 0.55);
  --accent-text: #ff7d61;
  --on-accent: #0f172a;
  --focus: #ff7d61;
  --danger: #fda4af;
  --danger-soft: #2a1a26;
  --warn: #fbbf24;
  --warn-text: #fcd34d;
  --warn-soft: #262316;
  --ok: #4ade80;
  --scrim: rgba(2, 6, 23, 0.7);
  --shadow-float: 0 0 0 1px rgba(255,255,255,0.06), 0 18px 40px -12px rgba(0,0,0,0.7);
  --watermark: rgba(255, 255, 255, 0.03);
  /* stages: muted secondary set that never competes with coral */
  --st-open: #64748b;
  --st-drafted: #d4a72c;
  --st-applied: #38bdf8;
  --st-interview: #2dd4bf;
  --st-offer: #4ade80;
  --st-closed: #475569;
  /* printed proof: always paper */
  --paper: #ffffff;
  --paper-ink: #0f172a;
  --paper-muted: #475569;
  --paper-rule: #cbd5e1;
  --paper-accent: #b93a1f;
  --desk: #0c1221;
  --mark: #64748b;
  /* sidebar and bottom bar */
  --sb-bg: #0c1221;
  --sb-raised: #172036;
  --sb-text: #f1f5f9;
  --sb-text-2: #cbd5e1;
  --sb-text-3: #94a3b8;
  --sb-line: #1f2733;
  --sb-accent: #ff7d61;
  --sb-accent-dim: rgba(255, 125, 97, 0.6);
  /* toasts */
  --inv-bg: #1e293b;
  --inv-hover: #273449;
  --inv-line: #3a4558;
  --inv-text: #f1f5f9;
  --inv-text-2: #cbd5e1;
  --inv-text-3: #a3b0c2;
  --inv-accent: #ff7d61;
  color-scheme: dark;
}
:root[data-mode="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --sunken: #f1f5f9;
  --raised: #f1f5f9;
  --float: #ffffff;
  --hover: #f1f5f9;
  --selected: #fff4f1;
  --field: #ffffff;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --rule: #cbd5e1;
  --text: #0f172a;
  --text-2: #334155;
  --text-3: #5b6779;
  --accent: #e8603f;
  --accent-hover: #ff7d61;
  --accent-soft: #fff1ed;
  --accent-line: rgba(185, 58, 31, 0.3);
  --accent-glow: 0 0 16px -4px rgba(255, 125, 97, 0.6);
  --accent-text: #b93a1f;
  --on-accent: #0f172a;
  --focus: #b93a1f;
  --danger: #be123c;
  --danger-soft: #fff1f3;
  --warn: #d97706;
  --warn-text: #92400e;
  --warn-soft: #fffbeb;
  --ok: #15803d;
  --scrim: rgba(15, 23, 42, 0.4);
  --shadow-float: 0 0 0 1px rgba(15,23,42,0.06), 0 16px 36px -12px rgba(15,23,42,0.28);
  --watermark: rgba(15, 23, 42, 0.03);
  --st-open: #64748b;
  --st-drafted: #c27c0e;
  --st-applied: #0284c7;
  --st-interview: #0d9488;
  --st-offer: #16a34a;
  --st-closed: #cbd5e1;
  --desk: #e2e8f0;
  --mark: #64748b;
  --sb-bg: #ffffff;
  --sb-raised: #f1f5f9;
  --sb-text: #0f172a;
  --sb-text-2: #334155;
  --sb-text-3: #5b6779;
  --sb-line: #e2e8f0;
  --sb-accent: #b93a1f;
  --sb-accent-dim: #c9573d;
  --inv-bg: #0f172a;
  --inv-hover: #1e293b;
  --inv-line: #334155;
  --inv-text: #f1f5f9;
  --inv-text-2: #cbd5e1;
  --inv-text-3: #a3b0c2;
  --inv-accent: #ff7d61;
  color-scheme: light;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html { font-synthesis: none; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 var(--fs-body)/1.55 var(--font-ui);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--on-accent); }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: var(--fs-12); }
.eyebrow { display: block; font: 500 var(--fs-tag)/1.2 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 10px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 20px; height: 20px; }
.code { font-family: var(--font-code); font-size: var(--fs-mono); }
hr.div { border: 0; border-top: 1px solid var(--line); margin: var(--s5) 0; }
.display { font-family: var(--font-display); }
.hl { color: var(--accent-text); }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: var(--ctl-h); padding: 0 14px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-strong); background: transparent; color: var(--text);
  font: 700 var(--fs-mono)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; white-space: nowrap; cursor: pointer;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), box-shadow var(--t-slow) var(--ease);
  text-decoration: none;
}
.btn:hover { background: var(--hover); border-color: var(--accent-line); text-decoration: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); box-shadow: var(--accent-glow); }
/* ghost CTA (site: VIEW PROJECT): small primary actions in dense lists */
.btn-primary.btn-sm { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
.btn-primary.btn-sm:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: none; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-danger { color: var(--danger); border-color: currentColor; }
.btn-ghost.btn-danger { border-color: transparent; }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn-danger:hover { border-color: currentColor; }
.btn-sm { height: var(--ctl-h-sm); padding: 0 10px; font-size: var(--fs-tag); }
.btn-icon { width: var(--ctl-h); padding: 0; }
.btn-sm.btn-icon { width: var(--ctl-h-sm); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-warn { border-color: var(--warn); }
.link { background: none; border: 0; padding: 0; color: var(--accent-text); cursor: pointer; font-weight: 600; text-align: left; display: inline-flex; gap: 4px; align-items: center; }
.link::after { content: "\2192"; font-family: var(--font-mono); opacity: 0; transform: translateX(-4px); transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease); }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link:hover::after, .link:focus-visible::after { opacity: 1; transform: none; }
.link-quiet::after, .link:has(.ico)::after { content: none; }
.link .ico { width: 14px; height: 14px; }
.link-quiet { color: var(--text); font-weight: 500; }
.row { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.stack > * + * { margin-top: var(--s3); }

.input {
  width: 100%; height: var(--ctl-h); padding: 0 10px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-strong); background: var(--field); color: var(--text); font-size: var(--fs-13);
  transition: border-color var(--t-fast) var(--ease);
}
.input::placeholder { color: var(--text-3); }
.input:hover { border-color: var(--text-3); }
.input:focus-visible { outline-offset: 1px; border-color: var(--focus); }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 1.55; resize: vertical; }
.select { position: relative; display: inline-flex; align-items: center; min-width: 0; max-width: 100%; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 30px; cursor: pointer; text-overflow: ellipsis; }
.select .ico { position: absolute; right: 9px; pointer-events: none; color: var(--text-3); }
.field { display: block; }
.field + .field { margin-top: var(--s4); }
.label { display: block; font: 600 var(--fs-tag)/1.3 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; margin-bottom: 7px; color: var(--text-2); }
.hint { font-size: var(--fs-12); color: var(--text-3); margin-top: 5px; line-height: 1.45; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--s4); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 4px 0; }
.check input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; flex: none; }
.radio-row { display: flex; gap: 12px; align-items: flex-start; padding: var(--s3) 0; border-top: 1px solid var(--line); cursor: pointer; }
.radio-row:first-child { border-top: 0; }
.radio-row input { margin: 3px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--sunken); overflow: hidden; max-width: 100%; }
.seg button {
  height: calc(var(--ctl-h) - 8px); padding: 0 11px; border: 0; background: transparent; border-radius: 5px;
  font: 700 var(--fs-tag)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent-line); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-tag);
  border: 1px solid var(--line-strong); background: var(--surface); font: 500 var(--fs-tag)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-2); cursor: pointer;
}
.chip:hover { color: var(--text); border-color: var(--accent-line); }
.chip[aria-pressed="true"] { border-color: var(--accent-line); color: var(--accent-text); background: var(--accent-soft); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: var(--r-tag); background: var(--sunken); border: 1px solid var(--line); font: 500 var(--fs-tag)/1 var(--font-mono); color: var(--text-2); }
.tag-accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); text-transform: uppercase; letter-spacing: var(--track-mono); }
.tag button { border: 0; background: none; padding: 0; margin-right: -3px; color: var(--text-3); cursor: pointer; display: inline-flex; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--r-tag); font: 700 12px/1 var(--font-mono); background: var(--accent); color: var(--on-accent); font-variant-numeric: tabular-nums; }
.count-plain { font: 600 var(--fs-tag)/1 var(--font-mono); color: var(--text-3); font-variant-numeric: tabular-nums; }

.stage { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--text); white-space: nowrap; font-weight: 500; }
.stage::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--st-open)); flex: none; }

/* score in lists: a typographic numeral with its band word underneath */
.score { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 44px; }
.score-n { font: 400 30px/0.86 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.score-w { font: 500 var(--fs-tag)/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-2); }
.score.strong .score-n { color: var(--accent-text); }
.score.weak .score-n { color: var(--text-3); }

.progress { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width 300ms var(--ease); }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: var(--r-ctl); background: var(--sunken); border: 1px solid var(--line); font-size: var(--fs-13); color: var(--text-2); }
.notice .ico { margin-top: 2px; }
.notice-warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--text); }
.notice-warn > .ico { color: var(--warn-text); }
.notice-error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--text); }
.notice-error > .ico { color: var(--danger); }
.t-warn { color: var(--warn-text); }
.t-danger { color: var(--danger); }
.t-ok { color: var(--ok); }

/* ---------- app shell: night sidebar, numbered mono navigation ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: 100vh; min-height: 100dvh; }
.sidebar, .bottombar {
  --surface: var(--sb-raised); --float: var(--sb-raised); --hover: var(--sb-raised); --line: var(--sb-line); --line-strong: var(--sb-line);
  --text: var(--sb-text); --text-2: var(--sb-text-2); --text-3: var(--sb-text-3); --accent: var(--sb-accent); --accent-text: var(--sb-accent);
  --focus: var(--sb-accent); --on-accent: var(--sb-bg); --bg: var(--sb-bg);
  background: var(--sb-bg); color: var(--sb-text);
}
.sidebar {
  position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: var(--s1);
  padding: 22px 0 14px; z-index: 30;
}
.sidebar { border-right: 1px solid var(--sb-line); }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 2px 22px 30px; }
.brand-word { font: 400 21px/1 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; }
.brand-word .brand-by { color: var(--text-3); }
.brand-word .brand-fh { color: var(--accent-text); }
.nav { display: flex; flex-direction: column; }
.nav a {
  position: relative; display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center; gap: 4px;
  min-height: 44px; padding: 0 22px; color: var(--text-2); text-decoration: none;
  transition: color var(--t-slow) var(--ease), background-color var(--t-slow) var(--ease);
}
.nav-no { font: 700 var(--fs-tag)/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--sb-accent-dim); transition: color var(--t-slow) var(--ease); }
.nav-label { font: 700 13px/1.1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
.nav a:hover { color: var(--text); background: var(--hover); }
.nav a:hover .nav-no { color: var(--accent); }
.nav a[aria-current="page"] { color: var(--accent-text); background: var(--hover); }
.nav a[aria-current="page"] .nav-no { color: var(--accent); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); }
.nav a .count-badge, .nav a .count-plain { align-self: center; }
.nav a .t-danger { color: var(--sb-accent); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--line); padding: 10px 10px 0; }
.side-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 12px; border-radius: var(--r-ctl);
  border: 0; background: none; color: var(--text-2); font-size: var(--fs-13); font-weight: 500; cursor: pointer; text-align: left; text-decoration: none;
}
.side-btn:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.side-btn[aria-current="page"] { color: var(--accent-text); background: var(--hover); box-shadow: inset 2px 0 0 var(--accent); }
.side-btn .end { margin-left: auto; }
.activity-live { color: var(--text); }
.avatar { width: 24px; height: 24px; border-radius: 6px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-text); display: grid; place-items: center; font: 700 10.5px/1 var(--font-mono); flex: none; }
.pop-anchor { position: relative; }

.popover {
  position: absolute; z-index: 60; min-width: 264px; background: var(--float); color: var(--text); border: 1px solid var(--line-strong);
  border-radius: var(--r-panel); box-shadow: var(--shadow-float); padding: 6px; font-size: var(--fs-13);
}
.popover.up { bottom: calc(100% + 6px); left: 0; }
.popover.down-right { top: calc(100% + 4px); right: 0; }
.pop-head { padding: 8px 10px 6px; font: 700 var(--fs-tag)/1.3 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2); }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 6px 10px; border: 0; background: none; border-radius: var(--r-ctl); text-align: left; cursor: pointer; color: var(--text); font-size: var(--fs-13); text-decoration: none; }
.pop-item:hover { background: var(--hover); text-decoration: none; }
.pop-item[aria-current="true"] { color: var(--accent-text); font-weight: 700; }
.pop-head .small { font-family: var(--font-ui); text-transform: none; letter-spacing: 0; color: var(--text-3); }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.task { padding: 8px 10px; }
.task + .task { border-top: 1px solid var(--line); }
.task-title { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.task-sub { font: 400 var(--fs-12)/1.4 var(--font-mono); color: var(--text-3); margin: 3px 0 6px 24px; }
.task .progress { margin-left: 24px; }

.main { min-width: 0; }
/* terminal status strip (site: STATUS: SECURE · SYS.VER …), here with real app state */
.statusline {
  display: flex; align-items: center; gap: 6px 18px; height: var(--status-h); padding: 0 var(--page-pad); overflow: hidden; white-space: nowrap;
  border-bottom: 1px solid var(--line); background: var(--sunken); font: 500 var(--fs-tag)/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3);
}
.statusline .st-item { display: inline-flex; align-items: center; gap: 7px; }
.statusline b { font-weight: 700; color: var(--text-2); }
.statusline .st-live b { color: var(--accent-text); }
.statusline .st-err b { color: var(--danger); }
.statusline a { color: inherit; text-decoration: none; }
.statusline a:hover b { color: var(--accent-text); }
.statusline .st-end { margin-left: auto; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: live 1.6s ease-in-out infinite; }
@keyframes live { 50% { opacity: .3; } }
.page { max-width: 1160px; margin: 0 auto; padding: 40px var(--page-pad) 112px; }
.page-narrow { max-width: 860px; }

/* masthead: // eyebrow, two-tone stencil title, one-line deck, faint watermark word behind (header only) */
.mast { position: relative; isolation: isolate; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding-top: 6px; margin-bottom: 36px; }
/* the watermark box clips its own text, so it never causes horizontal scroll and never clips focus rings in the header */
.mast-wm { position: absolute; z-index: -1; inset: -24px 0 -12px; overflow: hidden; display: flex; align-items: center; justify-content: flex-end; font: 400 clamp(88px, 13vw, 190px)/1 var(--font-display); color: var(--watermark); white-space: nowrap; pointer-events: none; user-select: none; }
.mast-main { min-width: 0; flex: 1 1 420px; }
.mast-title { font: 400 clamp(38px, 4.6vw, 56px)/0.98 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; overflow-wrap: anywhere; }
.mast-deck { margin-top: 14px; font-size: 16.5px; line-height: 1.5; color: var(--text-2); max-width: 60ch; }
.mast-deck b { color: var(--text); font-weight: 600; }
.mast-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mast-sm .mast-title { font-size: clamp(36px, 3.6vw, 46px); }
.mast-sm { margin-bottom: 18px; flex-wrap: nowrap; align-items: flex-start; }
.mast-sm .mast-main { flex: 1 1 0; }
.mast-sm .mast-deck { font-size: 15px; }

.sec-title { font: 400 25px/1.1 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; }
.sec-title-sm { font: 650 16.5px/1.3 var(--font-ui); letter-spacing: -0.005em; }
.sec-title-sm .count-plain { font: 500 var(--fs-tag)/1 var(--font-mono); color: var(--text-3); margin-left: 6px; }
.section { padding: 28px 0; border-top: 1px solid var(--line); }
.section:first-child { border-top: 0; padding-top: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.prose { max-width: 66ch; color: var(--text-2); }

/* ---------- inbox ---------- */
.inbox { display: grid; grid-template-columns: minmax(320px, var(--list-w)) minmax(0,1fr); height: calc(100vh - var(--status-h)); height: calc(100dvh - var(--status-h)); }
.inbox-list { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg); }
.inbox-top { padding: 30px 24px 0; }
.inbox-top .mast { margin-bottom: 0; }
.runline { font: 400 var(--fs-12)/1.6 var(--font-mono); color: var(--text-3); margin-top: 10px; }
.runline b { color: var(--text-2); font-weight: 600; }
.filter-tabs { display: flex; gap: 0; margin-top: 18px; border-bottom: 1px solid var(--line); }
.ftab { height: 42px; padding: 0 12px 0 0; margin-right: 12px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); font: 700 var(--fs-tag)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.ftab:hover { color: var(--text); }
.ftab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
.list-scroll { overflow-y: auto; flex: 1; min-height: 0; }
.jrow {
  display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 14px; align-items: start; width: 100%;
  padding: 16px 24px 16px 24px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; color: var(--text); font-size: var(--fs-list);
  position: relative; transition: background-color var(--t-fast) var(--ease);
}
.jrow:hover { background: var(--hover); }
.jrow[aria-current="true"] { background: var(--selected); }
.jrow[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.jrow-title { font-weight: 600; line-height: 1.3; font-size: 14.5px; }
.jrow-sub { color: var(--text-2); font-size: var(--fs-13); margin-top: 3px; }
.jrow-meta { font: 400 var(--fs-12)/1.6 var(--font-mono); color: var(--text-3); text-align: right; white-space: nowrap; }
.jrow-actions { grid-column: 2 / 4; display: flex; gap: 6px; margin-top: 4px; }
.inbox-detail { overflow-y: auto; min-height: 0; background: var(--bg); }
.list-foot { padding: 14px 24px; font: 400 var(--fs-12)/1.5 var(--font-mono); color: var(--text-3); }

.empty { padding: 48px 24px; text-align: left; max-width: 460px; margin: 0 auto; }
.empty-ico { width: 44px; height: 44px; border-radius: var(--r-panel); background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-text); display: grid; place-items: center; margin-bottom: 18px; }
.empty h2 { font: 400 30px/1.05 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; margin-bottom: 10px; }
.empty p { color: var(--text-2); font-size: var(--fs-14); }
.empty .row { margin-top: 18px; }
.detail-empty { height: 100%; display: grid; place-items: center; color: var(--text-3); font-size: var(--fs-13); padding: 24px; }

.onboard { max-width: 760px; }
.ob-list { list-style: none; margin: var(--s5) 0 0; padding: 0; }
.ob-item { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 16px; padding: 20px 22px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--raised); align-items: start; transition: border-color var(--t-slow) var(--ease); }
.ob-item + .ob-item { margin-top: 10px; }
.ob-item:hover { border-color: var(--accent-line); }
.ob-num { font: 400 40px/0.9 var(--font-display); color: var(--text-3); font-variant-numeric: tabular-nums; display: flex; }
.ob-num .ico { width: 28px; height: 28px; stroke-width: 2.2; color: var(--accent-text); }
.ob-item.done .ob-title { color: var(--text-2); }
.ob-title { font: 650 18px/1.3 var(--font-ui); letter-spacing: -0.01em; }
.ob-text { color: var(--text-2); font-size: var(--fs-14); margin-top: 4px; max-width: 54ch; }

/* ---------- job detail ---------- */
.jd { container-type: inline-size; padding: 30px 40px 72px; max-width: 1100px; margin: 0 auto; }
.jd-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -10px 0 14px; }
.crumbs { display: flex; align-items: center; gap: 6px; font: 500 var(--fs-tag)/1.4 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--text-3); margin-bottom: 14px; }
.crumbs a { color: var(--text-2); font-weight: 600; text-decoration: none; }
.crumbs a:hover { color: var(--text); }
.jd-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; align-items: start; border-top: 1px solid var(--line); padding-top: 18px; }
.jd-title { font: 700 clamp(26px, 4.4cqi, 42px)/1.12 var(--font-ui); letter-spacing: -0.025em; max-width: 20ch; text-wrap: balance; overflow-wrap: anywhere; }
.jd-meta { margin-top: 12px; color: var(--text-2); font-size: var(--fs-14); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.jd-meta + .jd-meta { margin-top: 6px; font: 400 var(--fs-12)/1.5 var(--font-mono); color: var(--text-3); }
.jd-meta .sep { color: var(--text-3); }
.jd-scorebox { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.jd-score { font: 400 clamp(76px, 14cqi, 132px)/0.8 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.jd-band { margin-top: 12px; padding-top: 8px; border-top: 1px solid currentColor; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 100%; }
.jd-band-w { font: 400 21px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.jd-band-of { font: 400 var(--fs-12)/1.3 var(--font-mono); color: var(--text-3); }
.jd-scorebox.strong { color: var(--accent-text); }
.jd-scorebox.weak { color: var(--text-3); }
.jd-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.jd-actions .btn:not(.btn-sm) { height: 42px; padding: 0 18px; }

/* stepper: a ruled track, ink for done, signal for now */
.stepper { list-style: none; margin: 34px 0 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 0 4px; }
.step-btn {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%;
  padding: 14px 6px 4px 0; min-height: 56px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text-3); border-radius: 0;
}
.step-btn::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 2px; background: var(--line); transition: background-color var(--t-mid) var(--ease); }
.step-btn .node { display: none; }
.step-label { font: 700 var(--fs-tag)/1.25 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2; hyphens: auto; -webkit-hyphens: auto; max-width: 100%; }
.step-date { font: 400 var(--fs-12)/1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-3); min-height: 1.2em; }
.step-btn:hover .step-label { color: var(--text); }
.step-btn:hover::before { background: var(--line-strong); }
.step-btn.past { color: var(--text-2); }
.step-btn.past::before { background: var(--text-3); }
.step-btn.current { color: var(--text); }
.step-btn.current::before { background: var(--accent); height: 5px; top: -1px; transform-origin: left center; }
.step-btn.current .step-label { font-weight: 700; color: var(--accent-text); }
.step-btn.current .step-date { color: var(--text-2); }
.anim-step.step-btn.current::before { animation: track-in 420ms var(--ease) both; }
@keyframes track-in { from { transform: scaleX(0); } }

.confirm { margin-top: 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r-panel); border: 1px solid var(--line-strong); background: var(--raised); font-size: var(--fs-13); }
.confirm.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.confirm p { flex: 1 1 260px; }

/* next step: a pull-out with a signal bar, not a box */
.next { margin-top: 30px; padding: 20px 22px; border: 1px solid var(--accent-line); border-left: 3px solid var(--accent); border-radius: var(--r-panel); background: var(--raised); }
.next.tone-warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); border-left-color: var(--warn); }
.next-kicker { font: 500 var(--fs-tag)/1.2 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
.next-kicker::before { content: "// "; }
.next.tone-warn .next-kicker { color: var(--warn-text); }
.next-title { font: 700 clamp(20px, 3cqi, 26px)/1.2 var(--font-ui); margin-top: 8px; letter-spacing: -0.02em; text-wrap: balance; }
.next-text { color: var(--text-2); margin-top: 8px; max-width: 64ch; font-size: 15px; }
.next .row { margin-top: 14px; }
.anim-next { animation: rise 260ms var(--ease) both; }
.inline-warn { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-13); color: var(--text); padding: 5px 10px 5px 8px; border-radius: var(--r-ctl); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); }
.inline-warn > .ico { color: var(--warn-text); }

.checklist { list-style: none; margin: 16px 0 0; padding: 0; max-width: 640px; }
.cl-item { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.cl-item:first-child { border-top: 0; }
.cl-num { font: 400 24px/1 var(--font-display); color: var(--text-3); font-variant-numeric: tabular-nums; display: flex; }
.cl-num .ico { width: 22px; height: 22px; stroke-width: 2.2; color: var(--accent-text); }
.cl-item.done .cl-title { color: var(--text-2); text-decoration: line-through; text-decoration-thickness: 1px; }
.cl-title { font-weight: 600; }
.cl-body .row { margin-top: 6px; }
.flash { animation: flash 900ms var(--ease); }
@keyframes flash { 0%, 100% { border-left-color: var(--accent); } 30% { border-left-color: var(--text); } }

.tabs { display: flex; gap: 0; margin-top: 36px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab { height: 44px; padding: 0 2px; margin-right: 22px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--text-2); font: 700 var(--fs-mono)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.tab:hover { color: var(--text); text-decoration: none; }
.tab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
.tab.dim { color: var(--text-3); }
.tab.dim[aria-selected="true"] { border-bottom-color: var(--line-strong); }
.tab .tab-state { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.tab .tab-state.ok { background: var(--ok); }
.tabpanel { padding-top: 28px; }
.dim-panel { padding: 28px 0; max-width: 54ch; }
.dim-panel h3 { font: 400 22px/1.15 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; margin-bottom: 8px; }
.dim-panel p { color: var(--text-2); font-size: var(--fs-14); }
.dim-panel .row { margin-top: 16px; }

.fit-summary { font: 400 clamp(18px, 2.6cqi, 22px)/1.45 var(--font-ui); letter-spacing: -0.012em; max-width: 52ch; }
.fit-summary b { font-weight: 700; }
.fit-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 36px; margin-top: 30px; }
.fit-grid > div > h3, .fit-grid > section > .sec-title-sm { padding-top: 10px; border-top: 1px solid var(--rule); }
.fit-list { list-style: none; margin: 10px 0 0; padding: 0; }
.fit-list li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); }
.fit-list li:first-child { border-top: 0; }
.fit-list .ico { margin-top: 2px; }
.fit-ok .ico { color: var(--accent-text); stroke-width: 2.2; }
.fit-gap .ico { color: var(--text-3); }
.fit-req { font-weight: 600; color: var(--text); }
.fit-fact { color: var(--text-2); display: block; margin-top: 1px; }
.fit-fact::before { content: "\2190\00a0"; color: var(--text-3); }
.dealbreaker { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: var(--r-tag); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); font: 700 var(--fs-tag)/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--warn-text); }
.provenance { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font: 400 var(--fs-12)/1.6 var(--font-mono); color: var(--text-3); }
.rationale { margin-top: 20px; }
.rationale-body { margin-top: 10px; color: var(--text-2); max-width: 68ch; font-size: var(--fs-14); }
.rationale-body p + p { margin-top: 8px; }
.disclosure { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--text); font: 700 var(--fs-tag)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; }
.disclosure:hover { color: var(--accent-text); }
.disclosure .ico { transition: transform var(--t-fast) var(--ease); }
.disclosure[aria-expanded="true"] .ico { transform: rotate(90deg); }
.feedback { margin-top: 16px; padding: 14px 16px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-panel); }

.kv { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 0 24px; }
.kv dt, .kv dd { padding: 12px 0; border-top: 1px solid var(--line); margin: 0; font-size: var(--fs-14); }
.kv dt { font: 700 var(--fs-tag)/1.6 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--text-2); padding-top: 14px; }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 1px solid var(--rule); }
.ai-stamp { font: 400 var(--fs-12)/1.6 var(--font-mono); color: var(--text-3); margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps-mini { list-style: none; padding: 0; margin: 14px 0 0; }
.steps-mini li { display: flex; gap: 10px; align-items: center; padding: 6px 0; font-size: var(--fs-13); color: var(--text-3); }
.steps-mini li.done { color: var(--text-2); }
.steps-mini li.now { color: var(--text); font-weight: 600; }
.steps-mini .dot { width: 16px; height: 16px; display: grid; place-items: center; }
.steps-mini .dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }

/* Bewerbungsmappe */
.mappe { display: grid; grid-template-columns: minmax(0,1fr); gap: 28px; }
@container (min-width: 760px) { .mappe { grid-template-columns: minmax(0,1fr) minmax(300px, 440px); align-items: start; } }
.mappe-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--rule); }
.docrow { padding: 16px 0; border-top: 1px solid var(--line); }
.docrow:last-of-type { border-bottom: 1px solid var(--line); }
.docrow-top { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.docrow-name { font: 650 17px/1.25 var(--font-ui); letter-spacing: -0.01em; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.docrow-name[aria-pressed="true"] { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.docrow-name:hover { color: var(--accent-text); }
.docrow-state { font: 400 var(--fs-12)/1.5 var(--font-mono); color: var(--text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.docrow-state .stdot { display: inline-block; width: 7px; height: 7px; border-radius: 1px; margin-right: 6px; vertical-align: 0; background: var(--line-strong); }
.docrow-state.ready .stdot { background: var(--ok); }
.docrow-state.run .stdot { background: var(--accent); }
.docrow .progress { margin: 10px 0 0 32px; }
.docrow-actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0 32px; }
.docrow-instr { margin: 10px 0 0 32px; display: grid; gap: 8px; }
.docrow .select select { height: var(--ctl-h-sm); font-size: var(--fs-12); max-width: 210px; }
.preview-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; padding-top: 10px; border-top: 1px solid var(--rule); }

/* The printed proof: an A4 sheet on the desk with crop marks and a slug line. Stays light in dark mode. */
.desk { background: var(--desk); padding: 26px 22px 18px; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--line); border-radius: var(--r-panel); }
.proof {
  position: relative; width: 100%; max-width: 460px; padding: 18px;
  --m: var(--mark);
  background:
    linear-gradient(var(--m), var(--m)) left 0 top 18px / 12px 1px no-repeat,
    linear-gradient(var(--m), var(--m)) left 18px top 0 / 1px 12px no-repeat,
    linear-gradient(var(--m), var(--m)) right 0 top 18px / 12px 1px no-repeat,
    linear-gradient(var(--m), var(--m)) right 18px top 0 / 1px 12px no-repeat,
    linear-gradient(var(--m), var(--m)) left 0 bottom 18px / 12px 1px no-repeat,
    linear-gradient(var(--m), var(--m)) left 18px bottom 0 / 1px 12px no-repeat,
    linear-gradient(var(--m), var(--m)) right 0 bottom 18px / 12px 1px no-repeat,
    linear-gradient(var(--m), var(--m)) right 18px bottom 0 / 1px 12px no-repeat;
}
.proof-slug { width: 100%; max-width: 460px; padding: 0 18px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 400 var(--fs-12)/1.5 var(--font-mono); color: var(--text-2); font-variant-numeric: tabular-nums; }
.proof-slug b { color: var(--text); font-weight: 700; }
.paper {
  width: 100%; aspect-ratio: 210 / 297; background: var(--paper); color: var(--paper-ink);
  box-shadow: 0 0 0 1px rgba(15,23,42,.08), 0 2px 3px rgba(15,23,42,.08), 0 22px 40px -22px rgba(0,0,0,.55);
  container-type: inline-size; overflow: hidden; font-family: var(--font-serif); position: relative;
}
.paper-in { padding: 9cqw 9.5cqw; font-size: 2.3cqw; line-height: 1.42; height: 100%; }
.paper[contenteditable="true"], .paper .paper-in[contenteditable="true"] { outline: 2px dashed var(--accent); outline-offset: 4px; }
.pp-name { font-size: 5.6cqw; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.pp-role { font-size: 2.6cqw; color: var(--paper-muted); margin-top: 0.8cqw; }
.pp-contact { font-size: 2cqw; color: var(--paper-muted); margin-top: 1.6cqw; font-family: var(--font-ui); }
.pp-h { font-size: 2.5cqw; font-weight: 600; margin: 4.2cqw 0 1.4cqw; padding-bottom: 0.8cqw; border-bottom: 0.25cqw solid var(--paper-rule); }
.pp-item { margin-bottom: 1.8cqw; }
.pp-item b { font-weight: 600; }
.pp-item .pp-when { float: right; color: var(--paper-muted); font-family: var(--font-ui); font-size: 1.9cqw; }
.pp-p { margin: 0 0 1.8cqw; }
.pp-small { font-size: 1.9cqw; color: var(--paper-muted); font-family: var(--font-ui); }
.pp-skills { font-size: 2.1cqw; }
.pp-two { display: grid; grid-template-columns: 30% 1fr; gap: 5cqw; }
.pp-side { border-right: 0.25cqw solid var(--paper-rule); padding-right: 4cqw; }
.pp-hl { color: var(--paper-accent); }
.pp-letter-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7cqw; }
.pp-subject { font-weight: 600; margin: 6cqw 0 4cqw; }
.pp-blank { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12cqw; font-family: var(--font-ui); }
.pp-blank p { font-size: 3.4cqw; color: var(--paper-muted); }
.pp-lines { position: absolute; inset: 9cqw 9.5cqw; display: flex; flex-direction: column; gap: 2.4cqw; opacity: .55; }
.pp-lines i { display: block; height: 1.6cqw; background: var(--paper-rule); border-radius: 0; }
.paper.generating .pp-lines i { animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .35; } }
.edit-bar { display: flex; gap: 8px; align-items: center; margin-top: 12px; font: 400 var(--fs-12)/1.5 var(--font-mono); color: var(--text-2); flex-wrap: wrap; }

.prep-sec + .prep-sec { margin-top: 30px; }
.prep-sec > h3 { padding-top: 10px; border-top: 1px solid var(--rule); }
.prep-list { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: q; }
.prep-list li { padding: 12px 0; border-top: 1px solid var(--line); font-size: var(--fs-14); }
.prep-list li:first-child { border-top: 0; }
.prep-q { font-weight: 600; }
.prep-a { color: var(--text-2); margin-top: 3px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 128px 14px minmax(0,1fr); gap: 12px; position: relative; padding-bottom: 16px; font-size: var(--fs-13); }
.tl-date { color: var(--text-3); text-align: right; font: 400 var(--fs-12)/1.5 var(--font-mono); font-variant-numeric: tabular-nums; padding-top: 1px; }
.tl-dot { position: relative; display: flex; justify-content: center; }
.tl-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--line-strong)); margin-top: 5px; position: relative; z-index: 1; }
.timeline li:not(:last-child) .tl-dot::after { content: ""; position: absolute; top: 14px; bottom: -16px; width: 1px; background: var(--line-strong); }
.tl-sub { color: var(--text-2); font-size: var(--fs-12); }

/* ---------- tables ---------- */
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-list); }
.table th { text-align: left; font: 700 var(--fs-tag)/1.3 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; color: var(--text-3); padding: 8px 12px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.table th:first-child, .table td:first-child { padding-left: 0; }
.table th:last-child, .table td:last-child { padding-right: 0; }
.table td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tbody tr.click { cursor: pointer; }
.table tbody tr.click:hover td { background: var(--hover); }
.table tbody tr[aria-current="true"] td { background: var(--selected); }
.table tbody tr[aria-current="true"] td:first-child { box-shadow: inset 2px 0 0 var(--accent); padding-left: 14px; }
.table .r { text-align: right; }
.t-title { font-weight: 600; color: var(--text); }
.t-sub { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; }
.t-score { font: 400 23px/1 var(--font-display); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.t-score.strong { color: var(--accent-text); }

/* Bewerbungen: each phase is a section with its stage number, a stencil title and a count. */
.mag + .mag { margin-top: 52px; }
.mag-head {
  display: grid; grid-template-columns: 40px minmax(0,1fr) auto; column-gap: 8px; align-items: baseline;
  border-top: 2px solid var(--c); padding-top: 14px; margin-bottom: 6px;
}
.mag-no { font: 700 var(--fs-mono)/1 var(--font-mono); color: var(--sb-accent-dim); font-variant-numeric: tabular-nums; align-self: center; }
.mag-no::before { content: "0"; }
.mag-title { font: 400 38px/0.98 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.mag-count { font: 400 38px/0.9 var(--font-display); font-variant-numeric: tabular-nums; color: var(--text-3); }
.mag-hint { grid-column: 2 / 4; font-size: var(--fs-14); color: var(--text-2); margin-top: 10px; max-width: 62ch; }
.mag-table { table-layout: fixed; margin-top: 10px; }
.mag-table .c-title { width: auto; } .mag-table .c-next { width: 23%; } .mag-table .c-due { width: 15%; } .mag-table .c-docs { width: 14%; } .mag-table .c-score { width: 64px; } .mag-table .c-stage { width: 22%; }
.mag-table thead.sr-thead th { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.mag-table td { padding-top: 16px; padding-bottom: 16px; }
.mag-table .t-title { font-size: 15px; }
.next-cell { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.next-cell.warn { color: var(--warn-text); font-weight: 650; }
.next-cell.warn .ico { color: var(--warn-text); }
.docs-cell { font: 400 var(--fs-12)/1.4 var(--font-mono); color: var(--text-2); white-space: nowrap; }
.closed-toggle { margin-top: 44px; }
.mag-closed { margin-top: 18px; }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 0 22px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.bcol { min-width: 0; }
.bcol-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; column-gap: 8px; align-items: baseline; border-top: 2px solid var(--c); padding-top: 12px; margin-bottom: 10px; }
.bcol-no { font: 700 var(--fs-tag)/1 var(--font-mono); color: var(--sb-accent-dim); font-variant-numeric: tabular-nums; }
.bcol-no::before { content: "0"; }
.bcol-title { font: 400 25px/1 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; min-width: 0; }
.bcol-count { font: 400 25px/0.9 var(--font-display); font-variant-numeric: tabular-nums; color: var(--text-3); }
.bcol-head .group-hint { grid-column: 1 / -1; font-size: var(--fs-12); color: var(--text-2); margin-top: 10px; min-height: 4.2em; }
.bcard { position: relative; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: var(--r-panel); background: var(--raised); cursor: pointer; transition: border-color var(--t-slow) var(--ease); }
.bcard + .bcard { margin-top: 8px; }
.bcard:hover { border-color: var(--accent-line); }
.bcard:hover .bcard-title { color: var(--accent-text); }
.bcard-title { font-weight: 600; font-size: var(--fs-14); padding-right: 32px; line-height: 1.3; }
.bcard-sub { font-size: var(--fs-12); color: var(--text-2); margin-top: 3px; }
.bcard-foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: var(--fs-12); gap: 8px; }
.bcard-foot .t-score { font-size: 20px; }
.bcard-menu { position: absolute; top: 6px; right: 4px; }

/* sources */
.src-name { font: 650 16.5px/1.3 var(--font-ui); letter-spacing: -0.01em; }
.src-host { font-family: var(--font-code); font-size: var(--fs-tag); color: var(--text-3); margin-top: 3px; overflow-wrap: anywhere; }
.health { display: inline-flex; gap: 7px; align-items: center; font: 700 var(--fs-tag)/1 var(--font-mono); letter-spacing: var(--track-mono); text-transform: uppercase; white-space: nowrap; }
.health::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.health.err { color: var(--danger); }
.health.err::before { background: var(--danger); }
.health.run::before { background: var(--accent); }
.crawl-live { min-width: 190px; }
.crawl-live .progress { margin-top: 6px; }
.threshold { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 40px; align-items: start; }
.thr-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 10px; }
.thr-big { font: 400 96px/0.8 var(--font-display); font-variant-numeric: tabular-nums; color: var(--accent-text); }
.thr-band { font-size: var(--fs-13); color: var(--text-2); padding-bottom: 2px; }
.thr-band b { display: block; font: 400 20px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--text); }
.thr-control { display: flex; gap: 12px; align-items: center; }
.thr-control input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
.thr-control .input { width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
.thr-scale { display: flex; justify-content: space-between; font: 400 var(--fs-12)/1.4 var(--font-mono); color: var(--text-3); margin-top: 4px; font-variant-numeric: tabular-nums; }

/* side panels / drawers */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(var(--drawer-w, 900px), 100vw); background: var(--bg);
  border-left: 1px solid var(--line-strong); box-shadow: var(--shadow-float); z-index: 51; overflow-y: auto; overscroll-behavior: contain;
}
.drawer.narrow { --drawer-w: 540px; }
.drawer .jd { padding-top: 22px; }
.panel-in { padding: 24px 28px 44px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
.panel-title { font: 400 30px/1.02 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; overflow-wrap: anywhere; }
.panel-head .src-host { margin-top: 8px; }
.wizard-steps { list-style: none; padding: 0; margin: 0 0 24px; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
.wizard-steps li { font: 500 var(--fs-tag)/1.35 var(--font-mono); color: var(--text-3); padding-top: 9px; border-top: 3px solid var(--line); }
.wizard-steps li.done { color: var(--text-2); border-top-color: var(--text-3); }
.wizard-steps li.now { color: var(--accent-text); font-weight: 700; border-top-color: var(--accent); }

<script>
'use strict';
/* ===================== time & format helpers ===================== */
// The prototype runs on a fixed clock so dates in the mock data stay consistent for every viewer.
const TODAY = new Date(2026, 9, 7, 11, 40);
const BOOT = Date.now();
const HOUR = 3600000;
const DAY = 24 * HOUR;
const FOLLOW_UP_DAYS = 10;
const now = () => new Date(TODAY.getTime() + (Date.now() - BOOT));
const hoursAgo = (n) => new Date(TODAY.getTime() - n * HOUR);
const daysAgo = (n, h = 9, m = 0) => { const d = new Date(TODAY); d.setDate(d.getDate() - n); d.setHours(h, m, 0, 0); return d; };

const pad = (n) => String(n).padStart(2, '0');
const fmtD = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
const fmtDY = (d) => `${fmtD(d)}${d.getFullYear()}`;
const fmtT = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDT = (d) => `${fmtISO(d)} ${fmtT(d)}`;

const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function ago(d) {
  const ms = now() - d;
  if (ms < HOUR) return `vor ${Math.max(1, Math.round(ms / 60000))} Min.`;
  if (ms < DAY) return `vor ${Math.round(ms / HOUR)} Std.`;
  const days = daysBetween(d, now());
  return days === 1 ? 'gestern' : `vor ${days} Tagen`;
}
function sinceDays(d) { const n = daysBetween(d, now()); return n === 0 ? 'seit heute' : n === 1 ? 'seit 1 Tag' : `seit ${n} Tagen`; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n) => n.toLocaleString('de-DE') + ' €';

  return { parts, page: parts[0] || 'eingang', sub: parts[1], q: Object.fromEntries(new URLSearchParams(qs || '')) };
}

  const qs = new URLSearchParams(Object.entries(q).filter(([, v]) => v !== null && v !== undefined && v !== '')).toString();

}

  if (j.status === 'INTERVIEW') return { text: `Termin ${fmtD(j.interviewDate)}`, tone: daysBetween(now(), j.interviewDate) <= 2 ? 'warn' : '' };
  if (j.status === 'OFFER') return { text: `bis ${fmtD(j.offerDeadline)}`, tone: '' };
  if (j.status === 'APPLIED') { const d = daysBetween(j.followedUp || j.appliedDate, now()); return { text: sinceDays(j.followedUp || j.appliedDate), tone: d > FOLLOW_UP_DAYS ? 'warn' : '' }; }
  return { text: sinceDays(currentSince(j)), tone: '' };
}
function docsCell(j) {
  const ds = docsState(j);
  if (ds === 'ready') return 'Beide fertig';
  if (ds === 'running') return 'Wird erstellt';
  if (ds === 'partial') return j.docs.cv.state === 'ready' ? 'Nur Lebenslauf' : 'Nur Anschreiben';
  return '–';
}
function defaultJobTab(j) {
  if (j.status === 'OPEN') return 'passung';
  if (j.status === 'DRAFTED') return j.research || researchRunning(j) ? 'unterlagen' : 'unternehmen';
  if (j.status === 'INTERVIEW') return 'interview';
  if (j.status === 'APPLIED' || CLOSED_STATUSES.includes(j.status)) return 'verlauf';
  return 'passung';
}
const currentJobTab = (j) => ui.jobTab[j.id] || defaultJobTab(j);
function tabDim(j, key) {
  const idx = stageIndex(j.status);
  if (key === 'unterlagen' && idx < 1) return 'Unterlagen werden ab Phase Vorgemerkt erstellt';
  if (key === 'interview' && (idx < 3 || (idx === 5 && !j.prep))) return 'Interview-Vorbereitung ab Phase Interview';
  return null;
}

/* ===================== small components ===================== */
function scoreMark(score) {
  const b = band(score);
  return `<span class="score ${bandCls(score)}" title="Passung ${score} von 100: ${b.word}"><span class="score-n">${score}</span><span class="score-w">${b.word}</span></span>`;
}
const bandCls = (score) => ({ 3: 'strong', 2: '', 1: 'weak' })[band(score).bars];
const tScore = (score) => `<span class="t-score ${bandCls(score)}" title="Passung ${score} von 100: ${band(score).word}">${score}</span>`;
/* Two-tone headline as on me.app-by-fh.dev: everything neutral, the last word coral. */
function twoTone(title) {
  const cut = title.lastIndexOf(' ');
  return cut < 0 ? title : `${title.slice(0, cut)} <span class="hl">${title.slice(cut + 1)}</span>`;
}
/* Masthead: // eyebrow with section number, two-tone title, one-line deck, faint watermark word behind the header. */
function mast({ no, title, eyebrow = '', mark = '', deck = '', actions = '', id = '', sm = false }) {
  const kicker = eyebrow ? `<span class="eyebrow">// ${no ? `${no} · ` : ''}${eyebrow}</span>` : '';
  const watermark = mark ? `<span class="mast-wm" aria-hidden="true">${mark}</span>` : '';
  return `<header class="mast ${sm ? 'mast-sm' : ''}">${watermark}<div class="mast-main">${kicker}<h1 class="mast-title" ${id ? `id="${id}"` : ''}>${twoTone(title)}</h1>${deck ? `<p class="mast-deck">${deck}</p>` : ''}</div>${actions ? `<div class="mast-actions">${actions}</div>` : ''}</header>`;
}
function sinceWord(d) {
  const n = daysBetween(d, now());
  return n <= 0 ? 'heute früh' : n === 1 ? 'gestern' : n < 7 ? WEEKDAYS[d.getDay()] : fmtD(d);
}
function deckInbox(n) {
  if (!n) return 'Alles gesichtet. Neue Treffer erscheinen nach dem nächsten Lauf.';
  const list = inboxList('neu');
  const oldest = list.reduce((a, j) => (j.posted < a ? j.posted : a), list[0].posted);
  const top = list[0];
  return `<b>${n} ${n === 1 ? 'neuer Treffer' : 'neue Treffer'}</b> seit ${sinceWord(oldest)}. Am stärksten: ${esc(top.company)} mit ${top.score}.`;
}
function deckPipeline(active) {
  const parts = [`<b>${active} ${active === 1 ? 'Bewerbung läuft' : 'Bewerbungen laufen'}.</b>`];
  const iv = S.jobs.filter((j) => j.status === 'INTERVIEW' && j.interviewDate && j.interviewDate >= startOfDay(now())).sort((a, b) => a.interviewDate - b.interviewDate)[0];
  if (iv) parts.push(`Nächstes Interview: ${esc(iv.company)} am ${WEEKDAYS[iv.interviewDate.getDay()]}.`);
  const due = S.jobs.filter(followUpDue).length;
  if (due) parts.push(due === 1 ? 'Eine wartet aufs Nachfassen.' : `${due} warten aufs Nachfassen.`);
  return parts.join(' ');
}
const stageTag = (status) => `<span class="stage" style="--c:${stageOf(status).color}">${esc(statusLabel(status))}</span>`;
function selectEl({ id, name, value, options, label, change, data = '' }) {
  return `<span class="select"><label class="sr-only" for="${id}">${esc(label)}</label><select class="input" id="${id}" ${name ? `name="${name}"` : ''} data-change="${change}" ${data}>${options.map((o) => `<option value="${esc(o.value)}" ${o.value === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>${icon('chevD')}</span>`;
}
function btn(label, act, { cls = '', ico = '', data = '', attrs = '' } = {}) {
  return `<button type="button" class="btn ${cls}" data-act="${act}" ${data} ${attrs}>${ico ? icon(ico) : ''}${label ? `<span>${label}</span>` : ''}</button>`;
}

/* ===================== job detail (one component, three hosts) ===================== */
function renderJobDetail(j, mode) {
  const tab = currentJobTab(j);
  return `<article class="jd ${mode === 'split' ? 'anim-swap' : ''}" aria-labelledby="jd-title-${j.id}" data-scroll="jd-${mode}" data-anim-key="jd-${mode}-${j.id}">

}
function jdTopbar(j, mode) {

  }
  if (mode === 'drawer') {

function jdHeader(j, mode) {

  const dismiss = j.status === 'OPEN' && j.inbox === 'new' ? btn('Aussortieren', 'dismiss', { ico: 'archive', data: `data-id="${j.id}"` }) : '';

  const inboxNote = j.inbox === 'below' ? `<span class="small muted">Automatisch aussortiert: Passung ${j.score} liegt unter dem Schwellwert ${S.threshold}.</span>` : j.inbox === 'dismissed' ? `<span class="small muted">Von dir aussortiert${j.dismissReason ? ` · Grund: ${esc(j.dismissReason)}` : ''}.</span>` : '';
  return `<header class="jd-head">

      <p class="jd-meta"><span>über ${esc(j.source)}, ${ago(j.posted)}</span><span class="sep">·</span><button type="button" class="link" data-act="openPosting" data-id="${j.id}">Stellenanzeige ${icon('ext')}</button></p>
    </div>
    <div class="jd-scorebox ${bandCls(j.score)}"><div class="jd-score" aria-label="Passung ${j.score} von 100">${j.score}</div><div class="jd-band"><span class="jd-band-w">${b.word}</span><span class="jd-band-of">Passung von 100</span></div></div>
  </header>
  <div class="jd-actions">${primary}${dismiss}${restore}${inboxNote}</div>`;

function renderStepper(j) {
  const cur = stageIndex(j.status);
  const items = STAGES.map((st, i) => {
    const cls = i < cur ? 'past' : i === cur ? 'current' : 'future';
    const date = i === 5 ? lastStatusDate(j, j.status) : lastStatusDate(j, st.key);
    const label = i === 5 && cur === 5 ? statusLabel(j.status) : st.label;
    const dateText = i < cur && date ? fmtISO(date) : i === cur ? (date ? `seit ${fmtISO(date)}` : '') : '';
    const aria = i === cur ? `aria-current="step" data-anim-key="step-${j.id}-${j.status}"` : '';
    return `<li><button type="button" class="step-btn ${cls} ${i === cur ? 'anim-step' : ''}" data-act="stepTo" data-id="${j.id}" data-idx="${i}" ${aria} title="${i === cur ? 'Aktuelle Phase' : `Phase auf „${st.label}“ setzen`}"><span class="node"></span><span class="step-label">${esc(label)}</span><span class="step-date">${dateText}</span></button></li>`;
  }).join('');
  return `<ol class="stepper" aria-label="Phase der Bewerbung">${items}</ol>`;
}
function renderConfirm(j) {
  const c = ui.confirm;
  if (!c || c.id !== j.id) return '';
  if (c.kind === 'back') {
    return `<div class="confirm anim-pop" role="alert"><p>Zurück auf <b>${STAGES[c.idx].label}</b> setzen? Spätere Einträge bleiben im Verlauf erhalten.</p>
      <div class="row">${btn('Zurücksetzen', 'confirmStage', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;
  }
  if (c.kind === 'close') {
    return `<div class="confirm anim-pop" role="alert"><p>Wie ist die Bewerbung ausgegangen?</p>
      <div class="row">${['ACCEPTED', 'REJECTED', 'WITHDRAWN'].map((s) => btn(OUTCOME_LABEL[s], 'closeAs', { cls: 'btn-sm', data: `data-id="${j.id}" data-status="${s}"` })).join('')}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;
  }
  if (c.kind === 'nodocs') {
    return `<div class="confirm warn anim-pop" role="alert">${icon('alert')}<p>Für diese Stelle gibt es noch keine fertigen Unterlagen. Trotzdem als beworben markieren?</p>
      <div class="row">${btn('Trotzdem markieren', 'confirmStage', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Unterlagen erstellen', 'genMissing', { cls: 'btn-sm', data: `data-id="${j.id}"` })}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;

  return '';
}
function renderNextPanel(j) {
  const ns = nextStep(j);

  if (ns.checklist) extra = renderApplyChecklist(j);
  else if (ns.applyWithout) extra = renderApplyWithout(j);

  return `<section class="next anim-next ${ns.tone ? 'tone-' + ns.tone : ''} ${ui.flash === 'next-' + j.id ? 'flash' : ''}" aria-labelledby="next-${j.id}" data-anim-key="next-${j.id}-${j.status}-${ns.title}">

    <h3 class="next-title" id="next-${j.id}">${esc(ns.title)}</h3>

}
function renderApplyWithout(j) {

function renderApplyChecklist(j) {

/* ===================== Unterlagen = Bewerbungsmappe ===================== */
function docStateText(d) {

/* ===================== Eingang ===================== */
const INBOX_TABS = [{ key: 'neu', label: 'Neu', filter: 'new' }, { key: 'unter', label: 'Unter Schwellwert', filter: 'below' }, { key: 'aus', label: 'Aussortiert', filter: 'dismissed' }];
function inboxList(tabKey) {
  const f = INBOX_TABS.find((t) => t.key === tabKey).filter;
  const list = S.jobs.filter((j) => j.status === 'OPEN' && j.inbox === f);
  return f === 'new' ? list.sort((a, b) => b.score - a.score) : list.sort((a, b) => b.posted - a.posted);
}
function renderInbox(r) {
  if (r.sub === 'start') return renderOnboarding();
  const tab = INBOX_TABS.some((t) => t.key === r.q.tab) ? r.q.tab : 'neu';
  const forceEmpty = r.sub === 'leer';
  const list = forceEmpty && tab === 'neu' ? [] : inboxList(tab);
  let selId = r.q.job ? Number(r.q.job) : null;
  if (!selId && !isMobile() && list.length) selId = list[0].id;
  const sel = selId ? jobById(selId) : null;
  const src = srcById(S.lastRunSource);
  const counts = { neu: forceEmpty ? 0 : inboxList('neu').length, unter: inboxList('unter').length, aus: inboxList('aus').length };
  return `<div class="inbox ${sel && r.q.job ? 'has-sel' : ''}">
    <section class="inbox-list" aria-labelledby="inbox-h">
      <div class="inbox-top">
        ${mast({ no: '01', title: 'Dein Eingang', eyebrow: 'Stellen sichten', mark: 'TRIAGE', id: 'inbox-h', sm: true, deck: deckInbox(counts.neu), actions: btn('', 'openImport', { cls: 'btn-ghost btn-sm btn-icon', ico: 'link', attrs: 'title="Einzelne Stelle per URL importieren" aria-label="Einzelne Stelle per URL importieren"' }) })}
        <p class="runline">Letzter Lauf: <b>${esc(src.name)}</b>, ${ago(src.lastRun)}. <span class="num">${src.found}</span> gefunden, <span class="num">${src.matched}</span> passend, <span class="num">${src.below}</span> unter Schwellwert ${S.threshold}. <button type="button" class="link" data-act="inboxTab" data-tab="unter">Ansehen</button></p>
        <div class="filter-tabs" role="tablist" aria-label="Filter">${INBOX_TABS.map((t) => `<button type="button" role="tab" class="ftab" aria-selected="${t.key === tab}" data-act="inboxTab" data-tab="${t.key}">${t.label}<span class="${t.key === 'neu' && counts[t.key] ? 'count-badge' : 'count-plain'}">${counts[t.key]}</span></button>`).join('')}</div>
      </div>
      <div class="list-scroll stagger" data-scroll="inbox-list">
        ${tab === 'unter' && list.length ? `<p class="list-foot" style="border-bottom:1px solid var(--line)">Diese Stellen liegen unter deinem Schwellwert von ${S.threshold} und wurden automatisch aussortiert. <a href="#/quellen">Schwellwert ändern</a></p>` : ''}
        ${list.length ? list.map((j) => renderInboxRow(j, j.id === (sel && sel.id), tab)).join('') : renderInboxEmpty(tab)}
        <p class="list-foot"><a href="#/eingang/start">Ersteinrichtung ansehen</a></p>
      </div>
    </section>
    <section class="inbox-detail" aria-label="Stellendetails" data-scroll="inbox-detail">${sel ? renderJobDetail(sel, 'split') : `<div class="detail-empty">Wähle links eine Stelle aus.</div>`}</section>
  </div>`;
}
function renderInboxRow(j, selected, tab) {
  const meta = tab === 'aus' ? `${esc(j.dismissReason || 'ohne Grund')}` : ago(j.posted);
  return `<div class="jrow" role="button" tabindex="0" data-act="selectInbox" data-id="${j.id}" ${selected ? 'aria-current="true"' : ''}>
    ${scoreMark(j.score)}
    <div><div class="jrow-title">${esc(j.title)}</div><div class="jrow-sub">${esc(j.company)} · ${esc(j.city)} · ${esc(j.mode)}</div></div>
    <div class="jrow-meta"><div class="num">${meta}</div><div>${esc(j.source)}</div></div>
    ${tab !== 'neu' ? `<div class="jrow-actions">${btn('Wiederherstellen', 'restore', { cls: 'btn-sm', ico: 'undo', data: `data-id="${j.id}"` })}</div>` : ''}
  </div>`;
}
function renderInboxEmpty(tab) {
  if (tab === 'neu') {
    const nextSrc = S.sources.find((s) => s.id === 'stepstone');
    return `<div class="empty"><div class="empty-ico">${icon('check')}</div><h2>Alles gesichtet.</h2><p>Nächster Lauf heute ${nextSrc.next} (${esc(nextSrc.name)}). Neue passende Stellen erscheinen dann hier${S.channels.some((c) => c.on) ? ', und du bekommst eine Benachrichtigung' : ''}.</p>
      <div class="row"><a class="btn" href="#/quellen">${icon('globe')}<span>Quellen ansehen</span></a>${btn(`Unter Schwellwert (${inboxList('unter').length})`, 'inboxTab', { cls: 'btn-ghost', data: 'data-tab="unter"' })}</div></div>`;
  }
  return `<div class="empty"><h2>${tab === 'aus' ? 'Nichts aussortiert' : 'Keine Stellen unter dem Schwellwert'}</h2><p>${tab === 'aus' ? 'Stellen, die du aussortierst, landen hier und lassen sich mit einem Klick wiederherstellen.' : 'Alle gefundenen Stellen lagen über dem Schwellwert.'}</p></div>`;
}
function renderOnboarding() {
  const o = ui.onboard;
  const steps = [
    { key: 'profile', title: 'Profil ausfüllen', text: 'Wunschrolle, Orte, Gehalt und Lebenslauf. Daran misst die KI jede gefundene Stelle.', act: `<a class="btn" href="#/profil">Profil öffnen</a>` },
    { key: 'source', title: 'Erste Quelle hinzufügen', text: 'Eine Suchergebnisseite auf einem Jobportal oder die Karriereseite eines Unternehmens, die regelmäßig durchsucht wird.', act: btn('Quelle hinzufügen', 'openAddSource', { cls: o.profile && !o.source ? 'btn-primary' : '' }) },
    { key: 'ai', title: 'KI-Anbieter verbinden', text: 'OpenRouter-Schlüssel oder eine lokale Ollama-Instanz. Ohne Anbieter kann nichts bewertet oder geschrieben werden.', act: `<a class="btn ${o.source && !o.ai ? 'btn-primary' : ''}" href="#/einstellungen/ki-anbieter">KI-Anbieter einrichten</a>` },
    { key: 'run', title: 'Ersten Lauf starten', text: 'Durchsucht alle Quellen einmal sofort. Danach läuft alles nach Zeitplan.', act: btn('Jetzt durchsuchen', 'onboardRun', { cls: o.source && o.ai && !o.run ? 'btn-primary' : '', attrs: o.source && o.ai ? '' : 'disabled title="Erst Quelle und KI-Anbieter einrichten"' }) },
  ];
  const done = steps.filter((s) => o[s.key]).length;

    <div class="progress" style="margin-top:-14px;max-width:320px"><i style="width:${(done / 4) * 100}%"></i></div>
    <ol class="ob-list">${steps.map((s, i) => `<li class="ob-item ${o[s.key] ? 'done' : ''}"><span class="ob-num">${o[s.key] ? icon('check') : i + 1}</span><div><div class="ob-title">${s.title}</div><p class="ob-text">${s.text}</p></div><div class="ob-act">${o[s.key] ? '<span class="small faint">Erledigt</span>' : s.act}</div></li>`).join('')}</ol>
    <p class="small faint" style="margin-top:18px">Diese Ansicht erscheint, solange keine Quelle eingerichtet ist. <a href="#/eingang">Zum normalen Eingang</a></p></div>`;

/* ===================== Bewerbungen ===================== */
const PIPE_GROUPS = ['DRAFTED', 'APPLIED', 'INTERVIEW', 'OFFER'];
const GROUP_LABEL = { DRAFTED: 'Vorgemerkt', APPLIED: 'Beworben', INTERVIEW: 'Interview', OFFER: 'Angebot' };
/* One line per phase: what it means and what usually comes next. Shown in the group header. */
const GROUP_HINT = {
  DRAFTED: 'Noch nicht beworben. Firma recherchieren, Unterlagen erstellen, dann bewerben.',
  APPLIED: 'Die Bewerbung ist raus. Ohne Antwort nach zwei Wochen kurz nachfassen.',
  INTERVIEW: 'Gespräche stehen an. Vorbereitung durchgehen und Termine im Blick behalten.',
  OFFER: 'Ein Angebot liegt vor. Konditionen prüfen und vor der Frist entscheiden.',
  CLOSED: 'Zusagen, Absagen und Rückzüge. Notizen und Unterlagen bleiben zum Nachschlagen.',
};
const stageColor = (st) => STAGES[stageIndex(st)].color;
function pipelineJobs(status) { return S.jobs.filter((j) => j.status === status).sort((a, b) => currentSince(a) - currentSince(b)); }
function renderPipeline(r) {
  const view = r.q.ansicht === 'board' ? 'board' : 'list';
  const closed = S.jobs.filter((j) => CLOSED_STATUSES.includes(j.status));
  const active = PIPE_GROUPS.reduce((n, s) => n + pipelineJobs(s).length, 0);
  const showClosed = r.q.abgeschlossen === '1';
  const seg = `<div class="seg" role="group" aria-label="Ansicht"><button type="button" aria-pressed="${view === 'list'}" data-act="pipeView" data-v="list">${icon('list')}Liste</button><button type="button" aria-pressed="${view === 'board'}" data-act="pipeView" data-v="board">${icon('columns')}Board</button></div>`;
  return `<div class="page">${mast({ no: '02', title: 'Deine Bewerbungen', eyebrow: 'Pipeline', mark: 'PIPELINE', deck: deckPipeline(active), actions: seg })}
    ${view === 'list' ? renderPipeTable() : renderBoard()}
    <div class="closed-toggle">${btn(`${showClosed ? 'Abgeschlossene ausblenden' : 'Abgeschlossen'} (${closed.length})`, 'toggleClosed', { cls: 'btn-ghost btn-sm', ico: showClosed ? 'chevD' : 'chevR' })}</div>
    ${showClosed ? renderClosedTable(closed) : ''}</div>`;
}
/* A phase section: stage number (its real position in the sequence), large title, count, one-line hint. */
function magHead(st, n) {
  return `<header class="mag-head"><span class="mag-no" aria-hidden="true">${stageIndex(st)}</span><h2 class="mag-title" id="grp-${st}">${esc(STAGES[stageIndex(st)].label)}</h2><span class="mag-count num" aria-label="${n} ${n === 1 ? 'Stelle' : 'Stellen'}">${n}</span><p class="mag-hint">${GROUP_HINT[st]}</p></header>`;
}
function renderPipeTable() {
  // Each phase is its own section; fixed column widths keep the rows of all sections aligned.
  return PIPE_GROUPS.filter((st) => pipelineJobs(st).length).map((st, i) => {
    const jobs = pipelineJobs(st);
    return `<section class="mag" style="--c:${stageColor(st)}" aria-labelledby="grp-${st}">${magHead(st, jobs.length)}
      <table class="table stack-sm mag-table"><colgroup><col class="c-title"><col class="c-next"><col class="c-due"><col class="c-docs"><col class="c-score"></colgroup>
      <thead class="${i ? 'sr-thead' : ''}"><tr><th>Stelle / Firma</th><th>Nächster Schritt</th><th>Seit / Fällig</th><th>Unterlagen</th><th class="r">Score</th></tr></thead>
      <tbody>${jobs.map(pipeRow).join('')}</tbody></table></section>`;
  }).join('');
}
function pipeRow(j) {
  const ns = nextStep(j);
  const due = dueCell(j);
  const sel = route().q.job === String(j.id);
  return `<tr class="click" tabindex="0" data-act="openDrawer" data-id="${j.id}" ${sel ? 'aria-current="true"' : ''}>
    <td class="first-sm"><div><div class="t-title">${esc(j.title)}</div><div class="t-sub">${esc(j.company)}, ${esc(j.city)}</div></div></td>
    <td data-label="Nächster Schritt"><span class="next-cell ${ns.tone === 'warn' ? 'warn' : ''}">${ns.tone === 'warn' ? icon('clock') : ''}${esc(ns.short)}</span></td>
    <td data-label="Seit / Fällig" class="num ${due.tone === 'warn' ? 't-warn' : 'muted'}">${due.text}</td>
    <td data-label="Unterlagen" class="docs-cell">${docsCell(j)}</td>
    <td data-label="Score" class="r t-score-cell">${tScore(j.score)}</td></tr>`;
}
function renderClosedTable(closed) {
  return `<section class="mag mag-closed" style="--c:${stageColor('CLOSED')}" aria-labelledby="grp-CLOSED">${magHead('CLOSED', closed.length)}
    <table class="table stack-sm mag-table"><colgroup><col class="c-title"><col class="c-stage"><col class="c-due"><col class="c-score"></colgroup>
    <thead class="sr-thead"><tr><th>Stelle / Firma</th><th>Ausgang</th><th>Abgeschlossen</th><th class="r">Score</th></tr></thead>
    <tbody>${closed.map((j) => `<tr class="click" tabindex="0" data-act="openDrawer" data-id="${j.id}"><td class="first-sm"><div><div class="t-title">${esc(j.title)}</div><div class="t-sub">${esc(j.company)}, ${esc(j.city)}</div></div></td><td data-label="Ausgang">${stageTag(j.status)}</td><td class="num muted" data-label="Abgeschlossen">${fmtDY(currentSince(j))}</td><td class="r t-score-cell" data-label="Score">${tScore(j.score)}</td></tr>`).join('')}</tbody></table></section>`;
}
function renderBoard() {
  const cols = PIPE_GROUPS.filter((st) => pipelineJobs(st).length);
  return `<div class="board">${cols.map((st) => `<section class="bcol" aria-labelledby="bcol-${st}" style="--c:${stageColor(st)}"><div class="bcol-head"><span class="bcol-no" aria-hidden="true">${stageIndex(st)}</span><h2 class="bcol-title" id="bcol-${st}">${GROUP_LABEL[st]}</h2><span class="bcol-count num" aria-label="${pipelineJobs(st).length} Stellen">${pipelineJobs(st).length}</span><p class="group-hint">${GROUP_HINT[st]}</p></div>
    ${pipelineJobs(st).map((j) => {
      const ns = nextStep(j);
      const menu = ui.popover === `card-${j.id}` ? `<div class="popover down-right anim-pop" role="menu" aria-label="Phase ändern"><div class="pop-head">Phase ändern</div>${[...STAGES.slice(0, 5).map((s) => s.key), 'CLOSED'].map((k, i) => `<button type="button" role="menuitem" class="pop-item" data-act="boardMove" data-id="${j.id}" data-idx="${i}" ${stageIndex(j.status) === i ? 'aria-current="true"' : ''}><span class="stage" style="--c:${STAGES[i].color}">${STAGES[i].label}</span>${stageIndex(j.status) === i ? `<span style="margin-left:auto">${icon('check')}</span>` : ''}</button>`).join('')}</div>` : '';
      return `<article class="bcard" data-act="openDrawer" data-id="${j.id}" tabindex="0"><div class="bcard-title">${esc(j.title)}</div><div class="bcard-sub">${esc(j.company)}, ${esc(j.city)}</div>
        <div class="bcard-foot"><span class="next-cell ${ns.tone === 'warn' ? 'warn' : ''}">${ns.tone === 'warn' ? icon('clock') : ''}${esc(ns.short)}</span>${tScore(j.score)}</div>
        <div class="bcard-menu pop-anchor"><button type="button" class="btn btn-ghost btn-sm btn-icon" data-act="togglePop" data-pop="card-${j.id}" data-popover-trigger aria-haspopup="menu" aria-expanded="${ui.popover === `card-${j.id}`}" aria-label="Phase ändern">${icon('more')}</button>${menu}</div></article>`;
    }).join('')}</section>`).join('')}</div>`;
}

          <p class="prose" style="margin-top:6px">Stellen mit einer Passung unter diesem Wert landen nicht im Eingang, sondern im Filter „Unter Schwellwert“. Dort kannst du sie jederzeit ansehen und mit einem Klick zurückholen. Gilt für alle Quellen.</p>

  </div>${''}`;
}
function deckSources() {
  const err = S.sources.filter((s) => s.status === 'error').length;

}
function thresholdBand(v) { return `<b>${v >= 80 ? 'Nur starke Treffer' : v >= 60 ? 'Mögliche und starke' : v > 0 ? 'Auch schwache Treffer' : 'Alle Stellen'}</b>kommen in den Eingang`; }
function thresholdHint(v) {
  const below = S.jobs.filter((j) => j.status === 'OPEN' && j.inbox !== 'dismissed' && j.score < v).length;
