/*
  Variant "Referenz", second pass. Oriented on two reference dashboards, not copied from them.
  Kept from the references: Urbanist, large light page titles with small bold captions, big numerals used
  sparingly (job score, funnel counts), near-black for selected and primary, ONE orange accent for
  "your next move", the tick device (score ticks, funnel, threshold distribution), soft borderless cards
  on light grey, pills for everything clickable, company monograms, ink toasts, the A4 page on the desk.
  Dropped: the floating frame, the right rail, the lollipop chart, the accordion list, the board,
  the sidebar tree and the dashboard tiles on Quellen.
  - Shell: full-bleed. White sidebar, grey working area, content max 1120px.
  - Colour rule: ink = selected / primary. Orange only for the "Nächster Schritt" card, due warnings and
    the brand mark. Everything else is grey scale. Phases run from light grey to ink, so darker = further.
  - Controls: every interactive boundary has >= 3:1 (--line-control). Static tags are hairline, not pills.
  Type: Urbanist (variable, OFL) for UI, Source Serif 4 only for the A4 previews.
*/
:root {
  --font-ui: "Urbanist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-serif: "Source Serif 4", "Iowan Old Style", "Charter", Cambria, Georgia, serif;
  --font-code: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;

  /* 13.5px is the floor for meaningful text; 12.5px only for provenance lines. */
  --fs-legal: 12.5px; --fs-12: 13.5px; --fs-13: 13.5px; --fs-14: 14.5px; --fs-16: 16px; --fs-18: 18px; --fs-22: 22px;
  --fs-title: 40px; --fs-num: 40px;

  --r-card: 24px; --r-inner: 16px; --r-field: 12px; --r-tag: 8px; --r-pill: 999px;
  --ctl-h: 40px; --ctl-h-sm: 34px;
  --sidebar-w: 232px; --pane-pad: 40px; --content-max: 1120px;
  --ease: cubic-bezier(.2,.7,.3,1); --t-fast: 120ms; --t-mid: 180ms;

  --frame: #ffffff;
  --bg: #f2f3f5;
  --surface: #ffffff;
  --sunken: #f0f1f3;
  --hover: #e8eaed;
  --line: #e6e8eb;
  --line-strong: #cfd3d9;
  --line-control: #7d8491;
  --text: #171b26;
  --text-2: #545b68;
  --text-3: #666d7a;
  --ink: #171b26;
  --on-ink: #ffffff;
  --accent: #ee5f25;
  --on-accent: #171b26;
  --accent-soft: #fde9df;
  --focus: #171b26;
  --danger: #c22b3b;
  --danger-soft: #fbe7e9;
  --warn-text: #8a5a00;
  --warn-soft: #fbf1dc;
  --ok: #1f7a4d;
  --scrim: rgba(23, 27, 38, .32);
  --shadow-float: 0 2px 6px rgba(23, 27, 38, .06), 0 24px 56px -16px rgba(23, 27, 38, .24);
  --st-open: #8b93a1;
  --st-drafted: #8b93a1;
  --st-applied: #67758b;
  --st-interview: #434e60;
  --st-offer: var(--ink);
  --st-closed: #7c8492;
  --paper: #fffefb;
  --paper-ink: #1d2230;
  --paper-muted: #5a6070;
  --paper-rule: #d9dbe0;
  color-scheme: light;
}
:root[data-mode="dark"] {
  --frame: #15181e;
  --bg: #101318;
  --surface: #1b1f27;
  --sunken: #242933;
  --hover: #2b303b;
  --line: #2a2f39;
  --line-strong: #3b414d;
  --line-control: #6f7787;
  --text: #eceef2;
  --text-2: #a8aeb9;
  --text-3: #8a91a0;
  --ink: #eceef2;
  --on-ink: #14171d;
  --accent: #f26a30;
  --on-accent: #14171d;
  --accent-soft: #3a2419;
  --focus: #eceef2;
  --danger: #f07480;
  --danger-soft: #3a1d22;
  --warn-text: #e8b55a;
  --warn-soft: #33290f;
  --ok: #5fc58f;
  --scrim: rgba(0, 0, 0, .55);
  --shadow-float: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 56px -12px rgba(0, 0, 0, .6);
  --st-open: #6f7787;
  --st-drafted: #6f7787;
  --st-applied: #8d9ab0;
  --st-interview: #b3bccb;
  --st-closed: #6f7787;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 500 var(--fs-14)/1.5 var(--font-ui); font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--text); text-decoration: underline; text-decoration-color: var(--line-control); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
/* The outline follows each element's own radius; no forced radius. */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: var(--fs-12); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.ico { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico-lg { width: 22px; height: 22px; }
.code { font-family: var(--font-code); font-size: 13px; }
hr.div { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
@media (min-width: 768px) { .mobile-only { display: none !important; } }

/* ---------- controls: clickable things are pills ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--ctl-h); padding: 0 18px; border-radius: var(--r-pill);
  border: 1px solid var(--line-control); background: var(--surface); color: var(--text);
  font-size: var(--fs-14); font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 86%, var(--surface)); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-sm { height: var(--ctl-h-sm); padding: 0 14px; font-size: var(--fs-13); }
.btn-icon { width: var(--ctl-h); padding: 0; }
.btn-sm.btn-icon { width: var(--ctl-h-sm); }
.btn-wide { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--line-control); text-underline-offset: 3px; display: inline-flex; gap: 4px; align-items: center; }
.link:hover { text-decoration-color: currentColor; }
.link .ico { width: 15px; height: 15px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Text fields are fields, not pills. */
.input {
  width: 100%; height: var(--ctl-h); padding: 0 14px; border-radius: var(--r-field);
  border: 1px solid var(--line-control); background: var(--surface); color: var(--text); font-size: var(--fs-14); font-weight: 500;
}
.input::placeholder { color: var(--text-3); }
.input:focus-visible { outline-offset: 0; border-color: var(--focus); }
textarea.input { height: auto; min-height: 96px; padding: 12px 14px; line-height: 1.5; resize: vertical; }
.select { position: relative; display: inline-flex; align-items: center; min-width: 0; }
.select select { appearance: none; -webkit-appearance: none; padding-right: 38px; cursor: pointer; }
.select .ico { position: absolute; right: 12px; pointer-events: none; color: var(--text-2); width: 16px; height: 16px; }
.field { display: block; }
.field + .field { margin-top: 20px; }
.label { display: block; font-size: var(--fs-13); font-weight: 600; margin-bottom: 8px; color: var(--text); }
.hint { font-size: var(--fs-12); color: var(--text-3); margin-top: 6px; line-height: 1.45; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 5px 0; }
.check input { margin: 3px 0 0; accent-color: var(--ink); width: 16px; height: 16px; flex: none; }
.radio-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.radio-row:first-child { border-top: 0; }
.radio-row input { margin: 3px 0 0; accent-color: var(--ink); width: 16px; height: 16px; }

/* Segmented pill control: pressed = ink fill. The track has a visible boundary. */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-control); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button, .seg a {
  height: 34px; padding: 0 16px; border: 0; background: transparent; border-radius: var(--r-pill); white-space: nowrap; text-decoration: none;
  font-size: var(--fs-13); font-weight: 600; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; flex: none;
}
.seg button:hover, .seg a:hover { color: var(--text); background: var(--sunken); }
.seg [aria-pressed="true"], .seg [aria-selected="true"], .seg [aria-current="page"] { background: var(--ink); color: var(--on-ink); }
.seg [aria-pressed="true"]:hover, .seg [aria-selected="true"]:hover, .seg [aria-current="page"]:hover { background: var(--ink); color: var(--on-ink); }
.seg .cnt { font-variant-numeric: tabular-nums; opacity: .75; font-weight: 600; }

/* chip = clickable pill (filters, reasons); tag = static label (hairline, square-ish, no fill). */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: var(--r-pill);
  border: 1px solid var(--line-control); background: var(--surface); font-size: var(--fs-13); font-weight: 600; color: var(--text); cursor: pointer; white-space: nowrap;
}
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 2px 10px; border-radius: var(--r-tag); border: 1px solid var(--line-strong); font-size: var(--fs-13); font-weight: 600; color: var(--text-2); }
.tag .ico { width: 15px; height: 15px; }
.tag-x { border: 0; background: none; padding: 0; width: 28px; height: 28px; margin: -4px -8px -4px -2px; border-radius: var(--r-pill); color: var(--text-2); cursor: pointer; display: inline-grid; place-items: center; }
.tag-x:hover { background: var(--hover); color: var(--text); }
.tag-x .ico { width: 14px; height: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--sunken); color: var(--text); }
.badge-ink { background: var(--ink); color: var(--on-ink); }
.badge-line { background: transparent; box-shadow: inset 0 0 0 1px var(--line-control); color: var(--text-2); }
.badge-err { background: var(--danger-soft); color: var(--danger); }
.badge-warn { background: var(--warn-soft); color: var(--warn-text); }
.count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--r-pill); font-size: 12.5px; font-weight: 700; background: var(--ink); color: var(--on-ink); font-variant-numeric: tabular-nums; }
.count-badge.due { background: var(--accent); color: var(--on-accent); }
.count-badge.err { background: var(--danger); color: var(--on-ink); }
.count-plain { font-size: var(--fs-12); color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 600; }

.stage { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-13); font-weight: 600; color: var(--text); white-space: nowrap; }
.stage::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--st-open)); flex: none; }

/* Monograms stand in for company logos, and only for companies. */
.mono { width: 44px; height: 44px; border-radius: 14px; background: var(--sunken); color: var(--text); display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .01em; flex: none; }
.mono-sm { width: 36px; height: 36px; border-radius: 12px; font-size: 13px; }
.mono-lg { width: 60px; height: 60px; border-radius: 18px; font-size: 20px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; }

/* Tick rows: the reference's barcode device, used for the score. */
.ticks { display: inline-flex; gap: 3px; align-items: flex-end; height: 18px; }
.ticks i { width: 2px; height: 100%; border-radius: 1px; background: var(--line-strong); }
.ticks i.on { background: var(--ink); }
.progress { height: 6px; border-radius: var(--r-pill); background: var(--hover); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); transition: width 300ms var(--ease); }
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-inner); background: var(--sunken); font-size: var(--fs-13); color: var(--text); }
.notice .ico { margin-top: 1px; }
.notice-warn { background: var(--warn-soft); }
.notice-warn > .ico { color: var(--warn-text); }
.notice-error { background: var(--danger-soft); }
.notice-error > .ico { color: var(--danger); }
.notice { flex-wrap: wrap; }
.notice > :not(.ico):not(.btn):not(.grow) { flex: 1 1 0; min-width: 0; }
.notice > .grow { flex: 1 1 220px; min-width: 0; }
.t-warn { color: var(--warn-text); }
.t-danger { color: var(--danger); }
.t-ok { color: var(--ok); }

/* ---------- shell: full-bleed ---------- */
.frame { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: 100vh; min-height: 100dvh; }
.sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 22px; padding: 26px 16px 18px; overflow-y: auto; background: var(--frame); }
:root[data-mode="dark"] .sidebar { box-shadow: inset -1px 0 0 var(--line); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; font-weight: 700; font-size: var(--fs-18); letter-spacing: -0.015em; }
.brand-mark { width: 30px; height: 30px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; gap: 3px; flex: none; }
.brand-mark i { width: 2.5px; border-radius: 1px; background: var(--on-accent); }
.brand-mark i:nth-child(1) { height: 9px; } .brand-mark i:nth-child(2) { height: 15px; } .brand-mark i:nth-child(3) { height: 11px; }
.side-search { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border-radius: var(--r-field); border: 1px solid var(--line-control); background: var(--surface); color: var(--text-3); font-size: var(--fs-13); font-weight: 500; cursor: pointer; text-align: left; }
.side-search:hover { background: var(--sunken); color: var(--text-2); }
.side-search .key { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--text-3); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; line-height: 18px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 14px;
  color: var(--text-2); font-weight: 600; font-size: var(--fs-14); text-decoration: none;
}
.nav a .ico { width: 20px; height: 20px; }
.nav a:hover { background: var(--sunken); color: var(--text); }
.nav a[aria-current="page"] { background: var(--sunken); color: var(--text); font-weight: 700; }
.nav a .nav-end { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.side-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 6px 12px; border: 0; border-radius: 14px; background: none; color: var(--text-2); font-size: var(--fs-13); font-weight: 600; text-align: left; cursor: pointer; }
.side-btn:hover, .side-btn[aria-expanded="true"] { background: var(--sunken); color: var(--text); }
.side-btn .grow { flex: 1; min-width: 0; }
.side-btn.user { padding-left: 6px; }
.side-btn .who b { display: block; color: var(--text); font-size: var(--fs-14); font-weight: 700; line-height: 1.25; }
.side-btn .who span { display: block; font-size: var(--fs-12); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pop-anchor { position: relative; }

.popover {
  position: absolute; z-index: 60; min-width: 280px; background: var(--surface); border-radius: 20px;
  box-shadow: var(--shadow-float); padding: 8px; font-size: var(--fs-13);
}
:root[data-mode="dark"] .popover { box-shadow: var(--shadow-float), inset 0 0 0 1px var(--line); }
.popover.up { bottom: calc(100% + 8px); left: 0; right: 0; }
.sidebar .popover { min-width: 0; }
.popover.down-right { top: calc(100% + 8px); right: 0; }
.pop-head { padding: 10px 12px 6px; font-weight: 700; font-size: var(--fs-14); }
.pop-label { padding: 8px 12px 2px; font-size: var(--fs-12); color: var(--text-3); font-weight: 600; }
.pop-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 12px; border: 0; background: none; border-radius: 12px; text-align: left; cursor: pointer; color: var(--text); font-size: var(--fs-13); font-weight: 600; text-decoration: none; }
.pop-item:hover { background: var(--sunken); text-decoration: none; }
.pop-item[aria-current="true"], .pop-item[aria-checked="true"] { font-weight: 700; }
.pop-item[disabled] { cursor: default; color: var(--text-2); }
.pop-item[disabled]:hover { background: none; }
.pop-item .end { margin-left: auto; display: inline-flex; }
.pop-sep { height: 1px; background: var(--line); margin: 6px; }
.task { padding: 10px 12px; }
.task + .task { border-top: 1px solid var(--line); }
.task-title { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.task-sub { font-size: var(--fs-12); color: var(--text-2); margin: 3px 0 8px 26px; }
.task .progress { margin-left: 26px; }
.done-list { list-style: none; margin: 0; padding: 0 0 4px; }
.done-list li { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 8px; padding: 8px 12px; align-items: start; font-size: var(--fs-13); }
.done-list .when { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: var(--fs-12); }
.done-list .ico { width: 16px; height: 16px; margin-top: 2px; }
.done-list .unseen { font-weight: 700; }

.main { min-width: 0; background: var(--bg); }
.pane { min-width: 0; max-width: calc(var(--content-max) + 2 * var(--pane-pad)); margin: 0 auto; padding: 40px var(--pane-pad) 72px; }
.pane-narrow { max-width: calc(940px + 2 * var(--pane-pad)); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin-bottom: 28px; flex-wrap: wrap; }
.page-title { font-weight: 400; font-size: var(--fs-title); line-height: 1.08; letter-spacing: -0.03em; }
.page-lede { margin-top: 10px; color: var(--text-2); font-size: var(--fs-14); max-width: 68ch; }
.page-lede b { color: var(--text); font-weight: 700; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sec-title { font-size: var(--fs-22); font-weight: 500; letter-spacing: -0.015em; line-height: 1.2; }
.sec-title-sm { font-size: var(--fs-16); font-weight: 700; letter-spacing: -0.005em; }
.section { padding: 24px 0; border-top: 1px solid var(--line); }
.section:first-child { border-top: 0; padding-top: 0; }
.section:last-child { padding-bottom: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.prose { max-width: 64ch; color: var(--text-2); }

.card { background: var(--surface); border-radius: var(--r-card); padding: 28px; min-width: 0; }
.card + .card { margin-top: 20px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-title { font-size: var(--fs-22); font-weight: 500; letter-spacing: -0.015em; line-height: 1.2; }

/* ---------- Eingang ---------- */
.upcoming { padding: 22px 28px 12px; margin-bottom: 28px; }
.up-list { list-style: none; margin: 0; padding: 0; }
.up-row { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; }
.up-list li:first-child .up-row { border-top: 0; }
.up-row:hover .up-what { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-control); }
.up-what { display: block; font-weight: 700; }
.up-sub { display: block; font-size: var(--fs-12); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-when { font-size: var(--fs-13); font-weight: 700; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.up-when.warn { color: var(--warn-text); }

.inbox-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.triage { display: grid; grid-template-columns: minmax(0,1fr); gap: 24px; align-items: start; }
.triage.split { grid-template-columns: 420px minmax(0,1fr); }
.tlist { padding: 6px 0; overflow: hidden; }
.tlist ul { list-style: none; margin: 0; padding: 0; }
.trow { position: relative; display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 4px 14px; padding: 16px 24px; border-top: 1px solid var(--line); cursor: pointer; }
.tlist li:first-child .trow, .tlist li:first-child.trow { border-top: 0; }
.trow:hover { background: color-mix(in srgb, var(--sunken) 60%, transparent); }
.trow[aria-current="true"] { background: var(--sunken); }
.trow[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--ink); }
.trow .mono { width: 40px; height: 40px; border-radius: 12px; }
.trow[aria-current="true"] .mono { background: var(--surface); }
.trow-main { min-width: 0; }
.trow-title { font-weight: 700; font-size: var(--fs-16); line-height: 1.3; letter-spacing: -0.005em; text-decoration: none; color: var(--text); }
.trow-title:hover { text-decoration: underline; text-decoration-color: var(--line-control); }
.trow-meta { display: block; margin-top: 3px; font-size: var(--fs-13); color: var(--text-2); }
.trow-why { display: block; margin-top: 6px; font-size: var(--fs-13); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.trow-flag { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: var(--fs-13); font-weight: 700; color: var(--danger); }
.trow-flag .ico { width: 15px; height: 15px; }
.trow-acts { grid-column: 2 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.trow-score { align-self: start; }
.list-note { font-size: var(--fs-13); color: var(--text-2); margin: 0 0 14px; }

.preview { position: sticky; top: 24px; max-height: calc(100vh - 48px); overflow-y: auto; padding: 0; display: flex; flex-direction: column; }
.drawer .preview { position: static; max-height: none; overflow: visible; background: transparent; }
.pv-body { padding: 28px 28px 8px; }
.pv-head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: start; }
.pv-title { font-weight: 400; font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; }
.pv-actions { position: sticky; bottom: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 16px 28px 20px; background: var(--surface); border-top: 1px solid var(--line); margin-top: auto; }
.drawer .pv-actions { background: var(--bg); }
.pv-actions .spacer { flex: 1; }
.pv-section { margin-top: 24px; }

.empty { padding: 40px 28px; }
.empty h2 { font-size: var(--fs-22); font-weight: 500; letter-spacing: -0.015em; margin-bottom: 6px; }
.empty p { color: var(--text-2); max-width: 52ch; }
.empty .row { margin-top: 18px; }

/* Threshold: one tick per open hit at its score; the ink line splits "Neu" from "Unter Schwellwert". */
.thr-card { margin-bottom: 20px; }
.threshold { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap: 36px; align-items: start; }
.dist { position: relative; height: 64px; margin: 34px 0 6px; border-bottom: 1px solid var(--line-strong); }
.dist i { position: absolute; bottom: 0; width: 2px; height: 44px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.dist i.below { background: var(--line-control); height: 26px; }
.dist i.kept { background: var(--ink); height: 44px; }
.dist .thr-line { position: absolute; bottom: -6px; top: -24px; width: 2px; margin-left: -1px; background: var(--ink); }
.dist .thr-pill { position: absolute; top: -34px; transform: translateX(-50%); height: 24px; padding: 0 10px; border-radius: var(--r-pill); background: var(--ink); color: var(--on-ink); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.thr-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }
.thr-control { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.thr-control input[type="range"] { flex: 1 1 160px; accent-color: var(--ink); min-width: 0; }
.thr-control .input { width: 80px; text-align: right; font-variant-numeric: tabular-nums; }
.dist-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: var(--fs-12); color: var(--text-2); margin-top: 12px; }
.dist-legend span { display: inline-flex; gap: 6px; align-items: center; }
.dist-legend i { width: 2px; height: 12px; background: var(--ink); display: inline-block; }
.dist-legend i.below { background: var(--line-control); }

.ob-list { list-style: none; margin: 0; padding: 0; }
.ob-item { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 16px; padding: 20px 0; border-top: 1px solid var(--line); align-items: center; }
.ob-item:first-child { border-top: 0; padding-top: 0; }
.ob-item:last-child { padding-bottom: 0; }
.ob-num { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line-control); display: grid; place-items: center; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ob-item.done .ob-num { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.ob-item.done .ob-title { color: var(--text-2); }
.ob-title { font-weight: 700; font-size: var(--fs-16); }
.ob-text { color: var(--text-2); font-size: var(--fs-13); margin-top: 3px; max-width: 56ch; }
.ob-progress { display: flex; align-items: center; gap: 16px; margin-top: 18px; max-width: 360px; }
.ob-progress .progress { flex: 1; }

/* ---------- job page ---------- */
.jd { container: jd / inline-size; padding: 32px var(--pane-pad) 72px; max-width: calc(1200px + 2 * var(--pane-pad)); margin: 0 auto; }
.drawer .jd { padding: 22px 28px 48px; }
.jd-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); color: var(--text-3); font-weight: 600; min-width: 0; }
.crumbs a { color: var(--text-2); text-decoration: none; }
.crumbs a:hover { color: var(--text); text-decoration: underline; }
.crumbs .ico { width: 14px; height: 14px; }
.crumbs span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jd-layout { display: grid; grid-template-columns: minmax(0,1fr); grid-template-areas: "head" "next" "tabs" "panel"; gap: 20px; }
@container jd (min-width: 880px) {
  .jd-layout { grid-template-columns: minmax(0,1fr) 360px; grid-template-rows: auto auto 1fr; grid-template-areas: "head head" "tabs next" "panel next"; column-gap: 24px; }
  .jd-side { position: sticky; top: 24px; }
}
.jd-headcard { grid-area: head; }
.jd-side { grid-area: next; align-self: start; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.jd-tabs { grid-area: tabs; min-width: 0; }
.tabpanel { grid-area: panel; min-width: 0; }
.jd-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 20px; align-items: start; }
.jd-title { font-weight: 400; font-size: 34px; line-height: 1.12; letter-spacing: -0.025em; max-width: 30ch; }
.jd-meta { margin-top: 10px; color: var(--text-2); font-size: var(--fs-13); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.jd-meta > * + * { padding-left: 12px; border-left: 1px solid var(--line-strong); }
.jd-scorebox { text-align: right; }
.jd-score { font-size: var(--fs-num); font-weight: 400; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums lining-nums; }
.jd-score small { font-size: var(--fs-13); color: var(--text-3); letter-spacing: 0; font-weight: 600; margin-left: 2px; }
.jd-band { margin-top: 8px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: var(--fs-13); font-weight: 700; }
/* From Beworben onwards the score has done its job; it steps back. */
.jd-scorebox.secondary .jd-score { font-size: 26px; color: var(--text-2); }
.jd-scorebox.secondary .ticks i.on { background: var(--text-2); }
.jd-scorebox.secondary .jd-band { color: var(--text-2); }
.jd-status { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.jd-status .stepper { flex: 1 1 auto; }
.jd-status-note { font-size: var(--fs-13); color: var(--text-2); }

/* Read-only stepper: shows where the application stands. Changing it goes through "Phase ändern". */
.stepper { position: relative; list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.stepper li { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: var(--r-pill); color: var(--text-3); font-weight: 600; font-size: var(--fs-13); white-space: nowrap; }
.stepper .node { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-control); flex: none; }
.stepper .node .ico { width: 12px; height: 12px; stroke-width: 2.4; }
.step-date { font-variant-numeric: tabular-nums; font-weight: 500; }
.stepper li.past { color: var(--text-2); }
.stepper li.past .node { background: var(--sunken); box-shadow: none; color: var(--text); }
.stepper li.current { background: var(--ink); color: var(--on-ink); }
.stepper li.current .node { box-shadow: inset 0 0 0 5px var(--on-ink); }
.stepper li.current .step-date { opacity: .8; }
.stepper li.skipped .node { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.phase-menu .pop-item .stage { font-weight: inherit; }

.confirm { margin-top: 14px; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 12px 14px 12px 18px; border-radius: var(--r-inner); background: var(--sunken); font-size: var(--fs-13); }
.confirm.warn { background: var(--warn-soft); }
.confirm.warn > .ico { color: var(--warn-text); }
.confirm p { flex: 1 1 240px; }

/* The one orange surface per job: what to do next, with every control it needs. */
.next { background: var(--accent); color: var(--on-accent); border-radius: var(--r-card); padding: 26px; }
.next.closed { background: var(--surface); color: var(--text); }
.next-kicker { display: flex; align-items: center; gap: 8px; font-size: var(--fs-13); font-weight: 700; }
.next-title { font-size: 26px; font-weight: 500; line-height: 1.15; letter-spacing: -0.02em; margin-top: 10px; }
.next-text { margin-top: 10px; font-size: var(--fs-14); line-height: 1.5; max-width: 52ch; }
.next > .row { margin-top: 20px; }
.next .btn { border-color: #14171d; background: #ffffff; color: #14171d; }
.next .btn:hover { background: #f3f3f3; }
.next .btn-primary { background: #14171d; border-color: #14171d; color: #fff; }
.next > .row .btn-primary { height: 46px; padding: 0 22px; }
.next .btn-primary:hover { background: #2a2f3a; }
.next .btn-ghost { background: transparent; border-color: transparent; color: #14171d; text-decoration: underline; text-underline-offset: 3px; padding: 0 6px; }
.next .btn-ghost:hover { background: rgba(20,23,29,.08); }
.next .input { background: #fff; color: #14171d; border-color: #14171d; }
.next :focus-visible { outline-color: #14171d; }
.next.closed .btn { border-color: var(--line-control); background: var(--surface); color: var(--text); }
.next.closed :focus-visible { outline-color: var(--focus); }
.next-sub { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(20,23,29,.22); }
.next-sub h4 { font-size: var(--fs-14); font-weight: 700; }
.next .inline-warn { background: rgba(255,255,255,.55); }
.inline-warn { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-13); color: var(--text); padding: 12px 14px; border-radius: var(--r-inner); background: var(--warn-soft); margin-top: 12px; }
.inline-warn > .ico { color: var(--warn-text); margin-top: 1px; }
.next .inline-warn > .ico { color: #14171d; }
/* Dark: full orange glares at night, so the card turns into a tinted surface with an orange marker and button. */
:root[data-mode="dark"] .next:not(.closed) { background: var(--accent-soft); color: var(--text); box-shadow: inset 4px 0 0 var(--accent); }
:root[data-mode="dark"] .next:not(.closed) .btn { background: var(--surface); color: var(--text); border-color: var(--line-control); }
:root[data-mode="dark"] .next:not(.closed) .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
:root[data-mode="dark"] .next:not(.closed) .btn-ghost { background: transparent; border-color: transparent; color: var(--text); }
:root[data-mode="dark"] .next:not(.closed) .btn-ghost:hover { background: rgba(255,255,255,.06); }
:root[data-mode="dark"] .next:not(.closed) .input { background: var(--surface); color: var(--text); border-color: var(--line-control); }
:root[data-mode="dark"] .next:not(.closed) :focus-visible { outline-color: var(--focus); }
:root[data-mode="dark"] .next-sub { border-top-color: var(--line-strong); }
:root[data-mode="dark"] .next .inline-warn { background: var(--warn-soft); }
:root[data-mode="dark"] .next .inline-warn > .ico { color: var(--warn-text); }
:root[data-mode="dark"] .next .cl-num { box-shadow: inset 0 0 0 1.5px var(--line-control); color: var(--text); }
:root[data-mode="dark"] .next .cl-item.done .cl-num { background: var(--ink); color: var(--on-ink); }
:root[data-mode="dark"] .next .cl-item { border-top-color: var(--line-strong); }
:root[data-mode="dark"] .next-kicker { color: var(--text); }

.checklist { list-style: none; margin: 10px 0 0; padding: 0; }
.cl-item { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px solid rgba(20,23,29,.22); align-items: start; }
.cl-item:first-child { border-top: 0; }
.cl-num { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #14171d; display: grid; place-items: center; font-size: var(--fs-13); font-weight: 700; font-variant-numeric: tabular-nums; }
.cl-num .ico { width: 15px; height: 15px; stroke-width: 2.2; }
.cl-item.done .cl-num { background: #14171d; color: #fff; box-shadow: none; }
.cl-title { font-weight: 700; padding-top: 3px; }
.cl-body .row { margin-top: 8px; }
.flash { animation: flash 900ms var(--ease); }
@keyframes flash { 30% { transform: scale(1.012); } }

.facts { padding: 22px 24px; }
.facts .kv { grid-template-columns: 120px minmax(0,1fr); gap: 0 16px; }
.facts .kv dt, .facts .kv dd { padding: 10px 0; }

.tabs { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-pill); background: var(--surface); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.tab { height: 38px; padding: 0 18px; border: 0; background: none; border-radius: var(--r-pill); color: var(--text-2); font-weight: 600; font-size: var(--fs-13); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; flex: none; }
.tab:hover { color: var(--text); background: var(--sunken); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.tab.dim { color: var(--text-3); }
.tab .ico { width: 14px; height: 14px; stroke-width: 2.2; }
.dim-panel h3 { font-size: var(--fs-18); font-weight: 700; margin-bottom: 6px; }
.dim-panel p { color: var(--text-2); max-width: 56ch; }
.dim-panel .row { margin-top: 16px; }

.fit-summary { font-size: var(--fs-18); line-height: 1.45; max-width: 60ch; font-weight: 500; letter-spacing: -0.005em; }
.fit-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 32px; margin-top: 24px; }
.preview .fit-grid, .drawer .fit-grid { gap: 24px; }
.fit-list { list-style: none; margin: 10px 0 0; padding: 0; }
.fit-list li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); }
.fit-list li:first-child { border-top: 0; }
.fit-list .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-control); }
.fit-list .mk .ico { width: 13px; height: 13px; stroke-width: 2.2; }
.fit-ok .mk { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.fit-req { font-weight: 700; color: var(--text); display: block; }
.fit-fact { color: var(--text-2); display: block; margin-top: 2px; }
.dealbreaker { display: inline-flex; margin-top: 6px; }
.provenance { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; font-size: var(--fs-legal); color: var(--text-3); }
.rationale { margin-top: 20px; }
.rationale-body { margin-top: 10px; color: var(--text-2); max-width: 66ch; font-size: var(--fs-13); }
.rationale-body p + p { margin-top: 8px; }
.disclosure { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--text); font-weight: 700; font-size: var(--fs-13); }
.disclosure .ico { transition: transform var(--t-fast) var(--ease); width: 16px; height: 16px; }
.disclosure[aria-expanded="true"] .ico { transform: rotate(90deg); }
/* Inline forms inside a card are set off by an indent rule, never by a second box. */
.feedback, .chan-form { margin-top: 18px; padding: 4px 0 4px 18px; border-left: 2px solid var(--line-strong); }

.kv { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 0 24px; margin: 0; }
.kv dt, .kv dd { padding: 14px 0; border-top: 1px solid var(--line); margin: 0; font-size: var(--fs-13); }
.kv dt { color: var(--text-3); font-weight: 600; }
.kv dt:first-of-type, .kv dt:first-of-type + dd { border-top: 0; padding-top: 0; }
.ai-stamp { font-size: var(--fs-legal); color: var(--text-3); margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps-mini { list-style: none; padding: 0; margin: 14px 0 0; }
.steps-mini li { display: flex; gap: 10px; align-items: center; padding: 7px 0; font-size: var(--fs-13); color: var(--text-3); }
.steps-mini li.done { color: var(--text-2); }
.steps-mini li.now { color: var(--text); font-weight: 700; }
.steps-mini .dot { width: 18px; height: 18px; display: grid; place-items: center; }
.steps-mini .dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-control); }

/* Bewerbungsmappe: document rows in a card, the A4 page lies directly on the grey pane. */
.mappe { display: grid; grid-template-columns: minmax(0,1fr); gap: 24px; }
@container jd (min-width: 760px) { .mappe { grid-template-columns: minmax(0,1fr) minmax(260px, 340px); align-items: start; } }
.mappe-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.docrow { padding: 18px 0; border-top: 1px solid var(--line); }
.docrow:last-of-type { padding-bottom: 4px; }
.docrow-top { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; }
.docrow-name { font-weight: 700; font-size: var(--fs-16); }
.docrow-state { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.docrow .progress { margin: 12px 0 0; }
.docrow-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 0; }
.docrow-instr { margin: 12px 0 0; display: grid; gap: 8px; }
.docrow .select select { height: var(--ctl-h-sm); font-size: var(--fs-13); }
.preview-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
.desk { display: flex; justify-content: center; }

/* The one editorial surface: a printed A4 page. Stays light in dark mode, like paper on a desk. */
.paper {
  width: 100%; max-width: 400px; aspect-ratio: 210 / 297; background: var(--paper); color: var(--paper-ink); border-radius: 4px;
  box-shadow: 0 1px 2px rgba(20,23,29,.06), 0 18px 40px -16px rgba(20,23,29,.28); container-type: inline-size; overflow: hidden;
  font-family: var(--font-serif); font-weight: 400; position: relative;
}
.paper-in { padding: 9cqw 9.5cqw; font-size: 2.3cqw; line-height: 1.42; height: 100%; }
.paper .paper-in[contenteditable="true"] { outline: 2px dashed var(--paper-ink); outline-offset: -6px; }
.pp-name { font-size: 5.6cqw; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.pp-role { font-size: 2.6cqw; color: var(--paper-muted); margin-top: 0.8cqw; font-style: italic; }
.pp-contact { font-size: 2cqw; color: var(--paper-muted); margin-top: 1.6cqw; font-family: var(--font-ui); font-weight: 500; }
.pp-h { font-size: 2.5cqw; font-weight: 600; margin: 4.2cqw 0 1.4cqw; padding-bottom: 0.8cqw; border-bottom: 0.25cqw solid var(--paper-rule); }
.pp-item { margin-bottom: 1.8cqw; }
.pp-item b { font-weight: 600; }
.pp-item .pp-when { float: right; color: var(--paper-muted); font-family: var(--font-ui); font-size: 1.9cqw; font-weight: 500; }
.pp-p { margin: 0 0 1.8cqw; }
.pp-small { font-size: 1.9cqw; color: var(--paper-muted); font-family: var(--font-ui); font-weight: 500; }
.pp-skills { font-size: 2.1cqw; }
.pp-two { display: grid; grid-template-columns: 30% 1fr; gap: 5cqw; }
.pp-side { border-right: 0.25cqw solid var(--paper-rule); padding-right: 4cqw; }
.pp-letter-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 7cqw; }
.pp-subject { font-weight: 600; margin: 6cqw 0 4cqw; }
.pp-blank { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12cqw; font-family: var(--font-ui); }
.pp-blank p { font-size: 3.4cqw; color: var(--paper-muted); font-weight: 600; }
.pp-lines { position: absolute; inset: 9cqw 9.5cqw; display: flex; flex-direction: column; gap: 2.4cqw; opacity: .6; }
.pp-lines i { display: block; height: 1.6cqw; background: var(--paper-rule); border-radius: 1px; }
.paper.generating .pp-lines i { animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .35; } }
.edit-bar { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; font-size: var(--fs-12); color: var(--text-2); flex-wrap: wrap; text-align: center; }
.bigprev { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 40px; }
.bigprev-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 794px; margin: 0 auto 16px; }
.bigprev .paper { max-width: 794px; margin: 0 auto; }

.prep-sec + .prep-sec { margin-top: 28px; }
.prep-list { margin: 10px 0 0; padding: 0; list-style: none; }
.prep-list li { padding: 12px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); }
.prep-list li:first-child { border-top: 0; }
.prep-q { font-weight: 700; font-size: var(--fs-14); }
.prep-a { color: var(--text-2); margin-top: 3px; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 96px 16px minmax(0,1fr); gap: 12px; position: relative; padding-bottom: 18px; font-size: var(--fs-13); }
.tl-date { color: var(--text-3); text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-12); padding-top: 1px; }
.tl-dot { position: relative; display: flex; justify-content: center; }
.tl-dot i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--line-control)); margin-top: 4px; position: relative; z-index: 1; }
.timeline li:not(:last-child) .tl-dot::after { content: ""; position: absolute; top: 16px; bottom: -18px; width: 1.5px; background: var(--line); }
.tl-sub { color: var(--text-2); font-size: var(--fs-12); }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; align-items: start; }
.two-col > .card + .card { margin-top: 0; }

/* ---------- tables (settings, certificates) ---------- */
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-14); }
.table th { text-align: left; font-size: var(--fs-12); font-weight: 600; color: var(--text-3); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 16px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table th:first-child, .table td:first-child { padding-left: 0; }
.table th:last-child, .table td:last-child { padding-right: 0; }
.table .r { text-align: right; }
.t-title { font-weight: 700; color: var(--text); line-height: 1.3; }
.t-sub { font-size: var(--fs-12); color: var(--text-2); margin-top: 2px; }

/* ---------- Bewerbungen ---------- */
.search-field { position: relative; width: 280px; max-width: 100%; }
.search-field .input { padding-left: 40px; }
.search-field > .ico { position: absolute; left: 13px; top: 11px; color: var(--text-2); pointer-events: none; }
/* Funnel in the reference's tick style: one tick per application. It is the only phase filter. */
.funnel { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
.fcol { display: flex; flex-direction: column; padding: 2px 0 2px 14px; border: 0; border-left: 2px solid var(--c); background: none; text-align: left; cursor: pointer; color: var(--text); border-radius: 0; min-width: 0; }
.fcol-label { font-size: var(--fs-13); color: var(--text-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcol-num { font-size: 40px; font-weight: 400; line-height: 1.05; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums lining-nums; }
.fcol-ticks { display: flex; gap: 6px; height: 30px; margin-top: 10px; align-items: flex-end; }
.fcol-ticks i { width: 2px; height: 100%; border-radius: 1px; background: var(--c); }
.fcol-ticks.none { border-bottom: 1px dashed var(--line-control); height: 30px; width: 40px; }
.fcol.dim .fcol-ticks { opacity: .3; }
.fcol.dim .fcol-num { color: var(--text-3); }
.fcol[aria-pressed="true"] .fcol-label { color: var(--text); font-weight: 700; }
.fcol[aria-pressed="true"] { border-left-width: 4px; padding-left: 12px; }
.fcol:hover .fcol-label { color: var(--text); }
.filter-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; font-size: var(--fs-13); color: var(--text-2); }
.plist { padding: 8px 28px; }
.phase-sec { padding: 20px 0 8px; border-top: 1px solid var(--line); }
.phase-sec:first-child { border-top: 0; }
.phase-head { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; row-gap: 2px; margin-bottom: 6px; }
.phase-title { display: inline-flex; align-items: center; gap: 10px; font-size: var(--fs-18); font-weight: 700; letter-spacing: -0.01em; }
.phase-title::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.phase-hint { font-size: var(--fs-13); color: var(--text-2); flex-basis: 100%; }
.prows { list-style: none; margin: 6px 0 0; padding: 0; }
.prow { display: grid; grid-template-columns: minmax(0,2.4fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr); gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); cursor: pointer; }
.prows li:first-child .prow, .prows li:first-child.prow { border-top: 0; }
.prow:hover .t-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-control); }
.t-job { display: flex; align-items: center; gap: 14px; min-width: 0; }
.t-job .t-title { text-decoration: none; }
.t-job a.t-title:hover { text-decoration: underline; }
.next-cell { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: var(--fs-13); }
.next-cell.warn { color: var(--warn-text); }
.next-cell .ico { width: 16px; height: 16px; }
.cell-sub { font-size: var(--fs-13); color: var(--text-2); }
.cell-sub.warn { color: var(--warn-text); font-weight: 700; }
.closed-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--text); }
.closed-head .ico { transition: transform var(--t-fast) var(--ease); }
.closed-head[aria-expanded="true"] .ico { transform: rotate(180deg); }

/* ---------- Quellen ---------- */
.src-banner { margin-bottom: 20px; }
.src-list { padding: 8px 28px; }
.srow { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.8fr) auto 44px; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); }
.src-list > .srow:first-of-type { border-top: 0; }
.srow-head { font-size: var(--fs-12); color: var(--text-3); font-weight: 600; padding: 12px 0 8px; border-top: 0; }
.src-name { font-weight: 700; font-size: var(--fs-16); }
.src-host { font-family: var(--font-code); font-size: 13px; color: var(--text-2); margin-top: 2px; overflow-wrap: anywhere; }
.src-cell { font-size: var(--fs-13); color: var(--text-2); }
.src-cell b { color: var(--text); font-weight: 700; }
.src-cell .err { color: var(--danger); font-weight: 700; }
.crawl-live .progress { margin-top: 8px; max-width: 220px; }
.src-note { margin-top: 16px; font-size: var(--fs-13); color: var(--text-2); }

/* ---------- drawers / dialogs ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; }
.drawer {
  position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(var(--drawer-w, 940px), calc(100vw - 24px)); background: var(--bg);
  border-radius: var(--r-card); box-shadow: var(--shadow-float); z-index: 51; overflow-y: auto; overscroll-behavior: contain;
}
.drawer.narrow { --drawer-w: 540px; background: var(--surface); }
.drawer.preview-drawer { --drawer-w: 640px; background: var(--surface); display: flex; flex-direction: column; }
.panel-in { padding: 28px 30px 40px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px; }
.panel-title { font-size: 28px; font-weight: 400; letter-spacing: -0.025em; line-height: 1.15; }
/* Wizard progress is text, not buttons: number, label, and a bar under the current step. */
.wizard-steps { list-style: none; padding: 0; margin: 0 0 26px; display: flex; gap: 20px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.wizard-steps li { display: inline-flex; align-items: center; gap: 6px; padding: 0 0 10px; font-size: var(--fs-13); font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.wizard-steps li .ico { width: 14px; height: 14px; stroke-width: 2.4; }
.wizard-steps li.done { color: var(--text-2); }
.wizard-steps li.now { color: var(--text); font-weight: 700; border-bottom-color: var(--ink); }
.link-list { list-style: none; padding: 0; margin: 12px 0 0; max-height: 300px; overflow: auto; }
.link-list li { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: var(--fs-13); align-items: flex-start; }
.link-list li:first-child { border-top: 0; }
.link-list input { accent-color: var(--ink); width: 16px; height: 16px; margin-top: 2px; }
.link-list .code { color: var(--text-2); display: block; font-size: 12.5px; word-break: break-all; }
.panel-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet { top: auto; left: 12px; right: 12px; bottom: 12px; width: auto; max-height: 85vh; }
.palette { position: fixed; z-index: 61; top: 10vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); max-height: 76vh; overflow-y: auto; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-float); padding: 14px; }
.palette .search-field { width: 100%; }
.palette .input { height: 48px; font-size: var(--fs-16); }
.palette .search-field > .ico { top: 15px; }

'use strict';
/* ===================== time & format helpers ===================== */

const now = () => new Date(TODAY.getTime() + (Date.now() - BOOT));

const pad = (n) => String(n).padStart(2, '0');
const fmtD = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;

  if (j.status === 'APPLIED' || CLOSED_STATUSES.includes(j.status)) return 'verlauf';

}

  if (key === 'interview' && (idx < 3 || (idx === 5 && !j.prep))) return 'Interview-Vorbereitung ab Phase Interview';
  return null;
}

const SCORE_TICKS = 20;
function scoreTicks(score) {

/* Monogram from the company name: two initials, or the first two letters of a one-word name. */

  return w[0].toUpperCase() + (w[1] || '').toLowerCase();
}

function fitItem(f, kind) {

/* Read-only: shows where the application stands. Changes go through "Phase ändern", which applies every guard. */
function renderStepper(j) {
  const cur = stageIndex(j.status);
  const items = STAGES.slice(1).map((st, k) => {
    const i = k + 1;
    const date = i === 5 ? (cur === 5 ? lastStatusDate(j, j.status) : null) : lastStatusDate(j, st.key);
    const skipped = i < cur && !date;
    const cls = i < cur ? `past${skipped ? ' skipped' : ''}` : i === cur ? 'current' : 'future';
    const label = i === 5 && cur === 5 ? statusLabel(j.status) : st.label;
    const dateText = i < cur && date ? fmtD(date) : i === cur && date ? `seit ${fmtD(date)}` : skipped && cur < 5 ? 'übersprungen' : '';
    const sr = i < cur ? (skipped ? ', übersprungen' : ', erledigt') : i === cur ? ', aktuelle Phase' : ', noch nicht erreicht';
    return `<li class="${cls}" ${i === cur ? 'aria-current="step"' : ''}><span class="node" aria-hidden="true">${i < cur && !skipped ? icon('check') : ''}</span><span>${esc(label)}</span>${dateText ? `<span class="step-date">${dateText}</span>` : ''}<span class="sr-only">${sr}</span></li>`;
  }).join('');
  return `<ol class="stepper" aria-label="Phasen der Bewerbung">${items}</ol>`;
}
function renderPhaseMenu(j) {
  const cur = stageIndex(j.status);
  const pop = `phase-${j.id}`;
  const open = ui.popover === pop;
  const items = STAGES.map((st, i) => ({ i, st, label: i === 0 ? 'Zurück in den Eingang' : st.label })).filter((x) => x.i > 0 || cur === 1);
  const menu = open ? `<div class="popover down-right phase-menu anim-pop" role="menu" aria-label="Phase ändern"><div class="pop-label">Phase setzen auf</div>
    ${items.map((x) => `<button type="button" role="menuitem" class="pop-item" data-act="phasePick" data-id="${j.id}" data-idx="${x.i}" ${x.i === cur ? 'disabled aria-current="true"' : ''}><span class="stage" style="--c:${x.st.color}">${esc(x.label)}</span>${x.i === cur ? `<span class="end">${icon('check')}<span class="sr-only">, aktuell</span></span>` : ''}</button>`).join('')}</div>` : '';
  return `<div class="pop-anchor"><button type="button" class="btn btn-sm phase-btn" data-act="togglePop" data-pop="${pop}" data-popover-trigger aria-haspopup="menu" aria-expanded="${open}"><span>Phase ändern</span>${icon('chevD')}</button>${menu}</div>`;
}
function renderConfirm(j) {
  const c = ui.confirm;
  if (!c || c.id !== j.id) return '';
  const d = `data-id="${j.id}"`;
  if (c.kind === 'back') {
    const target = c.idx === 0 ? 'in den Eingang' : `auf <b>${STAGES[c.idx].label}</b>`;
    return `<div class="confirm anim-pop" role="alert"><p>Zurück ${target} setzen? Spätere Einträge bleiben im Verlauf erhalten.</p>
      <div class="row">${btn('Zurücksetzen', 'confirmStage', { cls: 'btn-sm btn-primary', data: d })}${btn('Abbrechen', 'cancelConfirm', { cls: 'btn-sm btn-ghost' })}</div></div>`;

  }
  if (c.kind === 'forward') {

}
/* The orange card holds the next step and every control it needs; dates go into a small card below. */

/* ===================== Unterlagen = Bewerbungsmappe ===================== */
function docStateText(d) {
  if (d.state === 'queued') return { cls: 'run', text: 'In Warteschlange' };
  if (d.state === 'running') return { cls: 'run', text: `Wird erstellt, Schritt ${d.step}/3: ${GEN_STEPS[d.step - 1]}` };
  if (d.state === 'ready') return { cls: 'ready', text: `Fertig · v${d.version}${d.edited ? ' · bearbeitet' : ''} · ${fmtDT(d.updated)}` };
  return { cls: '', text: 'Nicht erstellt' };
}
function tabDocs(j) {
  const anyRunning = docsState(j) === 'running';
  const allReady = docsState(j) === 'ready';
  return `<div class="mappe">
    <div class="card">
      <div class="mappe-head"><h3 class="card-title">Bewerbungsmappe</h3>
        ${btn(allReady ? 'Beide neu erstellen' : 'Beide erstellen', 'genBoth', { cls: 'btn-sm', ico: allReady ? 'refresh' : 'file', data: `data-id="${j.id}"`, attrs: anyRunning ? 'disabled' : '' })}</div>
      <p class="prose small" style="margin:8px 0 14px">Beide Dokumente werden aus deinem Profil${j.research ? ', der Firmenrecherche' : ''} und der Stellenanzeige geschrieben und mit der gewählten Vorlage als PDF gesetzt.${!j.research ? ' Ohne Firmenrecherche wird das Anschreiben allgemeiner.' : ''}</p>
      ${['cv', 'letter'].map((k) => renderDocRow(j, k)).join('')}
      <p class="small faint" style="margin-top:16px">Anhänge aus Profil › Nachweise: ${S.certs.filter((c) => c.attach).map((c) => esc(c.name)).join(', ') || 'keine'}.</p>
    </div>
    <div>${renderPreview(j)}</div>
  </div>`;
}
function renderDocRow(j, k) {
  const d = j.docs[k];
  const st = docStateText(d);

  if (d.state === 'ready') {
    actions = `${btn('Neu erstellen …', 'toggleInstr', { cls: 'btn-sm', ico: 'refresh', data: `data-id="${j.id}" data-doc="${k}"` })}${btn('Bearbeiten', 'editDoc', { cls: 'btn-sm', ico: 'pencil', data: `data-id="${j.id}" data-doc="${k}"` })}${btn('PDF', 'downloadDoc', { cls: 'btn-sm btn-ghost', ico: 'download', data: `data-id="${j.id}" data-doc="${k}"`, attrs: `aria-label="${DOC_LABEL[k]} als PDF herunterladen"` })}`;

  const progress = busy ? `<div class="progress" role="progressbar" aria-label="${DOC_LABEL[k]} wird erstellt" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${d.step}"><i style="width:${d.state === 'queued' ? 4 : (d.step / 3) * 100 - 10}%"></i></div>` : '';
  return `<div class="docrow">

        <div class="docrow-state ${st.cls}" aria-live="polite">${busy ? spinner() + ' ' : ''}${st.text}</div></div>

function renderPreview(j) {

/* Due = something to do within two days: overdue follow-up, interview or offer deadline today, tomorrow or the day after. */
function isDue(j) {
  if (followUpDue(j)) return true;
  const soon = (d) => d && daysBetween(now(), d) >= 0 && daysBetween(now(), d) <= 2;
  return (j.status === 'INTERVIEW' && soon(j.interviewDate)) || (j.status === 'OFFER' && soon(j.offerDeadline));
}
const dueJobs = () => activeJobs().filter(isDue);
function navBadge(key) {
  let inner = '';
  if (key === 'eingang') { const n = inboxCount(); if (n) inner = `<span class="count-badge" aria-label="${n} neue Treffer">${n}</span>`; }
  if (key === 'bewerbungen') {
    const due = dueJobs().length;
    inner = `<span class="count-plain" aria-label="${activeJobs().length} aktiv">${activeJobs().length}</span>${due ? `<span class="count-badge due" aria-label="${due} fällig" title="${due} fällig">${due}</span>` : ''}`;
  }
  if (key === 'quellen') { const n = S.sources.filter((s) => s.status === 'error').length; if (n) inner = `<span class="count-badge err" aria-label="${n} Quelle mit Fehler" title="${n} Quelle mit Fehler">${n}</span>`; }
  return inner ? `<span class="nav-end">${inner}</span>` : '';
}
function activePage(r) { return r.page === 'job' ? (jobById(r.sub)?.status === 'OPEN' ? 'eingang' : 'bewerbungen') : r.page; }
const unseenDone = () => Math.max(0, S.done.length - ui.doneSeen);
function activityLabel() {

/* ===================== Eingang ===================== */
const INBOX_TABS = [{ key: 'neu', label: 'Neu', filter: 'new' }, { key: 'unter', label: 'Unter Schwellwert', filter: 'below' }, { key: 'aus', label: 'Von dir aussortiert', filter: 'dismissed' }];

  return f === 'new' ? list.sort((a, b) => b.score - a.score) : f === 'below' ? list.sort((a, b) => b.score - a.score) : list.sort((a, b) => b.posted - a.posted);
}
/* Urgent first (overdue follow-up), then dated events, then preparation work. Waiting is not "anstehend". */
function upPriority(j) {
  if (nextStep(j).tone === 'warn') return 0;
  if (j.status === 'INTERVIEW') return 1 + daysBetween(now(), j.interviewDate) / 100;
  if (j.status === 'OFFER') return 1 + daysBetween(now(), j.offerDeadline) / 100;
  return j.status === 'DRAFTED' ? 3 : 4;
}
function nextStepJobs() {
  return activeJobs().sort((a, b) => upPriority(a) - upPriority(b) || currentSince(a) - currentSince(b));
}
const UP_LIMIT = 3;
function renderUpcoming() {
  const jobs = nextStepJobs().filter((j) => upPriority(j) < 4);

    const ns = nextStep(j); const due = dueCell(j);
    return `<li><a class="up-row" href="#/job/${j.id}">${mono(j.company, 'mono-sm')}<span style="min-width:0"><span class="up-what">${esc(ns.short.split(' · ')[0])}</span><span class="up-sub">${esc(j.company)}, ${esc(j.title)}</span></span><span class="up-when ${due.tone}">${due.text}</span></a></li>`;
  }).join('');
  const more = jobs.length - UP_LIMIT;
  return `<section class="card upcoming" aria-labelledby="up-h"><h2 class="sec-title-sm" id="up-h" style="margin-bottom:4px">Anstehend in deinen Bewerbungen</h2><ul class="up-list">${rows}</ul>
    ${more > 0 ? `<p class="small" style="padding:4px 0 10px"><a href="#/bewerbungen">${more} weitere in Bewerbungen</a></p>` : ''}</section>`;
}
function inboxLede(n) {

  return `${n ? `<b>${n} neue Treffer</b> warten auf deine Entscheidung.` : '<b>Alles gesichtet.</b>'} ${run} ${esc(nextRunText())}`;
}
const needsSetup = () => ui.firstRun && !ui.onboard.run;

/* Threshold lives where its effect is visible. Moving the slider only previews; "Übernehmen" applies. */
function thresholdPlan(v) {
  const movable = S.jobs.filter((j) => j.status === 'OPEN' && j.inbox !== 'dismissed' && !j.restored);
  return {
    toBelow: movable.filter((j) => j.inbox === 'new' && j.score < v),
    toNew: movable.filter((j) => j.inbox === 'below' && j.score >= v),
    keptRestored: S.jobs.filter((j) => j.status === 'OPEN' && j.inbox === 'new' && j.restored && j.score < v).length,

}

      <div><div class="dist" id="thr-dist" aria-hidden="true">${renderDist(v)}</div>

          <label class="sr-only" for="thr">Schwellwert, Zahl</label><input class="input" id="thr" type="number" min="0" max="100" value="${v}" data-input="threshold">

    </div></section>`;
}
function renderDist(v) {
  const open = S.jobs.filter((j) => j.status === 'OPEN' && j.inbox !== 'dismissed');

/* ===================== Bewerbungen ===================== */

const stageColor = (st) => STAGES[stageIndex(st)].color;

function renderPipeline(r) {
  const phase = [...PIPE_GROUPS, 'CLOSED'].includes(r.q.phase) ? r.q.phase : null;
  const q = ui.pipeQ.trim().toLowerCase();
  const match = (j) => !q || `${j.title} ${j.company} ${j.city}`.toLowerCase().includes(q);
  const due = dueJobs().length;
  const groups = (phase === 'CLOSED' ? [] : phase ? [phase] : PIPE_GROUPS).map((st) => ({ st, jobs: pipelineJobs(st).filter(match) })).filter((g) => g.jobs.length);
  const closed = closedJobs().filter(match);
  const closedOpen = r.q.abgeschlossen === '1' || phase === 'CLOSED' || (!!q && closed.length > 0);
  const closedSec = (!phase || phase === 'CLOSED') && closedJobs().length && (!q || closed.length) ? renderClosedSec(closed, closedOpen, phase === 'CLOSED') : '';
  const empty = q ? `Keine Bewerbung passt zu „${esc(ui.pipeQ)}“.` : 'Keine Bewerbung in dieser Phase. Sobald eine Stelle sie erreicht, erscheint sie hier.';
  const list = groups.length || closedSec
    ? `<section class="card plist" aria-label="Bewerbungen nach Phase">${groups.map(phaseSection).join('')}${closedSec}</section>`

  return `<div class="pane"><div class="page-head"><div><h1 class="page-title">Bewerbungen</h1><p class="page-lede"><b>${activeJobs().length} aktiv</b>${due ? `, davon <b>${due} fällig</b>` : ''}. Sortiert nach Phase, darin nach Wartezeit.</p></div>

    ${renderFunnel(phase)}

    ${list}</div>`;
}
function phaseSection({ st, jobs }) {

function jobCell(j) {

function renderClosedSec(closed, open, forced) {

  srcOnlyMatches: (d, el) => { srcById(d.id).notify.onlyMatches = el.checked; },
  asPick: (d, el) => { ui.addSource.picked[Number(d.i)] = el.checked; },
  asSchedule: (d, el) => { ui.addSource.schedule = el.value; },
  tplUpload: (d, el) => {
    const file = el.files && el.files[0]; if (!file) return;
    const t = { id: 'tpl' + (++S.nextId), type: d.type, name: 'Eigene Vorlage', meta: `${file.name} · hochgeladen ${fmtD(now())}`, layout: d.type === 'cv' ? 'accent' : 'letter', state: 'Vorlage wird gelesen …' };
    S.templates.push(t); el.value = '';
    const task = startTask({ kind: 'fill', label: `Vorlage befüllen: ${file.name}`, sub: 'Vorlage wird gelesen', pct: 0.2 });
    runSteps(task, [
      { ms: 1200, fn: () => { t.state = 'KI befüllt Vorlage …'; task.sub = 'Profildaten übertragen'; task.pct = 0.55; } },
      { ms: 1800, fn: () => { t.state = 'Vorschau wird gesetzt …'; task.sub = 'PDF rendern'; task.pct = 0.85; } },
      { ms: 1000, fn: () => {} },
    ], () => { t.state = 'ready'; toast(`Vorlage „${esc(file.name)}“ ist fertig befüllt.`, { actions: [{ label: 'Als Standard festlegen', act: 'tplDefault', data: `data-id="${t.id}"` }] }); });
  },
  certUpload: (d, el) => { const file = el.files && el.files[0]; if (!file) return; S.certs.unshift({ id: ++S.nextId, name: file.name.replace(/\.[^.]+$/, ''), kind: 'Zeugnis', date: `${pad(now().getMonth() + 1)}/${now().getFullYear()}`, size: `${Math.max(1, Math.round(file.size / 1024))} KB`, attach: false }); el.value = ''; toast(`${esc(file.name)} hochgeladen.`, { icon: 'upload' }); render(); },
  certAttach: (d, el) => { S.certs.find((x) => x.id === Number(d.id)).attach = el.checked; },
  setTz: (d, el) => { S.settings.tz = el.value; },
  toggleEvent: (d, el) => { S.settings.events[d.k] = el.checked; },
  setStorage: (d, el) => { S.settings.storage = el.value; render(); },
  aiProvider: (d, el) => { const t = S.aiTasks.find((x) => x.id === d.id); t.provider = el.value; t.model = MODELS[el.value][0]; render(); },
  aiModel: (d, el) => { S.aiTasks.find((x) => x.id === d.id).model = el.value; },
  userRole: (d, el) => { S.users[Number(d.i)].role = el.value; toast(`Rolle von ${esc(S.users[Number(d.i)].name)}: ${esc(el.value)}.`); },
  noop: () => {},
};
const INPUT = {
  applyDate: (d, el) => { ui.applyDate[d.id] = el.value; },
  instr: (d, el) => { ui.instrText[d.key] = el.value; },
  notes: (d, el) => { J(d).notes = el.value; const h = $(`notes-state-${d.id}`); if (h) h.textContent = 'Gespeichert'; },
  // Preview only: nothing moves until "Übernehmen".
  threshold: (d, el) => {
    const v = Math.max(0, Math.min(100, Number(el.value) || 0));
    ui.thrDraft = v;
    const other = el.type === 'range' ? $('thr') : $('thr-range');
    if (other) other.value = v;
    const hint = $('thr-hint'); if (hint) hint.textContent = thresholdHint(v);
    const dist = $('thr-dist'); if (dist) dist.innerHTML = renderDist(v);
    const apply = $('thr-apply'); if (apply) apply.disabled = v === S.threshold;
  },
  search: (d, el) => { ui.search = el.value; const box = $('search-results'); if (box) box.innerHTML = searchResults(); },
  pipeSearch: (d, el) => { ui.pipeQ = el.value; render(); },
  asUrl: (d, el) => { ui.addSource.url = el.value; },
  asPattern: (d, el) => { ui.addSource.pattern = el.value; },
  asName: (d, el) => { ui.addSource.name = el.value; },
  impUrl: (d, el) => { ui.importer.url = el.value; },
  deleteConfirm: (d, el) => { ui.deleteAccount = el.value; const b = document.querySelector('[data-act="deleteAccount"]'); if (b) b.disabled = el.value !== 'LÖSCHEN'; },
};
function readProfileForm() {
  const role = $('pf-role'); if (role) PROFILE.role = role.value;
  const sal = $('pf-sal'); if (sal) PROFILE.salaryMin = Number(sal.value) || PROFILE.salaryMin;
}
function closeToast(tid) { if (tid) dropToast(tid); }
function markDoneSeen() { ui.doneMark = ui.doneSeen; ui.doneSeen = S.done.length; }
function closeTopLayer() {
  const r = route();
  if (ui.searchOpen) { ui.searchOpen = false; render(); return true; }
  if (ui.popover) { ui.popover = null; render(); return true; }
  if (ui.bigPreview) { ui.bigPreview = null; render(); return true; }
  if (ui.moreOpen) { ui.moreOpen = false; render(); return true; }
  if (ui.addSource) { ui.addSource = null; render(); return true; }
  if (ui.importer) { ui.importer = null; render(); return true; }
  if (ui.confirm) { ui.confirm = null; render(); return true; }
  if (ui.editing) { ui.editing = null; render(); return true; }
  if (r.q.job && (r.page === 'bewerbungen' || r.page === 'eingang')) { setQuery({ job: null }); restoreReturnFocus(); return true; }
  if (r.q.quelle) { ui.srcDelete = null; setQuery({ quelle: null }); restoreReturnFocus(); return true; }
  return false;
}
function restoreReturnFocus() {
  const sel = ui.returnFocus; ui.returnFocus = null;
  if (sel) setTimeout(() => document.querySelector(sel)?.focus({ preventScroll: true }), 0);
}

/* ===================== theme ===================== */
function getPref(k, def) { try { return localStorage.getItem('ajp-' + k) || def; } catch (e) { return def; } }
function setPref(k, v) { try { localStorage.setItem('ajp-' + k, v); } catch (e) { /* storage unavailable: preference lasts for this session only */ } prefs[k] = v; }
const prefs = { theme: getPref('theme', 'system') };
const getTheme = () => prefs.theme;
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const mode = prefs.theme === 'system' ? (darkQuery.matches ? 'dark' : 'light') : prefs.theme;
  document.documentElement.dataset.mode = mode;
}

/* ===================== prototype control ===================== */
const PROTO_LINKS = [
  ['Bildschirme', [['#/eingang', 'Eingang'], ['#/bewerbungen', 'Bewerbungen'], ['#/bewerbungen?phase=APPLIED', 'Bewerbungen, nur Beworben'], ['#/bewerbungen?abgeschlossen=1', 'Bewerbungen mit Abgeschlossenen'], ['#/quellen', 'Quellen'], ['#/profil/ziel', 'Profil'], ['#/einstellungen/allgemein', 'Einstellungen'], ['act:openSearch', 'Suche (Taste /)']]],
  ['Eingang', [['act:forceFirstRun', 'Neuinstallation: Ersteinrichtung'], ['#/eingang/leer', 'Leerer Eingang'], ['#/eingang?tab=unter', 'Unter Schwellwert mit Regler'], ['#/eingang?tab=aus', 'Von dir aussortiert'], ['#/eingang?job=5', 'Treffer mit Ausschlusskriterium'], ['#/job/1', 'Treffer als Seite']]],
  ['Stelle in Phase …', [['#/job/8', 'Vorgemerkt, ohne Recherche'], ['#/job/3?reiter=unterlagen', 'Vorgemerkt, Unterlagen halb fertig'], ['#/job/9', 'Vorgemerkt, bereit zum Bewerben'], ['#/job/10', 'Beworben, Nachfassen fällig'], ['#/bewerbungen?job=10', 'Dasselbe als Schnellansicht'], ['#/job/11', 'Beworben, warten'], ['#/job/12', 'Interview, ohne Vorbereitung'], ['#/job/13?reiter=interview', 'Interview mit Vorbereitung'], ['#/job/14', 'Angebot'], ['#/job/15?reiter=verlauf', 'Abgeschlossen (Absage)']]],
  ['Weitere Zustände', [['#/quellen?quelle=indeed', 'Quelle mit Fehler'], ['act:openAddSource', 'Quelle hinzufügen'], ['act:openImport', 'Stelle per URL importieren'], ['#/profil/lebenslauf', 'Lebenslauf mit Hinweis'], ['#/profil/vorlagen', 'Vorlagen'], ['#/einstellungen/benachrichtigungen', 'Benachrichtigungen'], ['#/einstellungen/ki-aufgaben', 'KI-Aufgaben'], ['#/anmelden', 'Anmeldung']]],
];
function renderProto() {
  const p = $('proto');
  const panel = ui.protoOpen ? `<div class="proto-panel" role="dialog" aria-label="Prototyp-Steuerung">
    <h2>Darstellung</h2><div class="seg">${[['light', 'Hell'], ['dark', 'Dunkel'], ['system', 'System']].map(([v, l]) => `<button type="button" aria-pressed="${prefs.theme === v}" data-act="setTheme" data-v="${v}">${l}</button>`).join('')}</div>
    <h2>Springen zu</h2><ul class="proto-links">${PROTO_LINKS.map(([g, links]) => `<li class="grp">${g}</li>${links.map(([h, l]) => `<li>${h.startsWith('act:') ? `<a href="#" data-act="protoJump" data-target="${h.slice(4)}">${l}</a>` : `<a href="${h}">${l}</a>`}</li>`).join('')}`).join('')}</ul>
    <div class="row" style="margin-top:12px">${btn('Daten zurücksetzen', 'resetData', { cls: 'btn-sm btn-ghost', ico: 'refresh' })}</div></div>` : '';
  p.innerHTML = `${panel}<div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-sm btn-primary proto-toggle" data-act="protoToggle" aria-expanded="${ui.protoOpen}" aria-label="Prototyp-Steuerung">${icon(ui.protoOpen ? 'x' : 'sliders')}<span class="lbl">Prototyp</span></button></div>`;
}
ACT.protoJump = (d, el, e) => { e.preventDefault(); ui.protoOpen = false; if (d.target === 'openAddSource') { go('#/quellen'); ACT.openAddSource(); } else ACT[d.target](); renderProto(); };

/* ===================== event wiring ===================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (ui.popover && !e.target.closest('.popover, [data-popover-trigger]')) { ui.popover = null; if (!el) { render(); return; } }
  if (!el || el.disabled || el.closest('[contenteditable="true"]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')?.startsWith('#/')) e.preventDefault();
  if (el.tagName === 'A' && el.dataset.act === 'toastClose') { fn(el.dataset, el, e); return; }
  fn(el.dataset, el, e);
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el.dataset, el, e); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el.dataset, el, e); });
document.addEventListener('submit', (e) => { e.preventDefault(); if (e.target.dataset.submit === 'login') go('#/eingang'); });
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape') { if (closeTopLayer()) e.preventDefault(); return; }
  const typing = t.matches && t.matches('input, textarea, select, [contenteditable="true"]');
  if (e.key === '/' && !typing && !$('overlay').innerHTML && $('main')) { e.preventDefault(); ACT.openSearch(); return; }
  if (e.key === 'Enter' && t.id === 'search-q') { const hit = searchHits()[0]; if (hit) { e.preventDefault(); ACT.searchJob({ id: hit.id }); } return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) { e.preventDefault(); ACT[t.dataset.enter]({ ...t.dataset, src: t.id }, t, e); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-act]:not(button):not(a):not(input)')) { e.preventDefault(); t.click(); return; }
  if (e.key === 'Tab') trapFocus(e);
});
function trapFocus(e) {
  const dlg = document.querySelector('#overlay [aria-modal="true"]');
  if (!dlg) return;
  const items = [...dlg.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not(.sr-only), select, textarea, [tabindex="0"]')].filter((x) => x.offsetParent !== null);
  if (!items.length) return;
  const first = items[0]; const last = items[items.length - 1];
  if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
let lastOverlayKey = '';
window.addEventListener('hashchange', () => {
  const r = route();
  ui.popover = null; ui.moreOpen = false; ui.confirm = null; ui.searchOpen = false; ui.bigPreview = null;
  if (r.page === 'eingang' && r.sub === 'start') { startFirstRun(); history.replaceState(null, '', '#/eingang'); }
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  if (r.page !== 'quellen' && r.page !== 'eingang') ui.addSource = null;
  render();
  const key = $('overlay').innerHTML ? ($('overlay').querySelector('[data-anim-key]')?.dataset.animKey || '') : '';
  if (key && key !== lastOverlayKey) $('overlay').querySelector('[aria-modal="true"]')?.focus();
  if (!key) window.scrollTo(0, r.page === 'job' ? 0 : window.scrollY);
  lastOverlayKey = key;
});
darkQuery.addEventListener('change', () => { applyTheme(); });
window.matchMedia('(max-width: 767px)').addEventListener('change', () => render());
window.matchMedia('(min-width: 1200px)').addEventListener('change', () => render());
document.addEventListener('scroll', (e) => { const t = e.target; if (t && t.classList && t.classList.contains('is-overflow')) t.classList.toggle('at-end', t.scrollLeft + t.clientWidth >= t.scrollWidth - 2); }, true);
window.addEventListener('resize', () => markOverflow());
const toastOf = (el) => el && el.closest && el.closest('.toast');
document.addEventListener('mouseover', (e) => { const t = toastOf(e.target); if (t) pauseToast(t.id); });
document.addEventListener('mouseout', (e) => { const t = toastOf(e.target); if (t && !t.contains(e.relatedTarget)) resumeToast(t.id); });
document.addEventListener('focusin', (e) => { const t = toastOf(e.target); if (t) pauseToast(t.id); });
document.addEventListener('focusout', (e) => { const t = toastOf(e.target); if (t && !t.contains(e.relatedTarget)) resumeToast(t.id); });

/* ===================== boot ===================== */
applyTheme();
(function boot() {
  if (!location.hash) history.replaceState(null, '', '#/eingang');
  if (route().page === 'eingang' && route().sub === 'start') { startFirstRun(); history.replaceState(null, '', '#/eingang'); }
  const r = route();
  if (r.q.reiter && (r.sub || r.q.job)) ui.jobTab[Number(r.page === 'job' ? r.sub : r.q.job)] = r.q.reiter;
  render();
})();
</script>
